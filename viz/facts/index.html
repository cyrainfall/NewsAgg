<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NewsAgg · 工作过程可视化</title>
<style>
:root{
  --bg:#0d1117; --bg2:#12181f; --panel:#161b22; --panel2:#1c232b;
  --line:#2b333d; --line2:#3a444f;
  --fg:#e6edf3; --fg2:#9aa7b4; --fg3:#6e7b8a;
  --accent:#4a9eff; --accent2:#7ee787;
  --warn:#d29922; --danger:#f85149; --purple:#bc8cff; --pink:#ff7b9c;
  --mono:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.6;overflow:hidden}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{
  display:flex;align-items:center;gap:18px;padding:10px 18px;
  background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap;
}
header h1{font-size:15px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
header h1 span{color:var(--accent)}
.sub{font-size:11.5px;color:var(--fg3);white-space:nowrap}
.spacer{flex:1}
.stats{display:flex;gap:14px;font-size:11.5px;color:var(--fg2);font-family:var(--mono);flex-wrap:wrap}
.stats b{color:var(--accent2);font-weight:600}
.searchbox{position:relative}
#search{
  background:var(--panel);border:1px solid var(--line2);color:var(--fg);
  padding:6px 10px 6px 28px;border-radius:6px;font-size:12.5px;width:230px;
  font-family:var(--sans);outline:none;
}
#search:focus{border-color:var(--accent)}
.searchbox svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);opacity:.5}
main{display:grid;grid-template-columns:250px minmax(0,1fr) minmax(0,1.15fr);overflow:hidden;min-height:0}
.col{overflow-y:auto;overflow-x:hidden;min-height:0}
.col::-webkit-scrollbar{width:9px}
.col::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
.col::-webkit-scrollbar-track{background:transparent}
#rail{background:var(--bg2);border-right:1px solid var(--line)}
#detail{background:var(--bg);border-right:1px solid var(--line)}
#viewer{background:var(--panel)}
.group{padding:12px 14px 4px}
.group-t{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--fg3);font-weight:600;margin-bottom:7px;
}
.node-i{
  display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;
  padding:6px 8px;border-radius:6px;cursor:pointer;margin-bottom:2px;
  border:1px solid transparent;
}
.node-i:hover{background:var(--panel2)}
.node-i.on{background:var(--panel2);border-color:var(--line2)}
.node-i.hide{display:none}
.node-i .step{
  font-family:var(--mono);font-size:11px;color:var(--fg3);
  text-align:right;padding-top:1px;white-space:nowrap;
}
.node-i[data-layer=collect] .step{color:var(--accent)}
.node-i[data-layer=triage] .step{color:var(--purple)}
.node-i[data-layer=write] .step{color:var(--accent2)}
.node-i[data-layer=publish] .step{color:var(--pink)}
.node-i[data-layer=gate] .step{color:var(--warn)}
.node-i[data-layer=ci] .step{color:var(--fg2)}
.node-i[data-layer=sediment] .step{color:var(--purple)}
.node-i[data-layer=orchestrate] .step{color:var(--fg2)}
.node-i[data-layer=file] .step{color:var(--fg3)}
.file-i .nm{font-family:var(--mono);font-size:11.5px}
.node-i .nm{font-size:12.5px;line-height:1.35;word-break:break-word}
.node-i .nm small{display:block;color:var(--fg3);font-size:10.5px;font-family:var(--sans);margin-top:1px}
/* ── detail ── */
.d-head{padding:16px 20px 12px;border-bottom:1px solid var(--line);background:var(--bg2)}
.d-step{
  font-family:var(--mono);font-size:11px;color:var(--accent);
  letter-spacing:.08em;margin-bottom:3px;
}
.d-title{font-size:17px;font-weight:600;margin-bottom:8px;line-height:1.35}
.d-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tag{
  font-size:11px;padding:2px 7px;border-radius:4px;
  background:var(--panel2);color:var(--fg2);border:1px solid var(--line);
}
.tag.who{color:var(--accent2)}
.tag.when{color:var(--warn)}
.d-one{font-size:13px;color:var(--fg2);line-height:1.65}
.d-body{padding:14px 20px 40px}
.sec{
  font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--fg3);
  font-weight:600;margin:16px 0 7px;padding-bottom:4px;border-bottom:1px solid var(--line);
}
ul.list{list-style:none}
ul.list li{
  position:relative;padding-left:15px;margin-bottom:6px;
  font-size:12.5px;line-height:1.65;color:var(--fg);
}
ul.list li::before{content:'·';position:absolute;left:3px;color:var(--accent);font-weight:700}
ul.list.why li::before{content:'?';color:var(--fg3)}
ul.list.why li{color:var(--fg2)}
.adr{
  font-family:var(--mono);font-size:11px;color:var(--warn);
  background:rgba(210,153,34,.12);padding:1px 4px;border-radius:3px;
}
.fgroup{margin-top:10px}
.fg-t{
  font-size:11.5px;color:var(--fg2);margin-bottom:6px;
  display:flex;align-items:center;gap:6px;
}
.cnt{font-family:var(--mono);font-size:10.5px;color:var(--fg3)}
.fcard{
  border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin-bottom:5px;
  cursor:pointer;background:var(--bg2);transition:border-color .12s,background .12s;
}
.fcard:hover{border-color:var(--line2);background:var(--panel2)}
.fcard.on{border-color:var(--accent);background:var(--panel2)}
.fc-top{display:flex;align-items:center;gap:6px}
.fc-ico{font-size:9px;color:var(--fg3);width:10px;flex-shrink:0}
.fc-path{
  font-family:var(--mono);font-size:11px;flex:1;
  word-break:break-all;line-height:1.4;
}
.fc-lines{color:var(--accent);font-family:var(--mono);font-size:11px}
.badge-rw{
  font-size:9.5px;padding:1px 5px;border-radius:3px;flex-shrink:0;
  font-family:var(--mono);
}
.badge-rw.r{background:rgba(74,158,255,.15);color:var(--accent)}
.badge-rw.w{background:rgba(126,231,135,.15);color:var(--accent2)}
.fc-note{font-size:11px;color:var(--fg3);margin-top:3px;padding-left:16px;line-height:1.45}
/* ── viewer ── */
.v-empty{
  height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;color:var(--fg3);font-size:12.5px;text-align:center;padding:20px;
}
.v-empty kbd{
  font-family:var(--mono);font-size:10.5px;background:var(--panel2);
  border:1px solid var(--line2);border-radius:3px;padding:1px 5px;
}
.v-head{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0;z-index:2}
.v-path{font-family:var(--mono);font-size:12px;color:var(--accent);word-break:break-all;margin-bottom:5px}
.v-note{font-size:12px;color:var(--fg2);line-height:1.55;margin-bottom:6px}
.v-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.v-src{font-size:10.5px;color:var(--fg3);line-height:1.5}
pre.code{
  font-family:var(--mono);font-size:11.5px;line-height:1.65;
  padding:10px 0 40px;overflow-x:auto;
}
pre.code .row{display:flex;padding:0 12px;white-space:pre}
pre.code .row:hover{background:rgba(255,255,255,.03)}
pre.code .row.hl{background:rgba(210,153,34,.13)}
pre.code .ln{
  width:52px;flex-shrink:0;text-align:right;padding-right:12px;
  color:var(--fg3);user-select:none;opacity:.65;
}
pre.code .tx{white-space:pre;color:var(--fg)}
pre.code .hit{background:rgba(210,153,34,.32);border-radius:2px;color:#fff}
</style>
</head>

下来，收尾 `git push origin main` 推的是**本地 main**，今天的提交\n#      留在特性分支上，而脚本照样打印「已推送 origin/main」。\n# 所以：一律按**当前分支**取远端，并在起跑时把分支名说一遍。\ncurrent_branch() {\n  local b\n  b=\"$(git rev-parse --abbrev-ref HEAD 2>/dev/null || true)\"\n  if [[ -z \"$b\" || \"$b\" == \"HEAD\" ]]; then echo \"main\"; else echo \"$b\"; fi\n}\n\nBRANCH=\"$(current_branch)\"\nif [[ \"$BRANCH\" != \"main\" ]]; then\n  echo \"分支：${BRANCH}（不是 main）——本轮的所有提交都会落在这个分支上\" >&2\n  echo \"      这与 ADR-0065 有关：编排器不再假定你在 main 上。\" >&2\nfi"}]}, {"id": "n02-style", "step": "②", "title": "风格学习（循环 B）", "layer": "sediment", "when": "① 之后、分拣之前", "actor": "脚本 + 物主", "one_liner": "对比「发布那一刻的快照」与「你后来改过的教学副本」，把你的修改学成风格偏好。", "does": ["从 git 历史取发布快照做基线（不取 draft，避免把审稿环节的 AI 改动当成你的偏好）。", "按内容 sha256 去重，同一版本只学一次——否则你分几天改同一篇会被计多次，凭空击穿 wewrite 的「重复≥2 次升级为硬规则」阈值。", "脚本只记录 diff；pattern 提取（这次修改反映了什么偏好）是判断，留给物主/agent。"], "why": ["ADR-0026 循环 B：时刻必须早于写作——这一轮学到的东西今天就要用上。", "ADR-0008：人从「发布前审批」退到「发布后反馈」；你的修改是唯一真实信号源。"], "reads": [{"path": ".newsagg/publish-ledger.jsonl", "start": null, "end": null, "loc": "第 6 行 / 共 6 行（JSON 已格式化便于阅读）", "note": "发布账本：风格 diff 的基线与指针", "total": 6, "text": "{\n  \"at\": \"2026-10-31T21:54:25.013907+08:00\",\n  \"slug\": \"2026-10-31-ai-content-price-anchor-is-zero\",\n  \"title\": \"AI电影票房150万：有人替观众付了钱，你卖不上价\",\n  \"title_on_platform\": \"AI电影票房150万：有人替观众付了钱，你卖不上价\",\n  \"mode\": \"publish\",\n  \"steps\": [\n    {\n      \"step\": \"auth_check\",\n      \"backend\": \"browser\",\n      \"attempt\": 1,\n      \"ok\": true\n    },\n    {\n      \"step\": \"publish\",\n      \"backend\": \"browser\",\n      \"mode\": \"publish\",\n      \"code\": 0,\n      \"kind\": \"unknown\"\n    }\n  ],\n  \"stdout_tail\": \"{\\n  \\\"success\\\": true,\\n  \\\"action\\\": \\\"published\\\",\\n  \\\"title\\\": \\\"AI电影票房150万：有人替观众付了钱，你卖不上价\\\",\\n  \\\"expected_title\\\": \\\"AI电影票房150万：有人替观众付了钱，你卖不上价\\\",\\n  \\\"title_truncated_by_platform\\\": false,\\n  \\\"url\\\": \\\"https://mp.toutiao.com/profile_v4/graphic/publis in/env python3\n\"\"\"风格回路：把「已学的 diff 记录」补上 patterns（agent 判断的确定性外壳）。\n\n为什么需要这个脚本（ADR-0026 循环 B 的最后一环）：\n`wewrite learn-edits` **只记录 diff、不提取 pattern**——其源码里\n`\"patterns\": []` 带注释 \"Agent fills these after analyzing the draft and final\"。\n这是 wewrite「prompt 负责判断，Python 负责确定性」的分工：提取\"这次修改反映了\n什么偏好\"是判断，属 agent。\n\n因此闭环需要两步：\n  1. style_learn.py  → 调 learn-edits，产出 lesson YAML（patterns 为空）\n  2. 本脚本          → 读出 lesson 里引用的 draft/final，把两者内容一并输出，\n                       供 agent 阅读并写出 patterns\n\n本脚本**不做判断**：不猜 pattern，只把判断所需的材料准备好、并在 agent 写完后\n把 patterns 合并回 lesson 文件（保持 wewrite 期望的 YAML 结构）。\n\n用法：\n  # 准备材料（agent 读它的输出后写 patterns）\n  python3 style_patterns.py --prepare\n\n  # 合并 agent 写好的 patterns（JSON 数组）"}, {"path": ".agents/skills/newsagg-collect/scripts/run_all.sh", "start": 551, "end": 563, "note": "编排器里的调用点", "total": 972, "text": "style_learn() {\n  log \"② 风格学习（若你改过教学副本）\"\n  # ⚠️ 输出文件**不能**写死 /tmp：那是 POSIX 路径，而这段 Python 里的字符串\n  # 不经过 MSYS 路径转换——Windows 上的 Python 会把它解析成 `C:\\tmp\\...`，\n  # 与 bash 的 /tmp 不是同一个目录，于是「文件读不到 → 静默跳过」。\n  # 2026-10-28 在本机实测：表现数据明明读回成功（reports/performance.jsonl\n  # 有新增），这里却报「无法解析」。改用仓内临时目录，并把路径**作为参数**\n  # 传给 Python（argv 会被 MSYS 正确转换）。\n  local out=\"$REPO/.newsagg/tmp/style.json\"\n  local err=\"$REPO/.newsagg/tmp/style.err\"\n  mkdir -p \"$REPO/.newsagg/tmp\"\n  # stderr **单独落盘**：Windows 下 stderr 是 GBK，混进 JSON 会让 json.load 以\n  # UnicodeDecodeError 失败，表现成「无法解析」——失败原因却看不见（ADR-0052）。"}]}, {"id": "n03-performance", "step": "②b", "title": "表现数据读回（循环 C）", "layer": "sediment", "when": "② 之后、分拣之前", "actor": "脚本（经 node + 浏览器会话）", "one_liner": "把每篇文章的展现/阅读读回来，与它自己的历史基准比，作为分拣的排序参考。", "does": ["用 gid（平台内容 ID）而非标题做归因——标题是软的，slug 才稳；老账本没 gid 时标题兜底。", "同一天重跑是「就地更新」而不是追加：否则同一篇在基准里算两遍。", "自身基准取历史中位数；连续 N 篇低于基准的一定比例才判持续低迷。", "阅读率有一个最小展现量门槛：展现量不足时算不出有意义的比率，返回 None 而不是一个数。", "**必须永不致命**：读不回来只写 performance-status.json + 简报呈现，不拖垮整轮。"], "why": ["ADR-0010/0037：表现数据是**软信号**——不据此自动降权或退役观点卡。每日一篇的样本量下，把噪音升成硬规则会适得其反。", "ADR-0006：表现读不回来 ≠ 系统没跑，看守必须能区   \"source\": \"api_item_info\",\n    \"got\": 14,\n    \"no_data\": [],\n    \"failed\": []\n  },\n  \"cookie_expiry\": {}\n}"}, {"path": "reports/2026-10-31.md", "start": 1, "end": 1, "note": "reports/performance.jsonl 是入库文件，跨环境保留", "total": 93, "text": "# NewsAgg 简报 2026-10-31"}], "files": [{"path": ".agents/skills/newsagg-performance/scripts/performance.py", "start": 43, "end": 61, "note": "阈值常量与解除方式", "total": 1224, "text": "# 经验值而非推导值（ADR-0014 的做法：记录在此以便复核，而不是因为经过了论证）。\n# 冷启动豁免 5 篇由本人选定，与 Q88「首周只看链路与是否愿署名」大致对齐。\nDEFAULTS = {\n    \"window\": 5,        # 基准取最近 N 篇的中位数\n    \"coldstart\": 5,     # 评估满 N 篇之前不建立基准、不判降频（ADR-0010）\n    \"low_ratio\": 0.5,   # 低于基准的这个比例算「明显低于」\n    \"low_streak\": 3,    # 连续 N 篇才算「持续低迷」\n}\n\nHOW_TO_CLEAR = (\n    \"人工确认表现已恢复后，删除 .newsagg/frequency.json 即可解除\"\n    \"（ADR-0010：恢复同样需要人工确认，系统不自动恢复）\"\n)\n\n# 读回后端。**默认 api**：纯 HTTP 路径不需要 Chrome，而 Chrome 恰恰是 2GB\n# 内存机器上最可能崩的东西（ADR-0023 记录过它把表现数据读回来搞挂的次数）。\n# browser 后端保留，是因为**只有它能看见微头条**（ADR-0047 的泄漏判据要数\n# 同标题出现几次）——所以发布反查仍走浏览器（publish.py 的 --verify-backend\n# 默认 auto，跟随写入后端）。"}, {"path": ".agents/skills/newsagg-performance/scripts/performance.py", "start": 266, "end": 275, "note": "阅读率的最小展现量：低于它返回 None，不返回一个数", "total": 1224, "text": "# 表现好」，也不是「作者该改标题」，它是「平台的展现还没来得及补上」。\n# 简报的信噪比是它唯一的资产（ADR-0055），一个 88.89% 混在 0.1% 里，会让人\n# 开始怀疑同一段里的每一个数字。\n#\n# 100 是经验值：本号正常文章的展现量在 600–2000 之间，而「刚发布不到一天」的\n# 那几篇是 7–9。取 100 把「还在补数据的窗口期」整段排除掉，又不会误伤任何一篇\n# 已经跑起来的文章。它和 `SOURCE_TTL_MINUTES` 同一类：**从数据分布里借来的常量，\n# 会随账号长大而需要重估**——所以要写在这儿，而不是散在分支里。\nMIN_SHOW_FOR_RATE = 100\n"}, {"path": ".agents/skills/newsagg-performance/scripts/performance.py", "start": 277, "end": 299, "note": "两条写路径的唯一实现", "total": 1224, "text": "def read_rate_of(metrics: dict) -> float | None:\n    \"\"\"按平台两个计数器算阅读率；算不出有意义的比率时返回 None。\n\n    三种「算不出」要分开记在心里（它们的原始数都留在 `metrics` 里）：\n    1. `showCount` 为 0/缺失 —— 没被展现，比率无定义（不是 0）。\n    2. `showCount` 低于 `MIN_SHOW_FOR_RATE` —— 样本太小，见常量上的说明。\n    3. 阅读数大于展现数 —— 两条计数不同步的窗口期（2026-10-28 实测 120%）。\n\n    三者的共同点是：**此刻算不出有意义的比率**，而下游（基准中位数、简报、\n    降频判定）只该看到「算不出」，不该看到「一个数」。\n\n    这是这两条写路径（浏览器拦截 / 纯 HTTP 列表）的**唯一实现**。它们曾经各写\n    一份，改口径时只改了一边（ADR-0042 记过同一类事故）。\n    \"\"\"\n    show = metrics.get(\"showCount\")\n    read = metrics.get(\"readCount\")\n    if not show or read is None:\n        return None\n    if show < MIN_SHOW_FOR_RATE:\n        return None\n    rate = read / show\n    if rate > 1.0:\n        return None"}, {"path": ".agents/skills/newsagg-performance/scripts/performance.py", "start": 599, "end": 619, "note": "自身基准 + 持续低迷判定", "total": 1224, "text": "def evaluate(records: list[dict], *, window: int, coldstart: int,\n             low_ratio: float, low_streak: int) -> dict:\n    \"\"\"对比自身基准，判断是否应降频（ADR-0010）。\"\"\"\n    series = latest_per_article(records)\n    evaluated = [r for r in series if r.get(\"read_rate\") is not None]\n\n    result: dict = {\n        \"articles_seen\": len(series),\n        \"articles_evaluated\": len(evaluated),\n        \"effective\": {\"window\": window, \"coldstart\": coldstart,\n                      \"low_ratio\": low_ratio, \"low_streak\": low_streak},\n        \"status\": \"ok\",\n        \"baseline_read_rate\": None,\n        \"threshold\": None,\n        \"low_streak\": 0,\n    }\n\n    if len(evaluated) < coldstart:\n        result[\"status\"] = \"cold_start\"\n        result[\"note\"] = (\n            f\"已评估 {len(evaluated)} 篇 < 冷启动豁免 {coldstart} 篇：\""}, {"path": ".agents/skills/newsagg-collect/scripts/run_all.sh", "start": 598, "end": 612, "note": "编排器：失败时把输出末行带出来（ADR-0052）", "total": 972, "text": "performance() {\n  log \"②b 表现数据（循环 C：读回 + 自身基准 + 降频判定，后端 ${PERF_BACKEND}）\"\n  # 同 ② 的理由：不写死 /tmp，路径作为参数传给 Python（MSYS 会转换 argv）。\n  local out=\"$REPO/.newsagg/tmp/perf.json\"\n  local err=\"$REPO/.newsagg/tmp/perf.err\"\n  mkdir -p \"$REPO/.newsagg/tmp\"\n  \"$PY\" .agents/skills/newsagg-performance/scripts/performance.py \\\n    --backend \"${PERF_BACKEND}\" > \"$out\" 2>\"$err\" || true\n  \"$PY\" - \"$out\" \"$err\" <<'PY'\nimport json, sys\ntry:\n    d = json.load(open(sys.argv[1], encoding=\"utf-8\"))\nexcept Exception:\n    # ADR-0052：这里原来只打印「无法解析」，把 traceback 留在临时文件里没人看，\n    # 于是「node 不在 PATH」被当成「数据读不到」静默丢了整整两天。"}]}, {"id": "n04-skipday", "step": "②c", "title": "降频跳过日闸门", "layer": "gate", "when": "②b 之后", "actor": "脚本", "one_liner": "若系统处于自动降频状态且今天是跳过日 → 只出简报，不采集不写作不发布。", "does": ["读 .newsagg/frequency.json 判定今天是不是跳过日。", "命中则写 run-status（stage=downshift_skip）、出简报、commit+push、exit 0。"], "why": ["ADR-0010：降频是自动的，**恢复必须人工确认**——删除 .newsagg/frequency.json 才解除。", "跳过日是设计行为，不是故障；但必须显式写进简报，让看守不把它当成「今日无选题」。"], "reads": [], "writes": [], "files": [{"path": ".agents/skills/newsagg-performance/scripts/performance.py", "start": 667, "end": 681, "note": "跳过日判定", "total": 1224, "text": "def is_skip_day(freq: dict | None, date: str) -> tuple[bool, str]:\n    \"\"\"降频生效后按隔日跳过。降频当日不跳，其后每个奇数日跳过。\"\"\"\n    if not freq or not freq.get(\"downshifted\"):\n        return False, \"\"\n    since = str(freq.get(\"since\") or \"\")\n    try:\n        d0 = datetime.strptime(since, \"%Y-%m-%d\").date()\n        d1 = datetime.strptime(date, \"%Y-%m-%d\").date()\n    except (ValueError, TypeError):\n        return False, \"\"\n    delta = (d1 - d0).days\n    if delta <= 0:\n        return False, f\"降频自 {since} 生效（当日仍发文）\"\n    if delta % 2 == 1:\n        return True, f\"降频中（ADR-0010）：自 {since} 起隔日发文，今日为跳过日\""}, {"path": ".agents/skills/newsagg-performance/scripts/performance.py", "start": 52, "end": 56, "note": "解除方式", "total": 1224, "text": "HOW_TO_CLEAR = (\n    \"人工确认表现已恢复后，删除 .newsagg/frequency.json 即可解除\"\n    \"（ADR-0010：恢复同样需要人工确认，系统不自动恢复）\"\n)\n"}, {"path": ".agents/skills/newsagg-collect/scripts/run_all.sh", "start": 648, "end": 662, "note": "编排器里的分支", "total": 972, "text": "skip_day_gate() {\n  local skip\n  skip=\"$(\"$PY\" .agents/skills/newsagg-performance/scripts/performance.py --check-skip 2>/dev/null \\\n    | \"$PY\" -c 'import json,sys\ntry: print(\"1\" if json.load(sys.stdin).get(\"skip\") else \"0\")\nexcept Exception: print(\"0\")' 2>/dev/null || echo 0)\"\n  if [[ \"$skip\" == \"1\" ]]; then\n    log \"②c 降频跳过日：今日不发文\"\n    echo \"系统处于自动降频状态（ADR-0010），今日为跳过日——只出简报，不采集不写作不发布。\"\n    echo \"解除：人工确认表现已恢复后删除 .newsagg/frequency.json。\"\n    write_status 1 \"downshift_skip\" \"降频跳过日（设计行为，非故障）\" \"\"\n    brief_now\n    sync_push \"降频跳过日\" || true\n    exit 0\n  fi"}]}, {"id": "n05-collect", "step": "③", "title": "采集", "layer": "collect", "when": "白天 08:00 / 13:00 / 18:00 各一次（纯脚本，不碰 git）；21:00 若候选池不存在则自愈补采", "actor": "脚本", "one_liner": "从本地 DailyHotApi 拉 7 个源的榜，归一化，按赛道词预筛，落到候选池。", "does": ["每次拉取都全量重取该源的榜单，并按 (source,id) 与已有候选合并。", "同日多次采集是**累积合并**不是覆盖：保留 first_seen，热度轨迹进 hot_history，掉榜的标 seen_in_last_run:false。", "每次采集追加一条 collection_runs，其中 kept_new 按「first_seen == 本次时刻」计数——它不等于本次 kept。", "每个源按自己的 TTL×1.5 判陈旧（不是统一阈值），github 这种 24h TTL 的源不会被误判。", "github 单源超时放宽到 75 秒，且预筛除 title 外还匹配 desc——它的 title 是英文仓库名，中文词表命中不了。"], "why": ["ADR-0006：白天采多次是为了捕捉**发酵过程**，只看最后一个快照就丢掉了这一维。", "ADR-0039：第二次采集时预筛仍会「保留很多条」，但可能全是旧的；取 kept 会把「没有新东西」显示成「采到很多新的」，所以 kept_new 单独算。", "ADR-0029：公开实例 api-hot.imsyy.top 实测 HTTP 000 已不可用 → 改依赖本地部署。", "ADR-0056：观测同时记 hot 与 rank/rank_total，位次跨度才是可比的趋势信号（hot 跨源不可比）。", "ADR-0085：账本写「timed out」而服务端写「fetch failed」——客户端 20 秒先弃权，真错误落不下来。75 秒让客户端活得比服务端久。"], "reads": [{"path": "platforms/niche.txt", "start": 1, "end": 16, "note": "赛道词典：命中任一关键词才成为候选（180 行，人为维护）", "total": 180, "text": "# NewsAgg 赛道词（赛道：AI 变现与开发者职业，技术深度作证据而非主题）\n#\n# 归属：本文件归本人所有，系统不直写（ADR-0018）。\n# 用途：采集层的赛道预筛（ADR-0016 第 1 步）。命中任一词即进入候选，\n#       否则落入 dropped 供审计。\n# 调优：跑一周后按 platforms/ 的漏筛/误筛观察增删。行首 # 为注释。\n#\n# 2026-10-21 改赛道（ADR-0050）：原「AI 与开发者工具 / 技术行业」在头条\n# 无读者——站内搜 Codex / MCP 零相关结果，而 AI 赚钱 / 程序员失业有真实互动。\n# 改为「AI 变现与开发者职业」，技术仍是论证材料，只是不再当选题主题。\n\n# ── 模型与 AI ──\nAI\n人工智能\n大模型\nLLM"}], "writes": [{"path": ".newsagg/candidates/2026-10-31.json", "start": null, "end": null, "note": "候选池元信息与计数", "total": 8749, "text": "{\n  \"collected_at\": \"2026-10-31T18:00:24.35341 es\": 180.0,\n      \"observations\": 2\n    },\n    {\n      \"source\": \"sspai\",\n      \"shape\": \"dailyhot\",\n      \"total\": 40,\n      \"from_cache\": false,\n      \"update_time\": \"2026-10-31T10:00:29.746Z\",\n      \"ok\": true,\n      \"age_minutes\": -0.1,\n      \"stale_threshold_minutes\": 180.0,\n      \"observations\": 2\n    }\n  ]\n}"}], "files": [{"path": ".agents/skills/newsagg-collect/scripts/collect.py", "start": 28, "end": 32, "note": "7 个默认源", "total": 651, "text": "DEFAULT_SOURCES = [\"toutiao\", \"36kr\", \"juejin\", \"csdn\", \"ithome\", \"sspai\", \"github\"]\n\n# 原始热榜接口（ADR-0029 的兜底路径）。形状与 DailyHotApi 不同，需归一化。\nRAW_ENDPOINTS = {\n    \"toutiao\": \"https://www.toutiao.com/hot-event/hot-board/?origin=toutiao_pc\","}, {"path": ".agents/skills/newsagg-collect/scripts/collect.py", "start": 61, "end": 69, "note": "github 单源 75 秒：让客户端活得比服务端久", "total": 651, "text": "# 和 ADR-0057（假的绿色）、ADR-0081（空转的闸）是同一类：**观测失真的代价大于故障本身**。\n#\n# 75 秒 = 3 × 20 秒 + 余量。代价是 github 真挂时该轮采集多等约 55 秒；\n# 一天三次采集，最坏多 2 分 45 秒，是可接受的确定性成本。\nSOURCE_TIMEOUTS = {\n    \"github\": 75,\n}\n\n# 预筛**除 title 之外还匹配 desc** 的源。"}, {"path": ".agents/skills/newsagg-collect/scripts/collect.py", "start": 72, "end": 81, "note": "github 的 title 是英文仓库名，预筛必须看 desc", "total": 651, "text": "# 全源一起匹配会把\"消费电子评测\"因为提到 AI 灌进池子（赛道预筛精度靠这个）。\n# github 是唯一例外：它的 title 是**英文仓库名**（`claude-mem` / `OpenBot` /\n# `ziwei-doushu`），中文关键词表基本命中不了，而它的 desc 是一句完整的项目说明——\n# 那个字段才是内容本身。\n# 2026-10-30 实测：15 条 trending 里只有 `claude-mem` 能靠仓库名命中 `Claude`；\n# 而它在连续成功采集的两天（10-27、10-28）进池条目都是 **0 条**，\n# 所以\"这个源到底有没有用\"在预筛改掉之前**根本测不出来**——\n# 一个每轮 0 产出、却唯一依赖代理的源，光看失败率会让人误判它\"只是不稳定\"。\nDESC_MATCH_SOURCES = {\"github\"}\n"}, {"path": ".agents/skills/newsagg-collect/scripts/collect.py", "start": 83, "end": 102, "note": "陈旧系数 1.5 是经验值，非推导值", "total": 651, "text": "# 陈旧阈值 = max(配置阈值, 源自身 TTL × STALE_TTL_FACTOR)。\n#\n# 为什么是乘一个系数而不是加「最大采集间隔」：在一次**采集时刻**能观察到的\n# 合法最大年龄就是 TTL 本身，不需要加采集间隔——\n#   - 请求落在缓存有效期内 → 返回缓存，age ≤ TTL；\n#   - 请求落在缓存过期之后 → 触发重新填充 → age ≈ 0。\n# 也就是说**过期后的那次请求会把数据刷新掉，年龄不会累积到 TTL 之上**。\n# （曾经想过 `TTL + 最大采集间隔`，那是把\"缓存过期\"与\"没被重取\"混为一谈，\n#  会把短周期源一起放宽：toutiao 会从 3h 变 15h，那是回归。）\n#\n# 实测印证（github，TTL 24h）：2026-10-17 13:21 CST 填充 → 18:00 时 age=4.7h\n# → 2026-10-18 08:11 时 age=18.8h（仍在有效期内）→ 次日 13:00 过期并刷新 → age≈0。\n# 观测最大值 18.8h < TTL 24h ✓。\n#\n# 系数 > 1 只留边界余量：年龄正好等于 TTL 时是**边界**，定时抖动会让它反复在\n# 陈旧/不陈旧之间翻转，于是告警变成噪音。1.5 意味着\"超出刷新周期一半才算陈旧\"。\n# 这是经验值，非推导值（与 ADR-0016/0031/0037 的阈值同策略：先记下、后实测）。\nSTALE_TTL_FACTOR = 1.5\n\nUA = ("}, {"path": ".agents/skills/newsagg-collect/scripts/collect.py", "start": 423, "end": 453, "note": "同日累积合并规则", "total": 651, "text": "    if rank is not None:\n        obs[\"rank\"] = rank\n        # 深度必须和 rank 一起进观测：位次要归一成稳定刻度才能跨快照相减，\n        # 而「池内名次」会随赛道预筛的池子大小漂移（见 normalize_rank_total）。\n        total = item.get(\"rank_total\")\n        if total is not None:\n            obs[\"rank_total\"] = total\n    return obs\n\n\ndef item_key(it: dict) -> str:\n    return f\"{it.get('source')}:{it.get('id')}\"\n\n\ndef merge_candidates(existing: dict, fresh: dict) -> dict:\n    \"\"\"把本次采集并入同日已有候选池（ADR-0006：采集 2–3 次以捕捉事件发酵过程）。\n\n    合并规则：\n    - 条目按 (source, id) 归并；**保留 first_seen**（第一次被看到的时间），\n      热度轨迹记进 hot_history —— 「发酵过程」正是这些中间值，而不是最后一个数字。\n    - 已有条目只更新热度/排名/封面等易变字段，不动 first_seen。\n    - 已恢复的源从 failures 中移除；sources 取并集。\n    - 每次采集追加一条 collection_runs，供简报呈现「今天采了几次、每次多少条」。\n    \"\"\"\n    merged = dict(fresh)\n    prev_items = {item_key(i): i for i in existing.get(\"items\", []) if item_key(i) != \"None:None\"}\n    prev_dropped = {item_key(i): i for i in existing.get(\"dropped\", []) if item_key(i) != \"None:None\"}\n\n    items: list[dict] = []\n    for it in fresh.get(\"items\", []):\n        old = prev_items.pop(item_key(it), None)"}, {"path": ".newsagg/candidates/2026-10-31.json", "start": null, "end": null, "note": "当天三次采集的真实记录", "total": 8749, "text": "{\n  \"collection_runs\": [\n    {\n      \"at\": \"2026-10-31T08:00:09.549086+08:00\",\n      \"fetched\": 213,\n      \"kept\": 80,\n      \"dropped\": 133,\n      \"sources_ok\": 5,\n      \"sources_failed\": 2,\n      \"kept_new\": 80\n    },\n    {\n      \"at\": \"2026-10-31T13:00:14.806938+08:00\",\n      \"fetched\": 283,\n      \"kept\": 108,\n      \"dropped\": 175,\n      \"sources_ok\": 7,\n      \"sources_failed\": 0,\n      \"kept_new\": 56\n    },\n    {\n      \"at\": \"2026-10-31T18:00:24.353419+08:00\",\n      \"fetched\": 268,\n      \"kept\": 96,\n      \"dropped\": 172,\n      \"sources_ok\": 6,\n      \"sources_failed\": 1,\n      \"kept_new\": 33\n    }\n  ]\n}"}, {"path": ".agents/skills/newsagg-collect/scripts/run_all.sh", "start": 666, "end": 672, "note": "编排器调用点；全源不可达才算失败", "total": 972, "text": "collect_now() {\n  log \"③ 采集（同日多次采集会累积合并，保留事件发酵过程）\"\n  if ! \"$PY\" .agents/skills/newsagg-collect/scripts/collect.py --base \"$HOT_BASE\"; then\n    fail_soft \"collect\" \"采集失败（全部源不可达）\" \"热榜服务 $HOT_BASE\" 1\n  fi\n}\n"}]}, {"id": "n06-triage-input", "step": "③b", "title": "组装分拣输入包", "layer": "triage", "when": "21:00 第 1 段，采集之后", "actor": "脚本", "one_liner": "把候选条目、全部 active 卡正文、冷却状态、限额、位次趋势、历史表现、议题台账装进一个大包。", "does": ["8 张 active 卡**全文**进包（含当前判断/依据事实/修订史/边界与反方五节）——只看卡名判不了匹配度。", "每张卡的 covered_events 由 cardfm.py 解析，这是全仓唯一实现。", "给每条候选算位次趋势 trend（state/delta/observations/position_source）。", "把议题台账里**未挂卡**的那几条也放进包：这个议题第几次出现、上一轮为什么不建。", "trend_summary 单独给出覆盖率；participant：unknown+absent 占大半时明确说「本轮 trend 没有信息量」。"], "why": ["ADR-0042：两份契约的两份实现一定会漂移，且漂移是静默的。三份 parse_frontmatter 漂移后，分拣层看不到「这张卡写过什么」而写作层看得到——同一轮里一个知道一个不知道。", "ADR-0056：刻度必须是同源位次百分位。池内名次会把退步读成爬升（rank 22→25 曾被判 climbing）。", "ADR-0007：covered_events 是防重复发文的唯一依据，读不到就等于没有「已覆盖」。", "ADR-0083：闸门只是兜底。模型看不见台账时只能每轮从零重推同一个结论，13 轮 0 张卡就是这么来的。"], "reads": [{"path": "knowledge/cards/personal-ai-monetization-is-paid-demand-not-technology.md", "start": 1, "end": 22, "note": "观点卡：frontmatter + 五节结构", "total": 136, "text": "---\nissue: 个人 AI 变现能不能赚钱由付费需求决定，不由技术决定\nstatus: active\ncreated: 2026-10-17\nlast_written: 2026-10-31\ncovered_events:\n  - 2026-10-18 个人 AI 变现出现正反两组可核对账本：Mole 从开源工具走到付费桌面版（用户主动要求付费）、拼豆 App 三个月 43 美元且 93% 付费用户次月流失；同期「陶华碧靠 AI 赚 54 亿」被事实核查（营收非利润、AI 只是质检、营收回升靠换回本地辣椒）\n  - 2026-10-25 个人 AI 变现第一次有了基数，而这个基数把「AI」这个变量从等式里划掉了：TrustMRR 抓取的 10,150 个真实收款产品里，AI 产品与非 AI 产品有收入的比例几乎一样（49.3% 对 49.0%，中位月收入 161 对 175 美元），只有 2.4% 做到年化 10 万美元，Top 1% 拿走 76.1% 的收入；细分到开发者工具，69% 一分钱没收到。与此同时，同一批数据给出了窗口为什么存在、又为什么会关：AI 让生产成本每年降约 10 倍，而客户的价格锚还停在「要请人做」的年代，中间的差额就是毛利窗口——窗口关闭不是因为技术退步，是因为价格锚被更新（妙鸭相机从「照相馆几百块」被拉到「AI 写真几块钱」，不到两年团队解散）。同一天池子里还有一份一手个案给这组数据配了注脚：一位开发者用 AI 独立做出一款零依赖、188 个测试全绿、工期压到四分之一的游戏，可交付性被拉满，而仓库 1 个 Star、直接收入 0 元、打赏为零。\n  - 2026-10-31 国内首部 AI 院线电影《三星堆：未来往事》上映超过一周，票房不足 150 万元，上座率基本在 1% 上下，豆瓣尚未开分；制作成本千万级，片方分账至今仅几十万元。片方已做让利：采用 20 元票房结算标准（低于传统电影），并把分账比例从常见的 43:57 调整为 40:60 主动让出 3 个百分点争取排片，仍未换来票房。对照同期的另一个 AI 内容项目：芒果 TV 首部 AI 剧集《后西游记》8 月底登湖南卫视黄金档，同样被吐槽画面不稳、表情僵硬，但因卫视与会员**免费**可见，热度与话题都不缺，芒果超媒股价几天涨了五成。上游机制是免费供给的规模：红果日活已达 1.68 亿、超过四家长视频之和，今年一季度全网上线微短剧 12 万多部、九成五以上是 AI 短剧，而免费本身就是红果的核心商业模式；观众在免费池里刷了大半年，对 AI 内容的价值判断定型为「免费、刷完即走」。价格因此向下传递：AI 短剧的万播收益从去年的三五十元至上百元，掉到今年的个位数。文章引行为经济学的价格锚定解释：人判断一件东西值多少钱，取决于他最早、最常见到的价格，而国内观众对 AI 内容的锚点就是零，且模型越进步、生成成本越低，免费供给只会更多更像样。\nsource: 用户指定建卡（2026-10-17），并提供了评估框架\n---\n# 个人 AI 变现能不能赚钱由付费需求决定，不由技术决定\n\n## 当前判断\n\n个人做 AI 变现，失败几乎不发生在技术侧。模型能力在被免费发放、工具链在成熟、套壳的成本趋近于零——**技术现在是最容易获得的一环，因此它不构成差异**。\n\n决定可行性的是一句话：**有没有人为一个具体问题持续付钱，以及你能不能以可接受的成本稳定交付它。**\n\n本卡用六个因子判断，且这六个因子的地位并不相等：\n\n**可行性 = 真实需求 × 付费意愿 × 可交付性 × 单位经济 × 合规安全 × 竞争壁垒**"}, {"path": ".newsagg/candidates/2026-10-31.json", "start": null, "end": null, "note": "候选池", "total": 8749, "text": "{\n  \"counts\": {\n    \"fetched\": 268,\n    \"kept\": 159,\n    \"dropped\": 312,\n    \"sources_ok\": 6,\n    \"sources_failed\": 1,\n    \"kept_new\": 33,\n    \"runs_today\": 3\n  }\n}"}], "writes": [{"path": ".newsagg/triage/2026-10-31-input.json", "start": null, "end": null, "note": "输入包（当日条目 / 全部卡 / 台账）", "total": 6413, "text": "{\n  \"prepared_at\": \"2026-10-31T21:00:34.043749+08:00\",\n  \"instruction\": \"对每条候选条目：先聚成事件，再判断接得住哪张卡，给出三态决策（skip / continue / new）。判据见 SKILL.md 的硬规则。候选条目上的 trend 是**同源位次变化**（ADR-0056），trend_summary 说明该信号的覆盖率——它退化时按当前热度排序。backlog.due 里的议题已达新建门槛：要么这一轮为它建卡，要么写下no_card_reason（见 SKILL.md 硬规则 3）。\",\n  \"limits\": {\n    \"max_articles_per_day\": 1,\n    \"max_new_cards_per_day\": 1,\n    \"cooldown_days\": 3.0\n  },\n  \"trend_summary\": {\n    \"computed_at\": \"2026-10-31T21:00:34.043749+08:00\",\n    \"thresholds\": {\n      \"climb_at_or_below\": -0.1,\n      \"cool_at_or_above\": 0.1,\n      \"min_observations\": 2\n    },\n    \"snapshots\": 18,\n    \"latest_snapshot_by_source\": {\n      \"toutiao\": \"2026-10-31T18:00:24.353419+08:00\",\n      \"36kr\": \"2026-10-31T18:00:24.353419+08:00\",\n      \"juejin\": \"2026-10-31T18:00:24.353419+08:00\",\n      \"csdn\": \"2026-10-31T18:00:24.353419+08:00\",\n      \"ithome\": \"2026-10-31T18:00:24.353419+08:00\",\n      \"sspai\": \"2026-10-31T18:00:24.353419+08:00\",\n      \"github\": \"2026-10-31T13:00:14.806938+08:00\"\n    },\n    \"by_state\": {\n      \"climbing\": 38,\n      \"steady\": 24,\n      \"cooling\": 1,\n      \"unknown\": 33,\n      \"absent\": 63\n    },\n    \"by_position_source\": {\n      \"hot\": 65,\n      \"rank\": 88,\n      \"none\": 6\n    },\n    \"note\": \"63/159 条可算趋势：climbing 38、steady 24、cooling 1；absent 63、unknown 33 不参与排序。 位次口径（整池 159 条）：hot 65、none 6、rank 88；`hot` 口径是 rank 覆盖不足两条时的**近似**位次，其 delta 精度低于上游 rank。\",\n    \"usage\": \"trend 参与排序、不参与打分（ADR-0056）：卡匹配度相当时，climbing 的聚簇优先于已经很高但 steady/cooling 的。它不设硬门槛，也不单独构成「值得写」的理由——没有新事实仍然跳过。\"\n  }\n}"}], "files": [{"path": ".agents/skills/newsagg-triage/scripts/cardfm.py", "start": 1, "end": 17, "note": "为什么必须是共享模块：三份拷贝漂移的后果", "total": 63, "text": "\"\"\"观点卡 frontmatter 的唯一解析实现（ADR-0042）。\n\n**为什么是共享模块而不是三份拷贝。** 这个解析器原本在 `triage.py` / `build_brief.py` /\n`writeback.py` 里各有一份。三份拷贝漂移了：`triage.py` 把「空值」记成空字符串 `\"\"`，\n而另外两份记成空列表 `[]`。后果是同一张卡在不同阶段被解析成不同形状——\n`writeback.py` 写回 `covered_events` 时把空列表展开成多行列表项，此后\n`triage.py` 读到的是 `\"\"` 而不是列表，于是**分拣层永远看不到「已覆盖事件」**，\n而 `build_brief.py` 看得到。分拣输入包里那张卡的 `covered_events` 因此恒为空。\n\n这与 ADR-0030 关于浏览器锁的教训是同一条：**同一份契约的两份实现会漂移，\n且漂移是静默的**（两处都「能跑」，只有对照才看得出来）。所以这里只留一份实现。\n\n调用方通过同目录导入（`sys.path` 里加上本文件所在目录），见三个脚本顶部的\n`_load_cardfm()`。\n\"\"\"\n\nfrom __future__ import annotations"}, {"path": ".agents/skills/newsagg-triage/scripts/triage.py", "start": 470, "end": 496, "note": "ADR-0083：台账必须放在模型眼前", "total": 886, "text": "def build_triage_input(candidates: dict, cards: list[dict], cooldown: dict,\n                       performance: dict | None = None,\n                       backlog: dict | None = None) -> dict:\n    \"\"\"组装模型的输入包：候选条目 + 全部卡 + 冷却状态 + 限额 + 历史表现参考。\n\n    ADR-0083 加了 `backlog` 一节。**这是本轮改动的关键**——闸门只是兜底，\n    模型看不见台账时它只能每轮从零重推同一个结论，13 轮 0 张卡就是这么来的。\n    把「这个议题第几次出现了、上一轮为什么不建」放在模型眼前，它才有据可依。\n    \"\"\"\n    trends, trend_summary = compute_trends(candidates.get(\"items\", []))\n    due = card_backlog.due_issues(backlog or {}, cards) if card_backlog else []\n    return {\n        \"prepared_at\": datetime.now(CST).isoformat(),\n        \"instruction\": (\n            \"对每条候选条目：先聚成事件，再判断接得住哪张卡，给出三态决策\"\n            \"（skip / continue / new）。判据见 SKILL.md 的硬规则。\"\n            \"候选条目上的 trend 是**同源位次变化**（ADR-0056），\"\n            \"trend_summary 说明该信号的覆盖率——它退化时按当前热度排序。\"\n            \"backlog.due 里的议题已达新建门槛：要么这一轮为它建卡，要么写下\"\n            \"no_card_reason（见 SKILL.md 硬规则 3）。\"\n        ),\n        \"limits\": {\n            \"max_articles_per_day\": 1,\n            \"max_new_cards_per_day\": 1,\n            \"cooldown_days\": None,  # 由调用方填入\n        },\n        \"cooldown_state\": cooldown,"}, {"path": ".agents/skills/newsagg-triage/scripts/triage.py", "start": 508, "end": 548, "note": "只给未挂卡的议题，外加上一轮的不建理由", "total": 886, "text": "def _backlog_block(backlog: dict, cards: list[dict], due: list[dict]) -> dict:\n    \"\"\"输入包里的台账视图。\n\n    只给**未挂卡**的议题全文（已建卡的议题对分拣没有信息量，只会稀释注意力），\n    外加最近一条 `no_card_reason`——「上一轮为什么没建」是这一轮最该读的一句话，\n    没有它，同一个决定会被无理由地重复一次。\n    \"\"\"\n    issues = (backlog or {}).get(\"issues\") or {}\n    have = {c.get(\"file\") for c in cards}\n    open_items = []\n    for e in issues.values():\n        if not isinstance(e, dict):\n            continue\n        cf = e.get(\"card_file\")\n        if cf and cf in have:\n            continue\n        reasons = e.get(\"reasons\") or {}\n        last_day = e.get(\"last_seen\")\n        open_items.append({\n            \"issue\": e.get(\"issue\"),\n            \"times_seen\": int(e.get(\"times_seen\") or 0),\n            \"first_seen\": e.get(\"first_seen\"),\n            \"last_seen\": last_day,\n            \"last_reason\": (reasons or {}).get(last_day) if isinstance(reasons, dict) else None,\n            \"events\": (e.get(\"events\") or [])[-3:],\n        })\n    open_items.sort(key=lambda x: (-x[\"times_seen\"], str(x[\"first_seen\"] or \"\")))\n    return {\n        # 数字一律读台账（`card_backlog.empty_backlog` 会种下默认值），\n        # 让 `due_issues` 实际用的阈值和这里报给人看的阈值是同一个。\n        \"threshold\": int((backlog or {}).get(\"threshold\")\n                         or (card_backlog.TIMES_SEEN_THRESHOLD if card_backlog else 2)),\n        \"review_days\": (card_backlog.REVIEW_DAYS if card_backlog else 30),\n        \"due\": [d[\"issue\"] for d in due],\n        \"open_issues\": open_items,\n        \"note\": (\n            \"同一个议题第二次出现就必须有卡，或者必须写下不建的理由（ADR-0083）。\"\n            \"`times_seen` 由脚本按天去重计数，不是模型自报——同一议题的措辞请保持稳定，\"\n            \"否则会计成两个议题（归一化只去标点、不合并语义）。\"\n            \"`due` 非空时这一轮只能二选一：action=new 为它建卡，或给 no_card_reason。\"\n        ),"}, {"path": ".agents/skills/newsagg-triage/scripts/triage.py", "start": 233, "end": 238, "note": "趋势阈值常量", "total": 886, "text": "TREND_CLIMB_DELTA = -0.10\nTREND_COOL_DELTA = 0.10\nTREND_MIN_OBSERVATIONS = 2\n\n\ndef _hot_int(value):"}, {"path": ".newsagg/triage/2026-10-31-input.json", "start": null, "end": null, "note": "这一轮趋势信号的真实覆盖率", "total": 6413, "text": "{\n  \"trend_summary\": {\n    \"computed_at\": \"2026-10-31T21:00:34.043749+08:00\",\n    \"thresholds\": {\n      \"climb_at_or_below\": -0.1,\n      \"cool_at_or_above\": 0.1,\n      \"min_observations\": 2\n    },\n    \"snapshots\": 18,\n    \"latest_snapshot_by_source\": {\n      \"toutiao\": \"2026-10-31T18:00:24.353419+08:00\",\n      \"36kr\": \"2026-10-31T18:00:24.353419+08:00\",\n      \"juejin\": \"2026-10-31T18:00:24.353419+08:00\",\n      \"csdn\": \"2026-10-31T18:00:24.353419+08:00\",\n      \"ithome\": \"2026-10-31T18:00:24.353419+08:00\",\n      \"sspai\": \"2026-10-31T18:00:24.353419+08:00\",\n      \"github\": \"2026-10-31T13:00:14.806938+08:00\"\n    },\n    \"by_state\": {\n      \"climbing\": 38,\n      \"steady\": 24,\n      \"cooling\": 1,\n      \"unknown\": 33,\n      \"absent\": 63\n    },\n    \"by_position_source\": {\n      \"hot\": 65,\n      \"rank\": 88,\n      \"none\": 6\n    },\n    \"note\": \"63/159 条可算趋势：climbing 38、steady 24、cooling 1；absent 63、unknown 33 不参与排序。 位次口径（整池 159 条）：hot 65、none 6、rank 88；`hot` 口径是 rank 覆盖不足两条时的**近似**位次，其 delta 精度低于上游 rank。\",\n    \"usage\": \"trend 参与排序、不参与打分（ADR-0056）：卡匹配度相当时，climbing 的聚簇优先于已经很高但 steady/cooling 的。它不设硬门槛，也不单独构成「值得写」的理由——没有新事实仍然跳过。\"\n  }\n}"}, {"path": ".newsagg/triage/2026-10-31-input.json", "start": null, "end": null, "note": "这一轮交给模型看的台账", "total": 6413, "text": "{\n  \"backlog\": {\n    \"threshold\": 2,\n    \"review_days\": 30,\n    \"due\": [],\n    \"open_issues\": [\n      {\n        \"issue\": \"AI 输出致害的责任归属\",\n        \"times_seen\": 1,\n        \"first_seen\": \"2026-10-29\",\n        \"last_seen\": \"2026-10-29\",\n        \"last_reason\": null,\n        \"events\": [\n          {\n            \"date\": \"2026-10-29\",\n            \"event\": \"2026-10-29 36kr《ChatGPT建议减药致华人女工程师离世，OpenAI遭起诉》（rank 20/50）：家属指控模型给出减药建议、使用者据此停药后死亡，已对 OpenAI 提起诉讼\"\n          }\n        ]\n      },\n      {\n        \"issue\": \"AI 时代如何评价程序员的能力\",\n        \"times_seen\": 1,\n        \"first_seen\": \"2026-10-29\",\n        \"last_seen\": \"2026-10-29\",\n        \"last_reason\": null,\n        \"events\": [\n          {\n            \"date\": \"2026-10-29\",\n            \"event\": \"2026-10-29 两条同向报道：36kr《Anthropic 宣布「编程面试已死」》讨论面试失效（rank 9/50）；juejin《程序员 1v1 访谈系列第八期：大龄女程序员的困境》（rank 8/50，hot 351）给出一手处境——年龄与经验在筛选环节贬值\"\n          }\n        ]\n      },\n      {\n        \"issue\": \"AI 办公与 SaaS 的商业模式正在被 AI 重估\",\n        \"times_seen\": 1,\n        \"first_seen\": \"2026-10-30\",\n        \"last_seen\": \"2026-10-30\",\n        \"last_reason\": null,\n        \"events\": [\n          {\n            \"date\": \"2026-10-30\",\n            \"event\": \"2026-10-30 三条同向报道：36kr《AI办公的分水岭，已不在模型“聪明度”》（rank 11/50）、《实测腾讯网盘：腾讯AI办公生态补上了最关键一环》（rank 22/50，climbing，delta -0.469）、《龙虾尸骸，SaaS残梦，大厂焦虑：AI办公究竟是什么？》（rank 24/50，climbing）；同日 36kr《出海变局：流量失灵，30%的消费者因AI弃品牌而去\"\n          }\n        ]\n      }\n    ],\n    \"note\": \"同一个议题第二次出现就必须有卡，或者必须写下不建的理由（ADR-0083）。`times_seen` 由脚本按天去重计数，不是模型自报——同一议题的措辞请保持稳定，否则会计成两个议题（归一化只去标点、不合并语义）。`due` 非空时这一轮只能二选一：action=new 为它建卡，或给 no_card_reason。\"\n  }\n}"}, {"path": ".agents/skills/newsagg-collect/scripts/run_all.sh", "start": 674, "end": 680, "note": "编排器调用点", "total": 972, "text": "triage_input() {\n  log \"③b 分拣：组装输入包\"\n  [[ -f \"$CAND\" ]] || fail_soft \"triage_input\" \"找不到候选文件\" \"$CAND\" 1\n  \"$PY\" .agents/skills/newsagg-triage/scripts/triage.py || \\\n    fail_soft \"triage_input\" \"组装分拣输入包失败\" \"$CAND\" 1\n}\n"}]}, {"id": "n07-triage-judge", "step": "③c", "title": "分拣判断（模型）", "layer": "triage", "when": "第 1 段结束 ↔ 第 2 段开始之间", "actor": "模型（你）", "one_liner": "读输入包，把描述同一事件的条目聚成簇，判断接得住哪张卡，产出三态决策。", "does": ["聚簇：同一现实事件的多条报道合并；单条报道不足以支撑判断。", "匹配：逐张读卡**正文**，不是只看标题。", "三态：skip / continue / new，或 abstain；action=new 时必须先写好卡文件再产出决策。", "台账到期（backlog.due）非空时只能二选一：为它建卡，或写下 no_card_reason。", "低置信度的簇不参与竞争，但要写进 low_confidence_skipped；无卡可接的写进 no_card_available，issue 是必填的计数键。", "校验：triage.py --validate 检查结构 + 冷却期 + 限额 + card_file 是否存在 + 到期议题有没有交代。"], "why": ["ADR-0025：技能装判断、插件装强制——这层是纯判断，脚本只做确定性外壳。", "「新进展」的唯一判据是引入新事实或改变判断；纯重复报道必须 skip。这是全系统防重复发文的**唯一**判定点，判错代价最贵。", "ADR-0041：建卡与决策是同一个动作。缺 card_file 时 ⑥ 的写回被静默跳过，新卡永远拿不到 covered_events——认知资产停止生长且不报错。", "ADR-0083：建卡门槛从「预测这卡将来有没有用」换成「同一议题是否第 2 次出现」——预测验不了，计数能验。13 轮 0 张卡不是因为门槛高，是因为那个事实没落到任何地方。", "ADR-0091：计数键是「议题 × 报道」不是「议题 × 天」。同一 URL 挂两天证明的是热榜没换，不是议题复发。"], "reads": [{"path": ".newsagg/triage/2026-10-31-input.json", "start": null, "end": null, "note": "要你照着做的规则", "total": 6413, "text": "{\n  \"instruction\": \"对每条候选条目：先聚成事件，再判断接得住哪张卡，给出三态决策（skip / continue / new）。判据见 SKILL.md 的硬规则。候选条目上的 trend 是**同源位次变化**（ADR-0056），trend_summary 说明该信号的覆盖率——它退化时按当前热度排序。backlog.due 里的议题已达新建门槛：要么这一轮为它建卡，要么写下no_card_reason（见 SKILL.md 硬规则 3）。\",\n  \"limits\": {\n    \"max_articles_per_day\": 1,\n    \"max_new_cards_per_day\": 1,\n    \"cooldown_days\": 3.0\n  }\n}"}], "writes": [{"path": ".newsagg/triage/2026-10-31-decision.json", "start": null, "end": null, "note": "决策文件（本 action=continue）", "total": 35, "text": "{\n  \"date\": \"2026-10-31\"\n}"}], "files": [{"path": ".agents/skills/newsagg-triage/SKILL.md", "start": 29, "end": 56, "note": "三态决策表 + 硬规则", "total": 149, "text": "读 `.newsagg/triage/<日期>-input.json`，它包含 `candidates`（条目）、`cards`（全部 active 卡，含正文）、`cooldown_state`、`limits`。\n\n### 第一步：聚簇\n\n把描述**同一现实事件**的条目合成一个事件聚簇。聚簇是判定\"是否值得写\"的最小单位——单条报道不足以支撑判断。\n\n用标题判断即可，不要为聚簇去抓正文。输出每个聚簇的 `confidence` 与 `reason`（为何值得写）。\n\n### 第二步：匹配观点卡\n\n对每个聚簇，判断它接得住哪张卡。**读卡的正文**，不要只看标题——卡的精髓在判断正文里。\n\n### 第三步：三态决策\n\n| 决策 | 含义 | 硬性要求 |\n| --- | --- | --- |\n| `skip` | 卡已含此事件且**无新进展**；或纯重复报道（同一事实换家媒体） | 给出 `card_file` |\n| `continue` | 卡已存在，且这是**新进展** | 给出 `card_file` + `whats_new` |\n| `new` | 需要一张新卡 | 给出 `new_issue` + `reusable_because` + `card_file`（**你必须先写 `knowledge/cards/<file>.md`，再产出决策**） |\n| `abstain` | 无任何聚簇接得住卡，也没达到新建门槛 | 说明原因 |\n\n## 硬规则（不可违背）\n\n1. **\"新进展\"的判据是引入新事实或改变判断。** 纯重复报道（同一事件换家媒体、同一事实换个说法）**不算**进展，必须判 `skip`。这是全系统防重复发文的**唯一**判定点，而重复发文是平台明令禁止的行为——这条判错代价最贵。\n\n2. **冷却期优先于排序。** 卡在 `cooldown_state` 中 `in_cooldown: true` 时，该卡本轮**不参与竞争**，直接看下一名。若所有候选卡都在冷却，则 `abstain`。冷却期的目的是防重复，不是惩罚其他选题。\n\n3. **新建门槛 = 同一议题第 2 次出现（ADR-0083）。** 判据不再是「能不能接住未来的新闻」——那是**预测**，不是判定；13 轮里它一次都没拦住过任何东西（实测 `reusable_because: \"不知道\"` 也能通过校验）。现在的判据是一个可以数出来的事实：**同一个议题第二次出现，就必须有卡，或者必须写下不建的理由**。"}, {"path": ".agents/skills/newsagg-triage/scripts/triage.py", "start": 552, "end": 574, "note": "校验器：结构 + 冷却 + 限额 + 卡存在 + 台账到期", "total": 886, "text": "def validate_decision(decision: dict, cards: list[dict], cooldown: dict, limits: dict,\n                      backlog: dict | None = None, day: str | None = None) -> dict:\n    \"\"\"校验模型的三态决策。返回 {ok, problems}。\n\n    这是确定性校验，不是判断替代：它只检查结构性合法性与已知的硬约束\n    （卡是否存在、每日上限、议题台账到期）。语义正确性仍需人工在简报中复核。\n\n    `backlog` 是议题台账（`card_backlog.load`）。不传就等于没有台账，\n    「到期议题必须二选一」这道闸不生效——调用方漏传时**不是静默通过**，\n    而是退回到 2026-10-28 之前的行为（13 轮 0 张卡）。生产路径\n    （`main()`）总是传，测试里也要求传。\n    \"\"\"\n    problems = []\n    action = decision.get(\"action\")\n    if action not in (\"skip\", \"continue\", \"new\", \"abstain\"):\n        problems.append(f\"action 非法：{action!r}\")\n\n    card_files = {c[\"file\"] for c in cards}\n\n    if action in (\"skip\", \"continue\"):\n        cf = decision.get(\"card_file\")\n        if not cf:\n            problems.append(f\"{action} 必须给出 card_file\")"}, {"path": ".agents/skills/newsagg-triage/scripts/card_backlog.py", "start": 203, "end": 233, "note": "台账怎么记一次出现", "total": 358, "text": "def observe(data: dict, decision: dict, cards: list[dict], day: str) -> dict:\n    \"\"\"把一份决策并进台账。返回做了什么（供编排器打印）。\n\n    三件事：\n    1. `action: new` → 把新卡挂到对应议题上，此后不再到期\n    2. `no_card_available[]` → 每个条目计数一次（按天去重）\n    3. `no_card_reason` → 记下「这一轮为什么没建」，随台账一起复盘\n\n    只有决策里的**显式字段**会被读。不从 `ranking_note` 这类散文里猜议题——\n    猜错一次就会让一个不相干议题的计数多 1，而台账的全部价值在于可信。\n    \"\"\"\n    import sys as _sys\n\n    issues = data.setdefault(\"issues\", {})\n    idx = card_issue_index(cards)\n    raw = decision.get(\"decision\", decision) or {}\n    touched = {\"attached\": [], \"bumped\": [], \"reasons\": []}\n\n    def _get(issue_text: str) -> dict | None:\n        key = norm_issue(issue_text)\n        if not key:\n            return None\n        if key not in issues:\n            issues[key] = _entry(str(issue_text).strip(), day)\n        return issues[key]\n\n    # ── 1) 本轮建了卡 ──\n    if raw.get(\"action\") == \"new\":\n        e = _get(raw.get(\"new_issue\") or \"\")\n        if e is not None:\n            e[\"card_file\"] = raw.get(\"card_file\")"}, {"path": ".newsagg/triage/2026-10-31-decision.json", "start": null, "end": null, "note": "被挡下的簇与无卡可接的议题", "total": 35, "text": "{\n  \"low_confidence_skipped\": [\n    {\n      \"event\": \"36kr《27 岁程序员获无限 Token，挑战两个月重写思科 98% 的遗留代码》（rank 11/50，climbing）\",\n      \"confidence\": 0.52,\n      \"why\": \"标题里的三个数字（27 岁、两个月、98%）很抓人，但拿不到正文——重写的是什么模块、验收标准谁定、改坏了谁负责，一个都核不到。这正是 10-30 那篇踩过的坑（把标题当事实、把盘后价当收盘价），所以这次不据标题写。若出现带验收口径的续报，按新进展再判。\"\n    },\n    {\n      \"event\": \"36kr《GPT-6\\\"看不懂 3D\\\"实锤，250道题只拿0.53分，Claude没及格》+《重磅，AI补全人类史上最大数学证明，数学家当场泪崩》（rank 3/50、2/50，均为 climbing）\",\n      \"confidence\": 0.55,\n      \"why\": \"同一周里「0.53 分」与「补全史上最大数学证明」并存，是个好反差，但两条都只有标题级别的结论：0.53 分考的是什么题、数学证明的验证到哪一步，都需要原文才能判断。接得住它的 `ai-productivity-claims-lack-reproducible-benchmarks` 可用，但我不想在没有原文的情况下把「评测不可信」再写一遍——10-29 和 10-30 两篇已经在讲同类机制，连写三篇会变成同一个判断的复读。\"\n    }\n  ],\n  \"no_card_available\": []\n}"}, {"path": ".newsagg/triage/card-backlog.json", "start": null, "end": null, "note": "台账当前的门槛与到期议题", "total": 70, "text": "{\n  \"threshold\": 2\n}"}, {"path": ".agents/skills/newsagg-collect/scripts/run_all.sh", "start": 720, "end": 749, "note": "第 1 段结尾的 handoff：建卡与台账到期的交代", "total": 972, "text": "────────────────────────────────────────────────────────\n分拣的**判断**由模型完成（ADR-0025：技能装判断）。请：\n\n  1. 读 ${CAND%.json} 对应的输入包\n     .newsagg/triage/${DATE}-input.json\n  2. 按 newsagg-triage 的硬规则产出决策，写入\n     ${DEC}\n     · action=new 时，你还必须**新建观点卡**\n       knowledge/cards/<file>.md（五节结构：当前判断 / 依据事实 /\n       修订史 / 可接住的事件类型 / 边界与反方），并 .68 亿（原文口径：比四家长视频加起来还多）、一季度全网十二万多部微短剧里九成五以上是 AI 短剧，而免费是它的核心商业模式、靠广告赚钱，内容卖多少钱它不在乎。于是先崩的是**批发价**（平台付创作者的分成，万播收益从去年三五十元掉到个位数，供给曲线即可解释），**零售价**（观众那侧）才由 150 万票房与免费剧热度共同指向。本卡要补的判据因此是：锚点不是零而是「接近零」，妙鸭把锚从照相馆几百块拉到 AI 写真几块钱，几块钱仍有人买、日活到过 60 万——缝还在，只是很窄；而真正按住价格的是补贴者，不是免费。\",\n    \"confidence\": 0.82,\n    \"money_point\": \"① 做 C 端 AI 内容的独立开发者——先看分发，别先看质量：谁替你付钱（平台补贴、广告分成、投资人）？没人替你付，这个价格就不是你定的，只能去找愿意自己掏钱的场景，或改卖交付。② 接 AI 商单的外包——批发价已经崩到你这层：客户会拿「万播才几块钱」压你的报价，报价单上要写清「生成正在趋零，责任没有」，你卖的是交付与售后。③ 自己掏钱买 AI 订阅/API 的团队——别被「免费」吓住：妙鸭把锚从照相馆几百块拉到几块钱，几块钱也有人买、日活 60 万，锚点是「接近零」而非零，中间还留着一道缝。\",\n    \"event\": {\n      \"summary\": \"国内首部 AI 院线电影《三星堆：未来往事》上映超过一周，票房不足 150 万元，上座率基本在 1% 上下，豆瓣尚未开分；制作成本千万级，片方分账至今仅几十万元。片方已做让利：采用 20 元票房结算标准（低于传统电影），并把分账比例从常见的 43:57 调整为 40:60 主动让出 3 个百分点争取排片，仍未换来票房。对照同期的另一个 AI 内容项目：芒果 TV 首部 AI 剧集《后西游记》8 月底登湖南卫视黄金档，同样被吐槽画面不稳、表情僵硬，但因卫视与会员**免费**可见，热度与话题都不缺，芒果超媒股价几天涨了五成。上游机制是免费供给的规模：红果日活已达 1.68 亿、超过四家长视频之和，今年一季度全网上线微短剧 12 万多部、九成五以上是 AI 短剧，而免费本身就是红果的核心商业模式；观众在免费池里刷了大半年，对 AI 内容的价值判断定型为「免费、刷完即走」。价格因此向下传递：AI 短剧的万播收益从去年的三五十元至上百元，掉到今年的个位数。文章引行为经济学的价格锚定解释：人判断一件东西值多少钱，取决于他最早、最常见到的价格，而国内观众对 AI 内容的锚点就是零，且模型越进步、生成成本越低，免费供给只会更多更像样。\",\n      \"members\": [\n        \"36kr《首部AI电影的惨败真相：当下观众对AI内容的价格锚点就是零》（壹娱观察，2026-10-30 20:31，rank 30/50，climbing）\",\n        \"36kr《造梦在云端，赚钱在人间》（rank 32/50，climbing，同一议题的另一入口，未取为证据）\"\n      ],\n      \"hot\": null,\n      \"trend\": \"climbing\"\n    },\n    \"ranking_note\": \"本轮 trend 信息量充足（63/159 可算：climbing 38、steady 24、cooling 1、absent 63、unknown 33），**采纳了 climbing 优先**：胜出簇两条候选均为 climbing（36kr 30/50、32/50）。但真正决定排序的不是 trend，是冷却期清走了两个更热的选项：`ai-capital-pricing-shifts-to-unit-economics`（1.88 天）挡掉了 DeepSeek 第二轮融资 1055 亿/估值 6155 亿（ithome 5/48）与英伟达市值蒸发 1.4 万亿（头条 hot 813 万）；`llm-price-war-signals-commoditization`（2.88 天）挡掉了本轮最贴读者钱包的一组——《我算了笔账：AI 编程工具一年烧掉两台 MacBook》（掘金 13/50，climbing）加《Claude套餐大升级！Max 20x 升级为 Ultra，5 小时限额直接取消》（36kr 7/50）：Cursor 新用户中档 $20→$30、Codex 老 Pro 订阅 10-30 起额度缩水不降价、Claude 反向送等额 API 额度，一年重度双开 $4,800≈3.45 万元。这组明天就解锁，已记入简报备选。胜出簇的取舍理由：它是本轮唯一「有机 人做 AI 变现，失败几乎不发生在技术侧。模型能力在被免费发放、工具链在成熟、套壳的成本趋近于零——**技术现在是最容易获得的一环，因此它不构成差异**。\n\n决定可行性的是一句话：**有没有人为一个具体问题持续付钱，以及你能不能以可接受的成本稳定交付它。**\n\n本卡用六个因子判断，且这六个因子的地位并不相等：\n\n**可行性 = 真实需求 × 付费意愿 × 可交付性 × 单位经济 × 合规安全 × 竞争壁垒**\n\n- **前三项是门槛**（真实需求、付费意愿、可交付性）。任一项不过就是不可行，**不能用后三项的优势去补偿**——一个技术再优雅、壁垒再高的方案，如果没人肯预付，就是不成立。\n- **后三项是放大器**（单位经济、合规安全、竞争壁垒）。它们不决定「能不能做」，只决定「能赚多少、能赚多久」。\n\n**判据必须是钱，不是话。**「很有意思」「有需求」都不算验证；算数的是预付款、定金、LOI、续费率。访谈要问「你上次遇到这个问题是什么时候、花了多少钱或多少时间、后来怎么解决的」，而不是「你会用吗」——后者的答案与真实付费行为几乎无关。\n"}], "files": [{"path": ".agents/skills/newsagg-triage/scripts/build_brief.py", "start": 96, "end": 112, "note": "素材锚点只放输入里真实存在的内容，不编造", "total": 459, "text": "def build_brief(decision: dict, card: dict | None, style: dict, target_words: str) -> str:\n    \"\"\"拼装 brief。素材锚点只放**输入里真实存在**的内容，不编造。\"\"\"\n    ev = decision.get(\"event\") or {}\n    members = ev.get(\"members\") or []\n    evidence = ev.get(\"key_evidence\") or []\n\n    lines: list[str] = []\n    lines.append(\"# 写作任务书（由 NewsAgg 自动生成）\")\n    lines.append(\"\")\n    lines.append(f\"生成时间：{datetime.now(CST).isoformat()}\")\n    lines.append(\"\")\n\n    # ── 选题 ──\n    lines.append(\"## 选题\")\n    if card:\n        lines.append(f\"**议题**：{card['issue']}\")\n        lines.append(\"\")"}, {"path": ".agents/skills/newsagg-triage/scripts/build_brief.py", "start": 124, "end": 139, "note": "卡的四块内容怎么进任务书", "total": 459, "text": "    # ── 已有认知（ADR-0026：必须引用或推进，不得另起）──\n    if card:\n        lines.append(\"## 已有认知（必须引用或推进，不得另起）\")\n        cur = extract_section(card[\"body\"], \"当前判断\")\n        if cur:\n            lines.append(\"**当前判断**：\")\n            lines.append(cur)\n            lines.append(\"\")\n        facts = extract_section(card[\"body\"], \"依据事实\")\n        if facts:\n            lines.append(\"**已有依据**：\")\n            lines.append(facts)\n            lines.append(\"\")\n        if card[\"covered_events\"]:\n            lines.append(\"**已覆盖事件**（不要重复叙述）：\")\n            for e in card[\"covered_events\"]:"}, {"path": ".agents/skills/newsagg-triage/scripts/build_brief.py", "start": 419, "end": 433, "note": "风格注入", "total": 459, "text": "    # 载入风格（yaml 极简解析，只取需要的标量）\n    style: dict = {}\n    spath = root / \".wewrite\" / \"style.yaml\"\n    if spath.exists():\n        txt = spath.read_text(encoding=\"utf-8\")\n        for k in (\"name\", \"industry\", \"target_audience\", \"tone\", \"voice\", \"writing_persona\"):\n            m = re.search(rf'^{k}:\\s*\"?([^\"\\n]+)\"?', txt, re.M)\n            if m:\n                style[k] = m.group(1).strip()\n\n        # 黑名单必须**限定在 blacklist 块内**解析。\n        # 注意：顶层还有 content 方向的 `topics:`，若不加限定会误取成\"禁写话题\"\n        # ——那会让写作模型避开我们最想写的方向。\n        bl = re.search(r\"^blacklist:\\s*$((?:\\n[ \\t]+.*|\\n)*)\", txt, re.M)\n        blk = bl.group(1) if bl else \"\""}, {"path": ".agents/skills/newsagg-triage/scripts/build_brief.py", "start": 351, "end": 381, "note": "ADR-0094：写入任务书的评审要求", "total": 459, "text": "    # ── 发布前评审（ADR-0094）──\n    # 这一段和上面那些\"写作规则\"性质不同：上面是给写作者的要求，这一段是给\n    # **写作者之外的一个模型**的要求。放在这里的理由是位置——它必须出现在\n    # 「你已经写完了、还没发布」的那个时刻，而这正是本文件被读的时刻。\n    lines.append(\"### 发布前评审（必须做，2026-10-31 起，ADR-0094）\")\n    lines.append(\"\")\n    lines.append(\"写完、**在跑 `--after-write --publish` 之前**，必须做一次独立评审：\")\n    lines.append(\"\")\n    lines.append(\"1. 用 `subagent` 起一个**独立**的评审子智能体（它不共享你的上下文，所以要把成稿路径、\")\n    lines.append(\"   观点卡路径写进它的任务里）。要求它先 `skill` 加载 `elon-musk-perspective`，\")\n    lines.append(\"   再按该技能的模型评审——不是给通用写作建议。\")\n    lines.append(\"2. 评审意见原样写到 `docs/reviews/<今天>-elon-review.md`（入库，次日可复核）。\")\n    lines.append(\"3. **诚实接收**：逐条判 accept / reject。accept 的必须真的改稿；reject 的必须写清理由\")\n    lines.append(\"   （指证据或指规则，不接受「我觉得没必要」）。\")\n    lines.append(\"4. 改完、改完的稿子重新对一遍上面的标题/篇幅/首段要求，再跑发布。\")\n    lines.append(\"\")\n    lines.append(\"为什么在这一步：它是全流程里**唯一一处由另一个模型对成稿下判断**的环节。\")\n    lines.append(\"同上下文的自查看不见自己的盲区——本仓库连续四天的缺陷（ADR-0092/0093、封面孤字、\")\n    lines.append(\"10-30 那篇的三处硬数字）都是「报告全绿、东西是错的」。评审不是打分，是找一个愿意反对你的读者。\")\n    lines.append(\"\")\n    lines.append(\"**判据**：评审若一条 blocker 都没提，要么稿子真没问题，要么它被写成了夸奖——\")\n    lines.append(\"后者要在记录里明写出来，不许把沉默当成通过。它**不拦发**，拦发权在你，\")\n    lines.append(\"但每个 reject 都要留得下理由。\")\n    lines.append(\"\")\n\n    # ── 正文观察项（`platforms/prose-rules.md`）──\n    # 只说明\"会被记什么\"，**不印标记词**。这是刻意的：把「先别」「记下来」这些词\n    # 印给写作方，写作方只要在末段塞一个就满足了标签，而标签本该检测结构而不是口令。\n    # 标题规则那边可以印（标题短、词表即规则本身），正文这边印了就等于教人作弊。\n    lines.append(\"### 发布后会记下的正文标签（`platforms/prose-rules.md`，不拦发）\")\n    lines.append(\"\")"}, {"path": ".agents/skills/newsagg-triage/scripts/build_brief.py", "start": 378, "end": 394, "note": "只说明会被记什么，不印标记词", "total": 459, "text": "    # 印给写作方，写作方只要在末段塞一个就满足了标签，而标签本该检测结构而不是口令。\n    # 标题规则那边可以印（标题短、词表即规则本身），正文这边印了就等于教人作弊。\n    lines.append(\"### 发布后会记下的正文标签（`platforms/prose-rules.md`，不拦发）\")\n    lines.append(\"\")\n    pr = _load_prose_rules()\n    prose = pr.load_rules(repo_root())\n    if not prose.get(\"loaded\"):\n        lines.append(f\"> ⚠️ 正文规则文件读不上，本篇发布时不打正文标签：{prose.get('error')}\")\n    else:\n        lines.append(\"发布时会对成稿正文打四个标签、记进发布账本、次日在简报 ③ 段印出来。\")\n        lines.append(\"它们**不拦发**——正文结构没有「拒发」的正确阈值，拦错一次损失一篇产能。\")\n        lines.append(\"但它们是上面第 11–15 条是否被执行的唯一证据：\")\n        for key, spec in (prose.get(\"tags\") or {}).items():\n            lines.append(f\"- `{key}`：{spec.get('desc','')}\")\n        lines.append(\"\")\n        lines.append(\"换句话说：**上面那些条不是建议，是第二天会被看到的东西。**\")\n    lines.append(\"\")"}, {"path": ".agents/skills/newsagg-collect/scripts/run_all.sh", "start": 748, "end": 760, "note": "显式 --out 到当日", "total": 972, "text": "# ══ 主流程第 2 段：④ 写作准备 ═══════════════════════════════════\nif [[ -n \"$AFTER_TRIAGE\" && -z \"$AFTER_WRITE\" ]]; then\n  log \"④ 写作准备：生成 brief\"\n  [[ -f \"$DEC\" ]] || fail_soft \"write\" \"缺决策文件（分拣判断未完成）\" \"$DEC\" 1\n  # 显式 --out 到 ${DATE}：build_brief 默认按\"今天\"命名，跨零点续跑或重放历史\n  # 决策时会让 handoff 指引指向一个不存在的文件。三段必须共享同一日期。\n  \"$PY\" .agents/skills/newsagg-triage/scripts/build_brief.py --decision \"$DEC\" \\\n    --out \".n 数。这给本卡补了一条可检验的判据：付费意愿的上限由**免费替代品的可得性**决定，不由作品质量决定，所以「做得更好」不是涨价理由。\n\n## 已有认知（必须引用或推进，不得另起）\n**当前判断**：\n个人做 AI 变现，失败几乎不发生在技术侧。模型能力在被免费发放、工具链在成熟、套壳的成本趋近于零——**技术现在是最容易获得的一环，因此它不构成差异**。\n\n决定可行性的是一句话：**有没有人为一个具体问题持续付钱，以及你能不能以可接受的成本稳定交付它。**\n\n本卡用六个因子判断，且这六个因子的地位并不相等：\n\n**可行性 = 真实需求 × 付费意愿 × 可交付性 × 单位经济 × 合规安全 × 竞争壁垒**\n\n- **前三项是门槛**（真实需求、付费意愿、可交付性）。任一项不过就是不可行，**不能用后三项的优势去补偿**——一个技术再优雅、壁垒再高的方案，如果没人肯预付，就是不成立。\n- **后三项是放大器**（单位经济、合规安全、竞争壁垒）。它们不决定「能不能做」，只决定「能赚多少、能赚多久」。\n\n**判据必须是钱，不是话。**「很有意思」「有需求」都不算验证；算数的是预付款、定金、LOI、续费率。访谈要问「你上次遇到这个问题是什么时候、花了多少钱或多少时间、后来怎么解决的」，而不是「你会用吗」——后者的答案与真实付费行为几乎无关。\n"}], "writes": [{"path": "outputs/2026-10-31-ai-content-price-anchor-is-zero.md", "start": 1, "end": 18, "note": "成稿（首行一级标题即发布标题）", "total": 33, "text": "# AI电影票房150万：有人替观众付了钱，你卖不上价\n\n观众几乎没为 AI 长片掏过钱。按住你价格的不是免费，是替观众付钱的人。\n\n国内首部 AI 院线电影《三星堆：未来往事》上映超过一周，票房不到 150 万元，上座率基本在 1% 上下；制作成本千万级，片方分账至今几十万。片方已经把票房结算标准降到 20 元、分账从常见的 43:57 让到 40:60，让出 3 个百分点换排片——没换来票房。\n\n同一周，芒果 TV 首部 AI 剧集《后西游记》放在卫视黄金档和会员里免费看，热度话题都不缺，芒果超媒股价几天涨了五成。\n\n## 差在谁替观众付了钱\n\n这两件事差了四样：谁掏的制作成本、走什么渠道、卖给谁、钱从哪回来。博纳自己投、进院线、把票卖给观众、靠票房回本；芒果自制、上卫视、免费给观众、钱从会员和股价来。\n\n所以不能读成「收费就死」。免费那一头**从没问过观众价**——它只证明一件事：有人愿意出钱把价格按住，而那个人不是观众。\n\n按的是谁？红果日活已经到 1.68 亿（原文口径：比四家长视频加起来还多），一季度全网上线的微短剧十二万多部，九成五以上是 AI 短剧；而免费本身就是红果的核心商业模式，它靠广告和流量赚钱，内容本身卖多少钱它不在乎。\n\n于是先崩的是**批发价**——平台付给创作者的分成单价。AI 短剧的万播收益从去年的三五十元、上百元，掉到今年的个位数。供给几乎无限，单价必然往零靠，这是一条供给曲线，不需要「锚定」来解释。\n"}, {"path": ".newsagg/covers/2026-10-31.json", "start": null, "end": null, "note": "封面论据（layout=number）", "total": 1, "text": "{\n  \"layout\": \"number\",\n  \"kicker\": \"首部AI院线电影\",\n  \"hero\": \"1\",\n  \"hero_unit\": \"% 上座率\",\n  \"payoff\": \"有人替观众付了钱\"\n}"}], "files": [{"path": ".agents/skills/newsagg-collect/scripts/run_all.sh", "start": 772, "end": 788, "note": "退出码 3 的降级分支", "total": 972, "text": "  wewrite llm-write --brief \".newsagg/briefs/${DATE}.md\" \\\n    --output \"outputs/${DATE}-draft.md\" 2>&1 | tail -3\n  RC=${PIPESTATUS[0]}\n  set -e\n  if [[ $RC -eq 3 ]]; then\n    echo \"→ 写作模型未配置（退出码 3），按设计降级：由 agent 自写\"\n  elif [[ $RC -ne 0 ]]; then\n    fail_soft \"write\" \"写作失败（退出码 ${RC}）\" \"\" 1\n  else\n    echo \"→ 初稿已生成 outputs/${DATE}-draft.md（审稿后另存为 outputs/<slug>.md）\"\n  fi\n\n  cat <<EOF\n\n────────────────────────────────────────────────────────\n请让模型读 .newsagg/briefs/${DATE}.md，把成稿写成\n  outputs/<slug>.md        （slug 形如 ${DATE}-<短标题>，首行一级标题 2~30 字）"}, {"path": ".agents/skills/newsagg-collect/scripts/run_all.sh", "start": 788, "end": 803, "note": "第 2 段结尾给模型的指引（含封面论据格式）", "total": 972, "text": "  outputs/<slug>.md        （slug 形如 ${DATE}-<短标题>，首行一级标题 2~30 字）\n\n封面：信息流里标题就印在封面旁边，复述标题的封面不增加信息，缩到 320px 宽\n时还会读不出来（ADR-0044）。所以封面要承载**一个视觉论据**，写到\n  .newsagg/covers/${DATE}.json\n形如 {\"layout\":\"number\",\"kicker\":\"Meta 开源\",\"hero\":\"8160\",\"hero_unit\":\"亿参数\",\n\"payoff\":\"模型免费，运维不免费\"}；无强数字时用\n{\"layout\":\"contrast\",\"kicker\":\"…\",\"line1\":\"…\",\"line2\":\"…\"}。\n不写这个文件也能发布（回退到标题推导），但推导只会切分标题、选不出论据——\n2026-10-20 那次就因此产出了一张顶部小字与正文重复的封面（ADR-0044 发现五）。\n写完后执行：\n  bash ${SELF} --after-write $([[ \"$MODE\" == \"publish\" ]] && echo --publish)\n────────────────────────────────────────────────────────\nEOF\n  exit 0\nfi"}, {"path": ".newsagg/covers/2026-10-31.json", "start": null, "end": null, "note": "这一天的封面论据 spec", "total": 1, "text": "{\n  \"layout\": \"number\",\n  \"kicker\": \"首部AI院线电影\",\n  \"hero\": \"1\",\n  \"hero_unit\": \"% 上座率\",\n  \"payoff\": \"有人替观众付了钱\"\n}"}]}, {"id": "n16-review", "step": "④c", "title": "发布前独立评审", "layer": "gate", "when": "成稿写完、跑 `--after-write --publish` 之前", "actor": "独立子智能体 + 主智能体", "one_liner": "换一个不共享上下文的模型，用马斯克视角挑毛病；主智能体逐条 accept / reject。", "does": ["用 subagent 起一个**独立**评审子智能体——它不共享上下文，所以成稿路径、观点卡路径必须写进任务里。", "它必须先 `skill` 加载 elon-musk-perspective，按该技能的心智模型评审，而不是给通用写作建议。", "评审意见原样落盘 docs/reviews/<日期>-elon-review.md（入库，次日可复核）；格式含 verdict / blockers / improvements / what_survives。", "主智能体逐条判 accept / reject：accept 的真的改稿，reject 的必须指证据或指规则，不接受「我觉得没必要」。", "一条 blocker 都没提时，必须在记录里明写「是真没问题，还是评审被写成了夸奖」——不许把沉默当通过。", "改完的稿子重新对一遍标题/篇幅/首段要求，再跑发布。"], "why": ["ADR-0094：连着四天的缺陷（ADR-0092 台账摘要、ADR-0093 闸门被渲染成失败、封面孤字自检全绿、10-30 那篇三处硬数字）共同点是**判断者与被执行者是同一个东西**。", "同上下文的自查看不见自己的盲区——报告全绿而东西是错的。评审不是打分，是找一个愿意反对你的读者。", "只判不改（与 ADR-0025 同一分工）：若让评审直接改写，主智能体就无法对改动负责，也没法留下「我为什么改 / 不改」。", "what_survives 必填：强制评审先说清「哪里别改坏」，避免顺着意见把骨架改塌。", "**不拦发**，拦发权仍在主智能体（与 ADR-0082 同理）：拦错一次损失一篇产能，正确性靠「记录 + 次日复核」。"], "reads": [{"path": "outputs/2026-10-31-ai-content-price-anchor-is-zero.md", "start": 1, "end": 12, "note": "被评审的成稿", "total": 33, "text": "# AI电影票房150万：有人替观众付了钱，你卖不上价\n\n观众几乎没为 AI 长片掏过钱。按住你价格的不是免费，是替观众付钱的人。\n\n国内首部 AI 院线电影《三星堆：未来往事》上映超过一周，票房不到 150 万元，上座率基本在 1% 上下；制作成本千万级，片方分账至今几十万。片方已经把票房结算标准降到 20 元、分账从常见的 43:57 让到 40:60，让出 3 个百分点换排片——没换来票房。\n\n同一周，芒果 TV 首部 AI 剧集《后西游记》放在卫视黄金档和会员里免费看，热度话题都不缺，芒果超媒股价几天涨了五成。\n\n## 差在谁替观众付了钱\n\n这两件事差了四样：谁掏的制作成本、走什么渠道、卖给谁、钱从哪回来。博纳自己投、进院线、把票卖给观众、靠票房回本；芒果自制、上卫视、免费给观众、钱从会员和股价来。\n"}, {"path": "knowledge/cards/personal-ai-monetization-is-paid-demand-not-technology.md", "start": 1, "end": 22, "note": "它接住的观点卡（评审要判有没有背离卡的当前判断）", "total": 136, "text": "---\nissue: 个人 AI 变现能不能赚钱由付费需求决定，不由技术决定\nstatus: active\ncreated: 2026-10-17\nlast_written: 2026-10-31\ncovered_events:\n  - 2026-10-18 个人 AI 变现出现正反两组可核对账本：Mole 从开源工具走到付费桌面版（用户主动要求付费）、拼豆 App 三个月 43 美元且 93% 付费用户次月流失；同期「陶华碧靠 AI 赚 54 亿」被事实核查（营收非利润、AI 只是质检、营收回升靠换回本地辣椒）\n  - 2026-10-25 个人 AI 变现第一次有了基数，而这个基数把「AI」这个变量从等式里划掉了：TrustMRR 抓取的 10,150 个真实收款产品里，AI 产品与非 AI 产品有收入的比例几乎一样（49.3% 对 49.0%，中位月收入 161 对 175 美元），只有 2.4% 做到年化 10 万美元，Top 1% 拿走 76.1% 的收入；细分到开发者工具，69% 一分钱没收到。与此同时，同一批数据给出了窗口为什么存在、又为什么会关：AI 让生产成本每年降约 10 倍，而客户的价格锚还停在「要请人做」的年代，中间的差额就是毛利窗口——窗口关闭不是因为技术退步，是因为价格锚被更新（妙鸭相机从「照相馆几百块」被拉到「AI 写真几块钱」，不到两年团队解散）。同一天池子里还有一份一手个案给这组数据配了注脚：一位开发者用 AI 独立做出一款零依赖、188 个测试全绿、工期压到四分之一的游戏，可交付性被拉满，而仓库 1 个 Star、直接收入 0 元、打赏为零。\n  - 2026-10-31 国内首部 AI 院线电影《三星堆：未来往事》上映超过一周，票房不足 150 万元，上座率基本在 1% 上下，豆瓣尚未开分；制作成本千万级，片方分账至今仅几十万元。片方已做让利：采用 20 元票房结算标准（低于传统电影），并把分账比例从常见的 43:57 调整为 40:60 主动让出 3 个百分点争取排片，仍未换来票房。对照同期的另一个 AI 内容项目：芒果 TV 首部 AI 剧集《后西游记》8 月底登湖南卫视黄金档，同样被吐槽画面不稳、表情僵硬，但因卫视与会员**免费**可见，热度与话题都不缺，芒果超媒股价几天涨了五成。上游机制是免费供给的规模：红果日活已达 1.68 亿、超过四家长视频之和，今年一季度全网上线微短剧 12 万多部、九成五以上是 AI 短剧，而免费本身就是红果的核心商业模式；观众在免费池里刷了大半年，对 AI 内容的价值判断定型为「免费、刷完即走」。价格因此向下传递：AI 短剧的万播收益从去年的三五十元至上百元，掉到今年的个位数。文章引行为经济学的价格锚定解释：人判断一件东西值多少钱，取决于他最早、最常见到的价格，而国内观众对 AI 内容的锚点就是零，且模型越进步、生成成本越低，免费供给只会更多更像样。\nsource: 用户指定建卡（2026-10-17），并提供了评估框架\n---\n# 个人 AI 变现能不能赚钱由付费需求决定，不由技术决定\n\n## 当前判断\n\n个人做 AI 变现，失败几乎不发生在技术侧。模型能力在被免费发放、工具链在成熟、套壳的成本趋近于零——**技术现在是最容易获得的一环，因此它不构成差异**。\n\n决定可行性的是一句话：**有没有人为一个具体问题持续付钱，以及你能不能以可接受的成本稳定交付它。**\n\n本卡用六个因子判断，且这六个因子的地位并不相等：\n\n**可行性 = 真实需求 × 付费意愿 × 可交付性 × 单位经济 × 合规安全 × 竞争壁垒**"}, {"path": ".newsagg/briefs/2026-10-31.md", "start": 1, "end": 26, "note": "任务书：评审要对照它判是否答非所问", "total": 244, "text": "# 写作任务书（由 NewsAgg 自动生成）\n\n生成时间：2026-10-31T21:44:09.576668+08:00\n\n## 选题\n**议题**：个人 AI 变现能不能赚钱由付费需求决定，不由技术决定\n\n**本次事件**：国内首部 AI 院线电影《三星堆：未来往事》上映超过一周，票房不足 150 万元，上座率基本在 1% 上下，豆瓣尚未开分；制作成本千万级，片方分账至今仅几十万元。片方已做让利：采用 20 元票房结算标准（低于传统电影），并把分账比例从常见的 43:57 调整为 40:60 主动让出 3 个百分点争取排片，仍未换来票房。对照同期的另一个 AI 内容项目：芒果 TV 首部 AI 剧集《后西游记》8 月底登湖南卫视黄金档，同样被吐槽画面不稳、表情僵硬，但因卫视与会员**免费**可见，热度与话题都不缺，芒果超媒股价几天涨了五成。上游机制是免费供给的规模：红果日活已达 1.68 亿、超过四家长视频之和，今年一季度全网上线微短剧 12 万多部、九成五以上是 AI 短剧，而免费本身就是红果的核心商业模式；观众在免费池里刷了大半年，对 AI 内容的价值判断定型为「免费、刷完即走」。价格因此向下传递：AI 短剧的万播收益从去年的三五十元至上百元，掉到今年的个位数。文章引行为经济学的价格锚定解释：人判断一件东西值多少钱，取决于他最早、最常见到的价格，而国内观众对 AI 内容的锚点就是零，且模型越进步、生成成本越低，免费供给只会更多更像样。\n\n**推进方向**：本卡此前证明的是「技术不构成差异、决定可行性的是付费需求」，今天补上付费需求这一侧的**机制**：它的天花板由免费替代品决定，而且和质量无关。同一周内的两个对照：国内首部 AI 院线电影《三星堆：未来往事》制作成本千万级，上映超一周票房不足 150 万、上座率约 1%、片方分账几十万；片方已把票房结算标准降到 20 元、把分账比例从 43:57 让到 40:60，仍未换来排片与票房。而芒果 TV 首部 AI 剧集《后西游记》放在卫视与会员里**免费**看，芒果超媒股价几天涨五成。同一批 AI 生成能力、同一个「AI 制作」的卖点，收费则死、免费则爆。机制在上游：红果日活 1.68 亿、一季度全网 12 万多部微短剧中九成五以上是 AI 短剧、且免费是该平台的核心商业模式——观众的价格锚点被定在零，AI 短剧的万播收益也从去年的三五十元掉到今年的个位数。这给本卡补了一条可检验的判据：付费意愿的上限由**免费替代品的可得性**决定，不由作品质量决定，所以「做得更好」不是涨价理由。\n\n## 已有认知（必须引用或推进，不得另起）\n**当前判断**：\n个人做 AI 变现，失败几乎不发生在技术侧。模型能力在被免费发放、工具链在成熟、套壳的成本趋近于零——**技术现在是最容易获得的一环，因此它不构成差异**。\n\n决定可行性的是一句话：**有没有人为一个具体问题持续付钱，以及你能不能以可接受的成本稳定交付它。**\n\n本卡用六个因子判断，且这六个因子的地位并不相等：\n\n**可行性 = 真实需求 × 付费意愿 × 可交付性 × 单位经济 × 合规安全 × 竞争壁垒**\n\n- **前三项是门槛**（真实需求、付费意愿、可交付性）。任一项不过就是不可行，**不能用后三项的优势去补偿**——一个技术再优雅、壁垒再高的方案，如果没人肯预付，就是不成立。\n- **后三项是放大器**（单位经济、合规安全、竞争壁垒）。它们不决定「能不能做」，只决定「能赚多少、能赚多久」。\n\n**判据必须是钱，不是话。**「很有意思」「有需求」都不算验证；算数的是预付款、定金、LOI、续费率。访谈要问「你上次遇到这个问题是什么时候、花了多少钱或多少时间、后来怎么解决的」，而不是「你会用吗」——后者的答案与真实付费行为几乎无关。\n"}], "writes": [{"path": "docs/reviews/2026-10-31-elon-review.md", "start": 1, "end": 24, "note": "评审记录：结论 + 主智能体改口对照表", "total": 79, "text": "# 2026-10-31 发布前评审记录（ADR-0094）\n\n成稿：`outputs/2026-10-31-ai-content-price-anchor-is-zero.md`\n标题（改后）：《AI电影票房150万：有人替观众付了钱，你卖不上价》\n评审者：独立子智能体（加载 `elon-musk-perspective`，只判不改、未联网、未改文件）\n结论：`verdict: 需改` → 主智能体**四条 blocker 全部接受**并重写\n\n---\n\n## 一、主智能体在评审回来之前的自查\n\n写下来是为了让「评审之后有没有改口」可被对照：\n\n| # | 自查项 | 严重度 | 评审是否也提到 |\n| --- | --- | --- | --- |\n| A | 场景与上一篇重复（30 万审批 + CFO 问回本） | 高 | 间接（blocker 4 判「安慰动作」，我照此整段换掉） |\n| B | 结尾句式与 10-30 雷同 | 中 | 间接（同上） |\n| C | 「必然卖不动」过度断言 | 中 | 是（blocker 3） |\n| D | 删掉最有信息量的一层：红果靠广告、内容卖多少钱它不在乎 | 高 | **是（blocker 1/2 的核心）** |\n| E | 机制归属不清：免费 vs 补贴 | 高 | **是（blocker 3 的判据）** |\n| F | 自引 10-25 的 10,150 个产品数据靠记忆 | 低 | 是（improvement 4） |\n\n自己看到 6 条，评审抓到 4 条其中有 2 条比我更准确（D/E 我给的是「信息量损失」，评审给的是「因果混淆」）。\n"}], "files": [{"path": ".agents/skills/newsagg-triage/scripts/build_brief.py", "start": 351, "end": 381, "note": "这一步是被写进任务书的，不是靠人记得", "total": 459, "text": "    # ── 发布前评审（ADR-0094）──\n    # 这一段和上面那些\"写作规则\"性质不同：上面是给写作者的要求，这一段是给\n    # **写作者之外的一个模型**的要求。放在这里的理由是位置——它必须出现在\n    # 「你已经写完了、还没发布」的那个时刻，而这正是本文件被读的时刻。\n    lines.append(\"### 发布前评审（必须做，2026-10-31 起，ADR-0094）\")\n    lines.append(\"\")\n    lines.append(\"写完、**在跑 `--after-write --publish` 之前**，必须做一次独立评审：\")\n    lines.append(\"\")\n    lines.append(\"1. 用 `subagent` 起一个**独立**的评审子智能体（它不共享你的上下文，所以要把成稿路径、\")\n    lines.append(\"   观点卡路径写进它的任务里）。要求它先 `skill` 加载 `elon-musk-perspective`，\")\n    lines.append(\"   再按该技能的模型评审——不是给通用写作建议。\")\n    lines.append(\"2. 评审意见原样写到 `docs/reviews/<今天>-elon-review.md`（入库，次日可复核）。\")\n    lines.append(\"3. **诚实接收**：逐条判 accept / reject。accept 的必须真的改稿；reject 的必须写清理由\")\n    lines.append(\"   （指证据或指规则，不接受「我觉得没必要」）。\")\n    lines.append(\"4. 改完、改完的稿子重新对一遍上面的标题/篇幅/首段要求，再跑发布。\")\n    lines.append(\"\")\n    lines.append(\"为什么在这一步：它是全流程里**唯一一处由另一个模型对成稿下判断**的环节。\")\n    lines.append(\"同上下文的自查看不见自己的盲区——本仓库连续四天的缺陷（ADR-0092/0093、封面孤字、\")\n    lines.append(\"10-30 那篇的三处硬数字）都是「报告全绿、东西是错的」。评审不是打分，是找一个愿意反对你的读者。\")\n    lines.append(\"\")\n    lines.append(\"**判据**：评审若一条 blocker 都没提，要么稿子真没问题，要么它被写成了夸奖——\")\n    lines.append(\"后者要在记录里明写出来，不许把沉默当成通过。它**不拦发**，拦发权在你，\")\n    lines.append(\"但每个 reject 都要留得下理由。\")\n    lines.append(\"\")\n\n    # ── 正文观察项（`platforms/prose-rules.md`）──\n    # 只说明\"会被记什么\"，**不印标记词**。这是刻意的：把「先别」「记下来」这些词\n    # 印给写作方，写作方只要在末段塞一个就满足了标签，而标签本该检测结构而不是口令。\n    # 标题规则那边可以印（标题短、词表即规则本身），正文这边印了就等于教人作弊。\n    lines.append(\"### 发布后会记下的正文标签（`platforms/prose-rules.md`，不拦发）\")\n    lines.append(\"\")"}, {"path": "docs/reviews/2026-10-31-elon-review.md", "start": 1, "end": 20, "note": "2026-10-31 的真实评审记录", "total": 79, "text": "# 2026-10-31 发布前评审记录（ADR-0094）\n\n成稿：`outputs/2026-10-31-ai-content-price-anchor-is-zero.md`\n标题（改后）：《AI电影票房150万：有人替观众付了钱，你卖不上价》\n评审者：独立子智能体（加载 `elon-musk-perspective`，只判不改、未联网、未改文件）\n结论：`verdict: 需改` → 主智能体**四条 blocker 全部接受**并重写\n\n---\n\n## 一、主智能体在评审回来之前的自查\n\n写下来是为了让「评审之后有没有改口」可被对照：\n\n| # | 自查项 | 严重度 | 评审是否也提到 |\n| --- | --- | --- | --- |\n| A | 场景与上一篇重复（30 万审批 + CFO 问回本） | 高 | 间接（blocker 4 判「安慰动作」，我照此整段换掉） |\n| B | 结尾句式与 10-30 雷同 | 中 | 间接（同上） |\n| C | 「必然卖不动」过度断言 | 中 | 是（blocker 3） |\n| D | 删掉最有信息量的一层：红果靠广告、内容卖多少钱它不在乎 | 高 | **是（blocker 1/2 的核心）** |\n| E | 机制归属不清：免费 vs 补贴 | 高 | **是（blocker 3 的判据）** |"}, {"path": "docs/reviews/2026-10-31-elon-review.md", "start": 12, "end": 24, "note": "自查 6 条 vs 评审 4 条：评审有两处比自查更准确", "total": 79, "text": "写下来是为了让「评审之后有没有改口」可被对照：\n\n| # | 自查项 | 严重度 | 评审是否也提到 |\n| --- | --- | --- | --- |\n| A | 场景与上一篇重复（30 万审批 + CFO 问回本） | 高 | 间接（blocker 4 判「安慰动作」，我照此整段换掉） |\n| B | 结尾句式与 10-30 雷同 | 中 | 间接（同上） |\n| C | 「必然卖不动」过度断言 | 中 | 是（blocker 3） |\n| D | 删掉最有信息量的一层：红果靠广告、内容卖多少钱它不在乎 | 高 | **是（blocker 1/2 的核心）** |\n| E | 机制归属不清：免费 vs 补贴 | 高 | **是（blocker 3 的判据）** |\n| F | 自引 10-25 的 10,150 个产品数据靠记忆 | 低 | 是（improvement 4） |\n\n自己看到 6 条，评审抓到 4 条其中有 2 条比我更准确（D/E 我给的是「信息量损失」，评审给的是「因果混淆」）。\n"}, {"path": "docs/adr/0094-publish-gated-by-independent-elon-lens-review.md", "start": 20, "end": 36, "note": "ADR-0094 的五条决定", "total": 52, "text": "## 决定\n\n在「成稿写完」与「跑 `--after-write --publish`」之间插入一道评审关：\n\n1. **评审由一个独立的子智能体做**（`subagent`，不共享主会话上下文，所以要显式给它文件路径）。\n2. **它必须先加载 `elon-musk-perspective` 技能**，按该技能的心智模型与启发式评审，\n   而不是给通用写作建议。选这个技能是因为它的提问方式天然反自查：\n   第一性原理（你给的是机制还是现象）、白痴指数（有没有拆到成本/零件）、\n   五步算法里的**质疑需求**与**删除**（哪一段删掉后读者的行动依据不变）。\n3. **评审意见落盘**到 `docs/reviews/<日期>-elon-review.md`（入库、可回溯、次日可复核），\n   格式是 `verdict / blockers / improvements / what_survives / musk_lens_notes`。\n4. **主智能体必须逐条判 accept / reject**：accept 的真的改稿；reject 的写明理由\n   （指证据或指规则，不接受「我觉得没必要」）。\n5. **评审若一条 blocker 都没提**，必须在评审记录里明写「这是真没问题，还是评审被写成了夸奖」，\n   不允许把沉默当成通过（ADR-0057 的同型：绿色可能是假阳性）。\n\n## 为什么是「评审」而不是「重新写一遍」"}]}, {"id": "n10-cover", "step": "④b", "title": "封面（含可选照片）", "layer": "publish-prep", "when": "第 3 段开头", "actor": "脚本（Pillow / wewrite venv 的 python）", "one_liner": "按 spec 画封面；spec 里写了 photo_query 才去取 CC0 照片，并把自检结果留档给简报。", "does": ["只有 spec 写了 photo_query 才取图——谁来负责任：只有写作阶段知道文章讲什么、也才知道「机房照片配一篇讲迁移的文章」算不算图文无关。", "照片必须来自 CC0/公有领域，许可证与来源全部记进 .newsagg/photos/ledger.jsonl。", "画出后做安全区与边缘自检，warnings/problems/drawn 元素高度写进 .newsagg/covers/<date>.report.json。", "封面样式按日期哈希从 8 种里确定性选出，且不与前一天撞款。"], "why": ["ADR-0048：没有 query 就说明没人做过图文相关的判断，此时加一张来路不明的照片只是把「图文无关」变成系统自动决定。", "ADR-0049：首页信息流会把图裁成 3:2，元素必须落在安全区内。", "ADR-0044 发现六：无人值守时没有第二双眼睛，自检警告必须落到简报里，否则等于没检查。", "ADR-0039/0052：make_cover 依赖 Pillow，只装在 wewrite 的 venv 里，所以解释器被钉死为 $REPO/.uv-tools/wewrite/bin/python。"], "reads": [{"path": ".newsagg/covers/2026-10-31.json", "start": null, "end": null, "note": "封面论据", "total": 1, "text": "{\n  \"layout\": \"number\",\n  \"kicker\": \"首部AI院线电影\",\n  \"hero\": \"1\",\n  \"hero_unit\": \"% 上座率\",\n  \"payoff\": \"有人替观众付了钱\"\n}"}], "writes": [{"path": ".newsagg/covers/2026-10-31.report.json", "start": null, "end": null, "note": "自检留档（简报 ⑤ 段读取）", "total": 52, "text": "{\n  \"ok\": true,\n  \"title\": \"AI电影票房150万：有人替观众付了钱，你卖不上价\",\n  \"out\": \"C:\\\\Users\\\\cyx\\\\Documents\\\\repository_git\\\\NewsAgg\\\\outputs\\\\covers\\\\2026-10-31-ai-content-price-anchor-is-zero.png\",\n  \"size\": \"…(2 项)\",\n  \"layout\": \"number\",\n  \"style\": \"blush\",\n  \"style_pinned\": false,\n  \"kicker\": \"首部AI院线电影\",\n  \"title_chars\": 25,\n  \"bytes\": 40878,\n  \"thumb_scale\": 0.267,\n  \"drawn\": \"…(4 项)\",\n  \"hero_ratio\": 0.459,\n  \"restates_title\": false,\n  \"safe_inset\": 93,\n  \"text_width\": 858.0,\n  \"photo\": \"\",\n  \"photo_enabled\": false,\n  \"photo_path\": \"\",\n  \"panel_height\": 675,\n  \"problems\": \"…(0 项)\",\n  \"warnings\": \"…(0 项)\"\n}"}], "files": [{"path": ".agents/skills/newsagg-publish/scripts/make_cover.py", "start": 80, "end": 88, "note": "安全区由 3:2 裁切推导", "total": 1324, "text": "# 后果：左右各丢 (1200 - 675*1.5)/2 = 93.75px → int() 取整为 93px，约 7.8%。5 张历史封面逐像素统计\n# 全部有内容落在安全区外，最严重那张把「做应用的人省钱」的「钱」字切掉一半。\n#\n# 所以排版必须**先保证内容在 3:2 安全区内**，再谈字号。\nFEED_CARD_ASPECT = 1.5\n# 3:2 安全区左右各被切掉多少（1200x675 时 = 93px；理论值 93.75，向下取整）\nSAFE_INSET = max(0, int((DEFAULT_SIZE[0] - DEFAULT_SIZE[1] * FEED_CARD_ASPECT) / 2))\n\nINK = (8, 10, 16)"}, {"path": ".agents/skills/newsagg-publish/scripts/make_cover.py", "start": 169, "end": 181, "note": "确定性选样式且避开前一天", "total": 1324, "text": "def style_for_date(day: str) -> str:\n    \"\"\"按日期确定性地选一种样式。无状态：同一天重跑必一致。\n\n    为什么不用 random：无人值守的定时任务可能一天跑多次，random 会让\n    「今天用哪张样式」变成不可复现的——重跑一次封面就换了长相。日期哈希\n    不需要状态文件（状态文件会坏、会丢、会被 git 搞脏），天然幂等。\n    相邻两天撞上同一种时 +1 错开，保证「每天换一种」的直觉成立。\n    \"\"\"\n    idx = zlib.crc32(day.encode(\"utf-8\")) % len(STYLE_ORDER)\n    if STYLE_ORDER[idx] == style_for_date_prev(day):\n        idx = (idx + 1) % len(STYLE_ORDER)\n    return STYLE_ORDER[idx]\n"}, {"path": ".agents/skills/newsagg-publish/scripts/make_cover.py", "start": 692, "end": 706, "note": "number 布局：hero 数字 + payoff 论点", "total": 1324, "text": "def layout_number(\n    size, kicker: str, hero: str, unit: str, payoff: str, note: str,\n    drawn: list | None = None, top_pad: int = 0, style: dict | None = None,\n) -> Image.Image:\n    \"\"\"数字英雄：一个数字占满画面。缩略图下最抗缩放。\n\n    分四个**垂直带**，先算下面的带再给上面剩下的空间：\n    kicker / hero / payoff / note。所有字号都由测量得出，且 hero 同时受\n    宽度和可用高度约束——只按宽度放大会让数字撞进论点区。\n\n    样式（材质）经 `style` 注入：底色、墨色、强调色、显示字体。本函数对\n    「今天用哪种材质」一无所知，也不该知道——布局与样式正交。\n    \"\"\"\n    st = style or STYLES[LEGACY_STYLE]\n    ffn = lambda s: find_style_font(st, s)  # noqa: E731"}, {"path": ".agents/skills/newsagg-publish/scripts/fetch_photo.py", "start": 1, "end": 26, "note": "照片层：许可证必须记账", "total": 283, "text": "#!/usr/bin/env python3\n\"\"\"从 Wikimedia Commons 取一张**许可证明确、可无人值守使用**的照片，作封面背景。\n\n设计依据 ADR-0048（封面照片的来源与许可证边界）、ADR-0013（不使用新闻原图）、\nADR-0044（封面承载一个视觉论据）。\n\n三条硬约束，缺一条就不取图：\n\n1. **只取不需要署名的许可证**（CC0 / Public domain）。CC-BY 系列要求署名，\n   而无人值守的发布链没有「记得署名」这个环节——忘一次就是违约一次。\n   把「必须署名」的图排除在候选之外，比事后提醒可靠。\n2. **相关性可判定**。Commons 的搜索结果里混着地图、旗帜、logo、人物肖像、\n   新闻截图。实测搜 `DeepSeek` 返回的第一页里有《DeepSeek – VR China und Taiwan》\n   （一张中台地图）——这类图发到头条是政治风险，不是配图。所以要求查询词\n   至少命中一个，且标题/描述/分类不含风险词。\n3. **失败绝不阻断发布**。取不到合格照片就返回 ok=false，编排器回退到纯模板封面。\n\n许可证与来源**全部记账**（`.newsagg/photos/ledger.jsonl`），因为「我们当时以为\n它是 CC0」不是抗辩理由，账本才是。\n\n⚠️ User-Agent 必须带联系方式。实测用 `NewsAgg/1.0 (personal news digest)` 连续\n请求会收到 **HTTP 429 Too Many Requests**，换成带 URL 的 UA 后恢复 200。\nCommons 对匿名批量的限流很敏感，而限流失败在这里会退化成「没有照片」——不致命，\n但会让这个功能时灵时不灵。\n\"\"\"\n"}, {"path": ".agents/skills/newsagg-collect/scripts/run_all.sh", "start": 813, "end": 823, "note": "缺 spec 时的回退告警", "total": 972, "text": "  COVER_SPEC_ARG=(--spec \"$COVER_SPEC\")\nelse\n  # 没有 spec 不等于失败（封面仍会生成），但它是「写作阶段漏了一步」的信号。\n  # 2026-10-20 就是静默走了这条路，产出一张复述标题的封面而无人察觉（ADR-0044 发现五）。\n  echo \"注意：未找到封面论据 ${COVER_SPEC}，回退到标题推导（封面会复述标题的部分内容）\" >&2\nfi\n\n# ── 照片层（ADR-0048）──────────────────────────────────────────────\n#\n# 只有 spec 里写了 `photo_query` 才取图。这不是省事，是**责任划分**：\n# 只有写作阶段知道这篇文章讲的是什么，也只有它能判断「机房照片配一篇"}]}, {"id": "n11-publish", "step": "⑤", "title": "发布（门 + 反查）", "layer": "publish", "when": "第 3 段", "actor": "脚本 → vendor 的 toutiao-ops（node）", "one_liner": "过门后才发；发出后再读回平台确认，把结果与承接卡写进账本。", "does": ["门 0 熔断：.newsagg/breaker.json 存在即拒绝发布，人工修复后删文件解除。", "门 0.5 每日上限：今天已成功发布 ≥1 篇即拒绝（dry-run 不消耗额度）。需补发/重发时须显式 --allow-daily-override 并写理由。", "门 1 输入：成稿存在、有一级标题、封面文件存在（头条必填）。", "标题硬下限：按 platforms/title-rules.md 拦，因为被平台退回的文章再改也不会被推荐。", "正文观察项：只打四个标签写进账本，**不拦发**——正文没有「拒发」的正确阈值。", "门 2 登录预检：只读，最多 3 次；判定为 login_lost 即熔断。门 3 内存预检：可用内存低于下限即熔断（ADR-0023）。", "发布命令显式带 --no-weitoutiao（平台默认是勾选的，同发会造成内容重复）。", "门 5 反查：按平台实际收到的标题去作品列表里查；咽字时以平台标题为准。", "全程 FileLock 串行锁；锁带 pid，用 kill(pid,0) 判断持有者是否存活，崩溃不会留下永久锁。"], "why": ["ADR-0014：dry-run 默认开启；dry-run 走 --draft，会在真实账号上创建真实草稿，不是无痕验证。", "ADR-0081：「每日 1 篇」从 ADR-0074 起一直空转——repo_root_of() 上溯三级指错了仓库根，闸门查的是另一份账本。空转的闸比没有闸更危险，它让人以为有保护。", "ADR-0093：闸门拒绝不是故障。原先只看退出码，于是「今日额度已用」被渲染成「系统运行失败，请重跑」——照它把闸门去掉就是重复发文。", "ADR-0082：正文规则只打标签不拦发；标题规则相反，它拦——标题被退回是「这一篇归零」，而不是「少一点点击」。", "ADR-0051：平台实际标题可能被输入框咽字，按原标题反查会把真实发布误判成未发布。", "ADR-0034：一次运行只产一篇文章，同发微头条会造成内容重复且不受每日上限与冷却期约束。", "ADR-0037：把承接卡写进账本——循环 C 要按卡归因回答「哪些卡跑出了数据」。"], "reads": [{"path": ".newsagg/triage/2026-10-31-decision.json", "start": null, "end": null, "note": "card_file 从这里取", "total": 35, "text": "{\n  \"decision\": {\n    \"action\": \"continue\",\n    \"card_file\": \"personal-ai-monetization-is-paid-demand-not-technology.md\",\n    \"whats_new\": \"本卡此前证明「技术不构成差异、决定可行性的是付费需求」，今天补上付费需求这一侧的机制：它的天花板由**谁在替用户付钱**决定，不由作品质量决定，也不只是「有免费替代品」这么简单。同一周两个对照：国内首部 AI 院线电影《三星堆：未来往事》成本千万级，上映超一周票房不足 150 万、上座率约 1%、片方分账几十万，已把结算标准降到 20 元、分账从 43:57 让到 40:60 仍未换来票房；芒果 TV 首部 AI 剧集《后西游记》放卫视与会员里免费，股价几天涨五成。但这两个案例不能读成「收费就死」——它们差了四样（谁掏成本、走什么渠道、卖给谁、钱从哪回来），免费那头**从没问过观众价**，它只证明有人愿意出钱把价格按住，而那个人不是观众。按价的人在上游：红果日活 1.68 亿（原文口径：比四家长视频加起来还多）、一
