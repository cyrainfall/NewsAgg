<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NewsAgg · 工作过程可视化</title>
<style>
:root{
  --bg:#0d1117; --bg2:#12181f; --panel:#161b22; --panel2:#1c232b;
  --line:#2b333d; --line2:#3a444f;
  --fg:#e6edf3; --fg2:#9aa7b4; --fg3:#6e7b8a;
  --accent:#4a9eff; --accent2:#7ee787;
  --warn:#d29922; --danger:#f85149; --purple:#bc8cff; --pink:#ff7b9c;
  --mono:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.6;overflow:hidden}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{
  display:flex;align-items:center;gap:18px;padding:10px 18px;
  background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap;
}
header h1{font-size:15px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
header h1 span{color:var(--accent)}
.sub{font-size:11.5px;color:var(--fg3);white-space:nowrap}
.spacer{flex:1}
.stats{display:flex;gap:14px;font-size:11.5px;color:var(--fg2);font-family:var(--mono);flex-wrap:wrap}
.stats b{color:var(--accent2);font-weight:600}
.searchbox{position:relative}
#search{
  background:var(--panel);border:1px solid var(--line2);color:var(--fg);
  padding:6px 10px 6px 28px;border-radius:6px;font-size:12.5px;width:230px;
  font-family:var(--sans);outline:none;
}
#search:focus{border-color:var(--accent)}
.searchbox svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);opacity:.5}
main{display:grid;grid-template-columns:250px minmax(0,1fr) minmax(0,1.15fr);overflow:hidden;min-height:0}
.col{overflow-y:auto;overflow-x:hidden;min-height:0}
.col::-webkit-scrollbar{width:9px}
.col::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
.col::-webkit-scrollbar-track{background:transparent}
#rail{background:var(--bg2);border-right:1px solid var(--line)}
#detail{background:var(--bg);border-right:1px solid var(--line)}
#viewer{background:var(--panel)}
.group{padding:12px 14px 4px}
.group-t{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--fg3);font-weight:600;margin-bottom:7px;
}
.node-i{
  display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;
  padding:6px 8px;border-radius:6px;cursor:pointer;margin-bottom:2px;
  border:1px solid transparent;
}
.node-i:hover{background:var(--panel2)}
.node-i.on{background:var(--panel2);border-color:var(--line2)}
.node-i.hide{display:none}
.node-i .step{
  font-family:var(--mono);font-size:11px;color:var(--fg3);
  text-align:right;padding-top:1px;white-space:nowrap;
}
.node-i[data-layer=collect] .step{color:var(--accent)}
.node-i[data-layer=triage] .step{color:var(--purple)}
.node-i[data-layer=write] .step{color:var(--accent2)}
.node-i[data-layer=publish] .step{color:var(--pink)}
.node-i[data-layer=gate] .step{color:var(--warn)}
.node-i[data-layer=ci] .step{color:var(--fg2)}
.node-i[data-layer=sediment] .step{color:var(--purple)}
.node-i[data-layer=orchestrate] .step{color:var(--fg2)}
.node-i[data-layer=file] .step{color:var(--fg3)}
.file-i .nm{font-family:var(--mono);font-size:11.5px}
.node-i .nm{font-size:12.5px;line-height:1.35;word-break:break-word}
.node-i .nm small{display:block;color:var(--fg3);font-size:10.5px;font-family:var(--sans);margin-top:1px}
/* ── detail ── */
.d-head{padding:16px 20px 12px;border-bottom:1px solid var(--line);background:var(--bg2)}
.d-step{
  font-family:var(--mono);font-size:11px;color:var(--accent);
  letter-spacing:.08em;margin-bottom:3px;
}
.d-title{font-size:17px;font-weight:600;margin-bottom:8px;line-height:1.35}
.d-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tag{
  font-size:11px;padding:2px 7px;border-radius:4px;
  background:var(--panel2);color:var(--fg2);border:1px solid var(--line);
}
.tag.who{color:var(--accent2)}
.tag.when{color:var(--warn)}
.d-one{font-size:13px;color:var(--fg2);line-height:1.65}
.d-body{padding:14px 20px 40px}
.sec{
  font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--fg3);
  font-weight:600;margin:16px 0 7px;padding-bottom:4px;border-bottom:1px solid var(--line);
}
ul.list{list-style:none}
ul.list li{
  position:relative;padding-left:15px;margin-bottom:6px;
  font-size:12.5px;line-height:1.65;color:var(--fg);
}
ul.list li::before{content:'·';position:absolute;left:3px;color:var(--accent);font-weight:700}
ul.list.why li::before{content:'?';color:var(--fg3)}
ul.list.why li{color:var(--fg2)}
.adr{
  font-family:var(--mono);font-size:11px;color:var(--warn);
  background:rgba(210,153,34,.12);padding:1px 4px;border-radius:3px;
}
.fgroup{margin-top:10px}
.fg-t{
  font-size:11.5px;color:var(--fg2);margin-bottom:6px;
  display:flex;align-items:center;gap:6px;
}
.cnt{font-family:var(--mono);font-size:10.5px;color:var(--fg3)}
.fcard{
  border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin-bottom:5px;
  cursor:pointer;background:var(--bg2);transition:border-color .12s,background .12s;
}
.fcard:hover{border-color:var(--line2);background:var(--panel2)}
.fcard.on{border-color:var(--accent);background:var(--panel2)}
.fc-top{display:flex;align-items:center;gap:6px}
.fc-ico{font-size:9px;color:var(--fg3);width:10px;flex-shrink:0}
.fc-path{
  font-family:var(--mono);font-size:11px;flex:1;
  word-break:break-all;line-height:1.4;
}
.fc-lines{color:var(--accent);font-family:var(--mono);font-size:11px}
.badge-rw{
  font-size:9.5px;padding:1px 5px;border-radius:3px;flex-shrink:0;
  font-family:var(--mono);
}
.badge-rw.r{background:rgba(74,158,255,.15);color:var(--accent)}
.badge-rw.w{background:rgba(126,231,135,.15);color:var(--accent2)}
.fc-note{font-size:11px;color:var(--fg3);margin-top:3px;padding-left:16px;line-height:1.45}
/* ── viewer ── */
.v-empty{
  height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;color:var(--fg3);font-size:12.5px;text-align:center;padding:20px;
}
.v-empty kbd{
  font-family:var(--mono);font-size:10.5px;background:var(--panel2);
  border:1px solid var(--line2);border-radius:3px;padding:1px 5px;
}
.v-head{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0;z-index:2}
.v-path{font-family:var(--mono);font-size:12px;color:var(--accent);word-break:break-all;margin-bottom:5px}
.v-note{font-size:12px;color:var(--fg2);line-height:1.55;margin-bottom:6px}
.v-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.v-src{font-size:10.5px;color:var(--fg3);line-height:1.5}
pre.code{
  font-family:var(--mono);font-size:11.5px;line-height:1.65;
  padding:10px 0 40px;overflow-x:auto;
}
pre.code .row{display:flex;padding:0 12px;white-space:pre}
pre.code .row:hover{background:rgba(255,255,255,.03)}
pre.code .row.hl{background:rgba(210,153,34,.13)}
pre.code .ln{
  width:52px;flex-shrink:0;text-align:right;padding-right:12px;
  color:var(--fg3);user-select:none;opacity:.65;
}
pre.code .tx{white-space:pre;color:var(--fg)}
pre.code .hit{background:rgba(210,153,34,.32);border-radius:2px;color:#fff}
</style>
</head>

al: no upstream configured`——它既不在\n#      冲突正则里，也不在网络正则里 → 走 fail_soft → **当晚整轮死在第①步**；\n#   ② 就算活下来，收尾 `git push origin main` 推的是**本地 main**，今天的提交\n#      留在特性分支上，而脚本照样打印「已推送 origin/main」。\n# 所以：一律按**当前分支**取远端，并在起跑时把分支名说一遍。\ncurrent_branch() {\n  local b\n  b=\"$(git rev-parse --abbrev-ref HEAD 2>/dev/null || true)\"\n  if [[ -z \"$b\" || \"$b\" == \"HEAD\" ]]; then echo \"main\"; else echo \"$b\"; fi\n}\n\nBRANCH=\"$(current_branch)\"\nif [[ \"$BRANCH\" != \"main\" ]]; then\n  echo \"分支：${BRANCH}（不是 main）——本轮的所有提交都会落在这个分支上\" >&2\n  echo \"      这与 ADR-0065 有关：编排器不再假定你在 main 上。\" >&2\nfi"}]}, {"id": "n02-style", "step": "②", "title": "风格学习（循环 B）", "layer": "sediment", "when": "① 之后、分拣之前", "actor": "脚本 + 物主", "one_liner": "对比「发布那一刻的快照」与「你后来改过的教学副本」，把你的修改学成风格偏好。", "does": ["从 git 历史取发布快照做基线（不取 draft，避免把审稿环节的 AI 改动当成你的偏好）。", "按内容 sha256 去重，同一版本只学一次——否则你分几天改同一篇会被计多次，凭空击穿 wewrite 的「重复≥2 次升级为硬规则」阈值。", "脚本只记录 diff；pattern 提取（这次修改反映了什么偏好）是判断，留给物主/agent。"], "why": ["ADR-0026 循环 B：时刻必须早于写作——这一轮学到的东西今天就要用上。", "ADR-0008：人从「发布前审批」退到「发布后反馈」；你的修改是唯一真实信号源。"], "reads": [{"path": ".newsagg/publish-ledger.jsonl", "start": null, "end": null, "loc": "第 12 行 / 共 12 行（JSON 已格式化便于阅读）", "note": "发布账本：风格 diff 的基线与 NyA指针", "total": 12, "text": "{\n  \"at\": \"2026-10-26T21:04:08.624164+08:00\",\n  \"slug\": \"2026-10-26-layoff-reasons-without-ai\",\n  \"title\": \"被裁半年降薪15%：四条原因里没有AI\",\n  \"title_on_platform\": \"被裁半年降薪15%：四条原因里没有AI\",\n  \"mode\": \"publish\",\n  \"steps\": [\n    {\n      \"step\": \"auth_check\",\n      \"backend\": \"api\",\n      \"attempt\": 1,\n      \"ok\": true\n    },\n    {\n      \"step\": \"publish\",\n      \"backend\": \"browser\",\n      \"mode\": \"publish\",\n      \"code\": 0,\n      \"kind\": \"unknown\"\n    }\n  ],\n  \"stdout_tail\": \"{\\n  \\\"success\\\": true,\\n  \\\"action\\\": \\\"published\\\",\\n  \\\"title\\\": \\\"被裁半年降薪15%：四条原因里没有AI\\\",\\n  \\\"expected_title\\\": \\\"被裁半年降薪15%：四条原因里没有AI\\\",\\n  \\\"title_truncated_by_platform\\\": false 容哈希去重**，同一版本只学一次。否则你分几天改同一篇、系统每天 diff 一次，\n   同一次修改会被计多次，凭空达到 wewrite 的「重复≥2次升级为硬规则」阈值\n   ——恰好击穿它自己的保护。\n3. **时机**：挂在每日运行开头、git pull 之后（ADR-0026 时序第 ②步）。\n\n本脚本只做确定性工作：找快照、算哈希、判是否已学、调用 learn-edits。\n\"\"\""}, {"path": ".agents/skills/newsagg-triage/scripts/style_learn.py", "start": 58, "end": 72, "note": "从 git 取发布快照", "total": 249, "text": "def find_publish_snapshot(root: Path, rel_path: str, slug: str) -> tuple[str, str] | None:\n    \"\"\"取发布快照（发布那一刻的成稿内容），作为风格 diff 的基线。\n\n    ⚠️ ADR-0036：**不能**用「该文件最后一次提交」推断快照。\n    本人改稿并 push 后，最后一次提交就变成改稿本身，基线随之错位 ——\n    diff 恒为空、风格学习静默失效（本项目实测踩到，见 ADR-0036）。\n\n    优先级：\n    1. 发布账本里记录的 `snapshot.git_blob`（发布时写入，权威）\n    2. 回退：账本记录的发布时间之前的最后一次提交（兼容 ADR-0036 之前的旧记录）\n    \"\"\"\n    recs = [r for r in read_ledger(root / \".newsagg\" / \"publish-ledger.jsonl\")\n            if r.get(\"slug\") == slug and r.get(\"mode\") == \"publish\"]\n    if not recs:\n        return None"}, {"path": ".agents/skills/newsagg-triage/scripts/style_patterns.py", "start": 1, "end": 22, "note": "为什么还需要第二步：learn-edits 只记 diff，不提 pattern", "total": 189, "text": "#!/usr/bin/env python3\n\"\"\"风格回路：把「已学的 diff 记录」补上 patterns（agent 判断的确定性外壳）。\n\n为什么需要这个脚本（ADR-0026 循环 B 的最后一环）：\n`wewrite learn-edits` **只记录 diff、不提取 pattern**——其源码里\n`\"patterns\": []` 带注释 \"Agent fills these after analyzing the draft and final\"。\n这是 wewrite「prompt 负责判断，Python 负责确定性」的分工：提取\"这次修改反映了\n什么偏好\"是判断，属 agent。\n\n因此闭环需要两步：\n  1. style_learn.py  → 调 learn-edits，产出 lesson YAML（patterns 为空）\n  2. 本脚本          → 读出 lesson 里引用的 draft/final，把两者内容一并输出，\n                       供 agent 阅读并写出 patterns\n\n本脚本**不做判断**：不猜 pattern，只把判断所需的材料准备好、并在 agent 写完后\n把 patterns 合并回 lesson 文件（保持 wewrite 期望的 YAML 结构）。\n\n用法：\n  # 准备材料（agent 读它的输出后写 patterns）\n  python3 style_patterns.py --prepare\n\n  # 合并 agent 写好的 patterns（JSON 数组）"}, {"path": ".agents/skills/newsagg-collect/scripts/run_all.sh", "start": 414, "end": 426, "note": "编排器里的调用点", "total": 772, "text": "style_learn() {\n  log \"② 风格学习（若你改过教学副 ctor": "脚本", "one_liner": "若系统处于自动降频状态且今天是跳过日 → 只出简报，不采集不写作不发布。", "does": ["读 .newsagg/frequency.json 判定今天是不是跳过日。", "命中则写 run-status（stage=downshift_skip）、出简报、commit+push、exit 0。"], "why": ["ADR-0010：降频是自动的，**恢复必须人工确认**——删除 .newsagg/frequency.json 才解除。", "跳过日是设计行为，不是故障；但必须显式写进简报，让看守不把它当成「今日无选题」。"], "reads": [], "writes": [], "files": [{"path": ".agents/skills/newsagg-performance/scripts/performance.py", "start": 381, "end": 395, "note": "跳过日判定", "total": 623, "text": "def is_skip_day(freq: dict | None, date: str) -> tuple[bool, str]:\n    \"\"\"降频生效后按隔日跳过。降频当日不跳，其后每个奇数日跳过。\"\"\"\n    if not freq or not freq.get(\"downshifted\"):\n        return False, \"\"\n    since = str(freq.get(\"since\") or \"\")\n    try:\n        d0 = datetime.strptime(since, \"%Y-%m-%d\").date()\n        d1 = datetime.strptime(date, \"%Y-%m-%d\").date()\n    except (ValueError, TypeError):\n        return False, \"\"\n    delta = (d1 - d0).days\n    if delta <= 0:\n        return False, f\"降频自 {since} 生效（当日仍发文）\"\n    if delta % 2 == 1:\n        return True, f\"降频中（ADR-0010）：自 {since} 起隔日发文，今日为跳过日\""}, {"path": ".agents/skills/newsagg-performance/scripts/performance.py", "start": 52, "end": 56, "note": "解除方式", "total": 623, "text": "HOW_TO_CLEAR = (\n    \"人工确认表现已恢复后，删除 .newsagg/frequency.json 即可解除\"\n    \"（ADR-0010：恢复同样需要人工确认，系统不自动恢复）\"\n)\n"}, {"path": ".agents/skills/newsagg-collect/scripts/run_all.sh", "start": 477, "end": 491, "note": "编排器里的分支", "total": 772, "text": "skip_day_gate() {\n  local skip\n  skip=\"$(python3 .agents/skills/newsagg-performance/scripts/performance.py --check-skip 2>/dev/null \\\n    | python3 -c 'import json,sys\ntry: print(\"1\" if json.load(sys.stdin).get(\"skip\") else \"0\")\nexcept Exception: print(\"0\")' 2>/dev/null || echo 0)\"\n  if [[ \"$skip\" == \"1\" ]]; then\n    log \"②c 降频跳过日：今日不发文\"\n    echo \"系统处于自动降频状态（ADR-0010），今日为跳过日——只出简报，不采集不写作不发布。\"\n    echo \"解除：人工确认表现已恢复后删除 .newsagg/frequency.json。\"\n    write_status 1 \"downshift_skip\" \"降频跳过日（设计 tem_key(it), None)"}, {"path": ".newsagg/candidates/2026-10-26.json", "start": null, "end": null, "note": "当天三次采集的真实记录", "total": 8223, "text": "{\n  \"collection_runs\": [\n    {\n      \"at\": \"2026-10-26T08:00:24.095443+08:00\",\n      \"fetched\": 250,\n      \"kept\": 82,\n      \"dropped\": 168,\n      \"sources_ok\": 7,\n      \"sources_failed\": 0,\n      \"kept_new\": 82\n    },\n    {\n      \"at\": \"2026-10-26T13:11:12.757021+08:00\",\n      \"fetched\": 278,\n      \"kept\": 93,\n      \"dropped\": 185,\n      \"sources_ok\": 7,\n      \"sources_failed\": 0,\n      \"kept_new\": 45\n    },\n    {\n      \"at\": \"2026-10-26T18:00:01.805054+08:00\",\n      \"fetched\": 279,\n      \"kept\": 106,\n      \"dropped\": 173,\n      \"sources_ok\": 7,\n      \"sources_failed\": 1,\n      \"kept_new\": 38\n    }\n  ]\n}"}, {"path": ".agents/skills/newsagg-collect/scripts/run_all.sh", "start": 495, "end": 501, "note": "编排器调用点；全源不可达才算失败", "total": 772, "text": "collect_now() {\n  log \"③ 采集（同日多次采集会累积合并，保留事件发酵过程）\"\n  if ! python3 .agents/skills/newsagg-collect/scripts/collect.py --base \"$HOT_BASE\"; then\n    fail_soft \"collect\" \"采集失败（全部源不可达）\" \"热榜服务 $HOT_BASE\" 1\n  fi\n}\n"}]}, {"id": "n06-triage-input", "step": "③b", "title": "组装分拣输入包", "layer": "triage", "when": "21:00 第 1 段，采集之后", "actor": "脚本", "one_liner": "把候选条目、全部 active 卡正文、冷却状态、限额、位次趋势、历史表现装进一个大包。", "does": ["8 张 active 卡**全文**进包（含当前判断/依据事实/修订史/边界与反方五节）——只看卡名判不了匹配度。", "每张卡的 covered_events 由 cardfm.py 解析，这是全仓唯一实现。", "给每条候选算位次趋势 trend（state/delta/observations/position_source）。", "trend_summary 单独给出覆盖率；participant：unknown+absent 占大半时明确说「本轮 trend 没有信息量」。"], "why": ["ADR-0042：两份契约的两份实现一定会漂移，且漂移是静默的。三份 parse_frontmatter 漂移后，分拣层看不到「这张卡写过什么」而写作层看得到——同一轮里一个知道一个不知道。", "ADR-0056：刻度必须是同源位次百分位。池内名次会把退步读成爬升（rank 22→25 曾被判 climbing）。", "ADR-0007：covered_events 是防重复发文的唯一依据，读不到就等于没有。"], "reads": [{"path": "knowledge/cards/ai-replacing-developers-misreads-the-work.md", "start": 1, "end": 22, "note": "观点卡：frontmatter + 五节结构", "total": 68, "text": "---\nissue: 「AI 取代开发者」的叙事搞错了开发工作的本质\nstatus: active\ncreated: 2026-10-14\nlast_written: 2026-10-26\ncovered_events:\n  - 2026-10-21 雇主开始撤回「AI 替代员工」的假设，但岗位结构已经先一步变了：Meta 因 AI 未达预期叫停第二轮裁员、微软承认业务成效没随 AI 推广出现；同时大厂前端 JD 有 63% 提到 AI、一半写进任职要求，而一家教育公司正在把正式岗换成外包岗——被压缩的不是初级岗位，是中间层的正式岗位\n  - 2026-10-26 两位程序员的一手账本，加上一份机制拆解，凑出了「AI 裁员」这个说法之外的解释：上海一位 5 年经验的前端 4 月被裁、失业半年、降薪 15% 去杭州，他复盘的四条原因（技术没更新、线上 bug 留坏印象、沟通差、没有 owner 意识）里没有一条是 AI；北京一家金融债券国企的外包前端则展示了结构侧——正式岗只剩领导层、基层 90% 是外包、AI 普及后裁员停招、加班费与奖金取消，而技术栈还是十年前的 Vue2 与 Java+SpringBoot+MySQL。同期一篇拆解给出机制：AI 让「快乐路径」的代码几乎免费，价值全挤进异常路径、可观测性、安全与验收标准，连「外包比自建便宜」这个前提也在松动。社会侧的旁证是同一天头条出现四条「AI 与工作」议题（老干妈回应 AI 裁员传闻 5623164、比尔·盖茨谈 AI 对工作的冲击 1672444、AI税落到普通人头上了吗 373172、华尔街开始写 AI 末日之后预案 685748）——这个说法已经成了跨行业的解释框架。\nsource: 种子卡（人工植入，ADR-0007）\n---\n# 「AI 取代开发者」的叙事搞错了开发工作的本质\n\n## 当前判断\n\n软件开发的核心不是产出代码，而是**澄清需求与承担责任**。代码只是中间产物，真正难的是判断\"要做对的事\"、以及在出错时有人能负责。\n\nAI 能加速中间产物，但它不能替人承担\"这行代码发布了、出事了我负责\"这件事。因此\"取代\"这个词用错了对象——被压缩的是**编码环节**，不是开发工作。\n\n可观察的推论：如果 AI 真在取代开发者，那么**初级岗位的招聘门槛应该升高而不是降低**（因为简单任务被自动化了），而不是初级岗位消失。\n\n## 依据事实\n"}, {"path": ".newsagg/candidates/2026-10-26.json", "start": null, "end": null, "note": "候选池", "total": 8223, "text": "{\n  \"counts\": {\n    \"fetched\": 279,\n    \"kept\": 161,\n    \"dropped\": 302,\n    \"sources_ok\": 7,\n    \"sources_failed\": 0,\n    \"kept_new\": 38,\n    \"runs_today\": 3\n  }\n}"}], "writes": [{"path": ".newsagg/triage/2026-10-26-input.json", "start": null, "end": null, "note": "输入包（161 条候选 / 8 张卡）", "total": 6248, "text": "{\n  \"prepared_at\": \"2026-10-26T21:00:24.776383+08:00\",\n  \"instruction\": \"对每条候选条目：先聚成事件，再判断接得住哪张卡，给出三态决策（skip / continue / new）。判据见 SKILL.md 的硬规则。候选条目上的 trend 是**同源位次变化**（ADR-0056），trend_summary 说明该信号的覆盖率——它退化时按当前热度排序。\",\n  \"limits\": {\n    \"max_articles_per_day\": 1,\n    \"max_new_cards_per_day\": 1,\n    \"cooldown_days\": 3.0\n  },\n  \"trend_summary\": {\n    \"computed_at\": \"2026-10-26T21:00:24.776367+08:00\",\n    \"thresholds\": {\n      \"climb_at_or_below\": -0.1,\n      \"cool_at_or_above\": 0.1,\n      \"min_observations\": 2\n    },\n    \"snapshots\": 21,\n    \"latest_snapshot_by_source\": {\n      \"toutiao\": \"2026-10-26T18:00:01.805054+08:00\",\n      \"36kr\": \"2026-10-26T18:00:01.805054+08:00\",\n      \"juejin\": \"2026-10-26T18:00:01.805054+08:00\",\n      \"csdn\": \"2026-10-26T18:00:01.805054+08:00\",\n      \"ithome\": \"2026-10-26T18:00:01.805054+08:00\",\n      \"sspai\": \"2026-10-26T18:00:01.805054+08:00\",\n      \"github\": \"2026-10-26T18:00:01.805054+08:00\"\n    },\n    \"by_state\": {\n      \"climbing\": 24,\n      \"steady\": 34,\n      \"cooling\": 10,\n      \"unknown\": 38,\n      \"absent\": 55\n    },\n    \"by_position_source\": {\n      \"hot\": 73,\n      \"rank\": 83,\n      \"none\": 5\n    },\n    \"note\": \"68/161 条可算趋势：climbing 24、steady 34、cooling 10；absent 55、unknown 38 不参与排序。 位次口径（整池 161 条）：hot 73、none 5、rank 83；`hot` 口径是 rank 覆盖不足两条时的**近似**位次，其 delta 精度低于上游 rank。\",\n    \"usage\": \"trend 参与排序、不参与打分（ADR-0056）：卡匹配度相当时，climbing 的聚簇优先于已经很高但 steady/cooling 的。它不设硬门槛，也不单独构成「值得写」的理由——没有新事实仍然跳过。\"\n  }\n}"}], "files": [{"path": ".agents/skills/newsagg-triage/scripts/cardfm.py", "start": 1, "end": 17, "note": "为什么必须是共享模块：三份拷贝漂移的后果", "total": 63, "text": "\"\"\"观点卡 frontmatter 的唯一解析实现（ADR-0042）。\n\n**为什么是共享模块而不是三份拷贝。** 这个解析器原本在 `triage.py` / `build_brief.py` /\n`writeback.py` 里各有一份。三份拷贝漂移了：`triage.py` 把「空值」记成空字符串 `\"\"`，\n而另外两份记成空列表 `[]`。后果是同一张卡在不同阶段被解析成不同形状——\n`writeback.py` 写回 `covered_events` 时把空列表展开成多行列表项，此后\n`triage.py` 读到的是 `\"\"` 而不是列表，于是**分拣层永远看不到「已覆盖事件」**，\n而 `build_brief.py` 看得到。分拣输入包里那张卡的 `covered_events` 因此恒为空。\n\n这与 ADR-0030 关于浏览器锁的教训是同一条：**同一份契约的两份实现会漂移，\n且漂移是静默的**（两处都「能跑」，只有对照才看得出来）。所以这里只留一份实现。\n\n调用方通过同目录导入（`sys.path` 里加上本文件所在目录），见三个脚本顶部的\n`_load_cardfm()`。\n\"\"\"\n\nfrom __future__ import annotations"}, {"path": ".agents/skills/newsagg-triage/scripts/triage.py", "start": 38, "end": 68, "note": "卡正文全文进包", "total": 668, "text": "    （那时脚本目录不在 sys.path 上）。两种方式都要能工作。\n    \"\"\"\n    here = Path(__file__).resolve().parent\n    if str(here) not in sys.path:\n        sys.path.insert(0, str(here))\n    import cardfm\n    return cardfm\n\n\ndef parse_frontmatter(text: str) -> tuple[dict, str]:\n    \"\"\"委托给同目录 `cardfm`（ADR-0042：三份拷贝漂移过一次，只留一份实现）。\n\n    本函数曾把「空值」记成 `\"\"`，而 `writeback.py` 写回的 `covered_events`\n    是「空值 + 列表项」形态——列表项因此被静默丢弃，**分拣层永远看不到\n    「已覆盖事件」**，而 `build_brief.py` 看得到。详见 `cardfm.py` 的模块说明。\n    \"\"\"\n    fm, body, _ = _load_cardfm().parse_frontmatter(text)\n    return fm, body\n\n\ndef load_cards(cards_dir: Path) -> list[dict]:\n    \"\"\"读入全部 active 卡（ADR-0007：分拣全量读卡）。退役卡不参与。\"\"\"\n    cards = []\n    for path in sorted(cards_dir.glob(\"*.md\")):\n        text = path.read_text(encoding=\"utf-8\")\n        fm, body = parse_frontmatter(text)\n        if (fm.get(\"status\") or \"active\") != \"active\":\n            continue\n        cards.append(\n            {\n                \"file\": path.name,"}, {"path": ".agents/skills/newsagg-triage/scripts/triage.py", "start": 208, "end": 213, "note": "趋势阈值常量", "total": 668, "text": "TREND_CLIMB_DELTA = -0.10\nTREND_COOL_DELTA = 0.10\nTREND_MIN_OBSERVATIONS = 2\n\n\ndef _hot_int(value):"}, {"path": ".newsagg/triage/2026-10-26-input.json", "start": null, "end": null, "note": "这一轮趋势信号的真实覆盖率", "total": 6248, "text": "{\n  \"trend_summary\": {\n    \"computed_at\": \"2026-10-26T21:00:24.776367+08:00\",\n    \"thresholds\": {\n      \"climb_at_or_below\": -0.1,\n      \"cool_at_or_above\": 0.1,\n      \"min_observations\": 2\n    },\n    \"snapshots\": 21,\n    \"latest_snapshot_by_source\": {\n      \"toutiao\": \"2026-10-26T18:00:01.805054+08:00\",\n      \"36kr\": \"2026-10-26T18:00:01.805054+08:00\",\n      \"juejin\": \"2026-10-26T18:00:01.805054+08:00\",\n      \"csdn\": \"2026-10-26T18:00:01.805054+08:00\",\n      \"ithome\": \"2026-10-26T18:00:01.805054+08:00\",\n      \"sspai\": \"2026-10-26T18:00:01.805054+08:00\",\n      \"github\": \"20 x_articles_per_day\": 1,\n    \"max_new_cards_per_day\": 1,\n    \"cooldown_days\": 3.0\n  }\n}"}], "writes": [{"path": ".newsagg/triage/2026-10-26-decision.json", "start": null, "end": null, "note": "决策文件（本 action=continue）", "total": 57, "text": "{\n  \"date\": \"2026-10-26\"\n}"}], "files": [{"path": ".agents/skills/newsagg-triage/SKILL.md", "start": 29, "end": 56, "note": "三态决策表 + 八条硬规则", "total": 122, "text": "读 `.newsagg/triage/<日期>-input.json`，它包含 `candidates`（条目）、`cards`（全部 active 卡，含正文）、`cooldown_state`、`limits`。\n\n### 第一步：聚簇\n\n把描述**同一现实事件**的条目合成一个事件聚簇。聚簇是判定\"是否值得写\"的最小单位——单条报道不足以支撑判断。\n\n用标题判断即可，不要为聚簇去抓正文。输出每个聚簇的 `confidence` 与 `reason`（为何值得写）。\n\n### 第二步：匹配观点卡\n\n对每个聚簇，判断它接得住哪张卡。**读卡的正文**，不要只看标题——卡的精髓在判断正文里。\n\n### 第三步：三态决策\n\n| 决策 | 含义 | 硬性要求 |\n| --- | --- | --- |\n| `skip` | 卡已含此事件且**无新进展**；或纯重复报道（同一事实换家媒体） | 给出 `card_file` |\n| `continue` | 卡已存在，且这是**新进展** | 给出 `card_file` + `whats_new` |\n| `new` | 需要一张新卡 | 给出 `new_issue` + `reusable_because` + `card_file`（**你必须先写 `knowledge/cards/<file>.md`，再产出决策**） |\n| `abstain` | 无任何聚簇接得住卡，也没达到新建门槛 | 说明原因 |\n\n## 硬规则（不可违背）\n\n1. **\"新进展\"的判据是引入新事实或改变判断。** 纯重复报道（同一事件换家媒体、同一事实换个说法）**不算**进展，必须判 `skip`。这是全系统防重复发文的**唯一**判定点，而重复发文是平台明令禁止的行为——这条判错代价最贵。\n\n2. **冷却期优先于排序。** 卡在 `cooldown_state` 中 `in_cooldown: true` 时，该卡本轮**不参与竞争**，直接看下一名。若所有候选卡都在冷却，则 `abstain`。冷却期的目的是防重复，不是惩罚其他选题。\n\n3. **新建门槛是可复用性。** 一条判断要成为新卡，必须能**接住未来的新闻**，而不只是支撑当前这一个事件。永远只有单一事件支撑的判断不是观点卡，只是一篇一次性文章。给出 `reusable_because` 说明理由。"}, {"path": ".newsagg/triage/2026-10-26-decision.json", "start": null, "end": null, "note": "被置信度/冷却期挡下的簇", "total": 57, "text": "{\n  \"low_confidence_skipped\": [\n    {\n      \"event\": \"模型成本与开源簇：csdn《Kimi K3.1 Pro 评测：能力进了第一梯队，成本这笔账得另算》2940、头条《DeepSeek把自家“印钞机”开源了》187663、《DeepSeek到底怎么得罪了美国》1864056\",\n      \"why\": \"置信度 0.68。成本类素材本身很适合 `llm-price-war-signals-commoditization.md`（3.88 天、已出冷却），但今天只有一篇评测正文可读，两条关键头条正文抓不到（需 JS），只能引用标题；写成「模型又便宜了」会是 10-14 / 10-19 / 10-23 三次的第四次复现。若明天出现带具体单价的新模型价格公告，这张卡应优先。\"\n    },\n    {\n      \"event\": \"AI 编码工作流簇：github `gemini-cli` 108244、`claude-howto` 44746、csdn《【AI智能体】Codex 实现AI自动化运维实战操作详解》19927 climbing、掘金《一个需求，五个 Agent：用 TRAE 多 Agent 并行协作重构你的开发节奏》450\",\n      \"why\": \"置信度 0.55。全是正向做法介绍（怎么写得更好、怎么并行），没有一条能修正卡判断；而 `ai-coding-workflow-over-model-capability.md` 的「选工具的标准从模型能力转向工作流」在 10-20 的修订里已经写过。\"\n    },\n    {\n      \"event\": \"个人 AI 变现簇：掘金《一个人 + AI 做的小程序，今天，正式回本了》324、《掀桌子了！Kimi K3.1 Pro 这效果也太离谱了》81\",\n      \"why\": \"置信度 0.80，但**被冷却期挡下**：`personal-ai-monetization-is-paid-demand-not-technology.md` 昨天（10-25）刚写过，冷却 1.88 天。按硬规则 2，冷却期优先于排序，即使匹配度更高也只能等。这条《正式回本了》是「回本」而不是「赚到钱」，正好是那张卡「可交付 ≠ 可变现」的下一块料，建议 10-28 之后优先取用。\"\n    }\n  ]\n}"}, {"path": ".agents/skills/newsagg-triage/scripts/triage.py", "start": 473, "end": 489, "note": "校验器：结构 + 冷却 + 限额 + 卡存在", "total": 668, "text": "def validate_decision(decision: dict, cards: list[dict], cooldown: dict, limits: dict) -> dict:\n    \"\"\"校验模型的三态决策。返回 (ok, problems)。\n\n    这是确定性校验，不是判断替代：它只检查结构性合法性与已知的硬约束\n    （冷却期、每日限额、卡是否存在）。语义正确性仍需人工在简报中复核。\n    \"\"\"\n    problems = []\n    action = decision.get(\"action\")\n    if action not in (\"skip\", \"continue\", \"new\", \"abstain\"):\n        problems.append(f\"action 非法：{action!r}\")\n\n    card_files = {c[\"file\"] for c in cards}\n\n    if action in (\"skip\", \"continue\"):\n        cf = decision.get(\"card_file\")\n        if not cf:\n            problems.append(f\"{action} 必须给出 card_file\")"}, {"path": ".agents/skills/newsagg-collect/scripts/run_all.sh", "start": 545, "end": 566, "note": "第 1 段结尾打印的 handoff 指引", "total": 772, "text": "  triage_input\n\n  cat <<EOF\n\n────────────────────────────────────────────────────────\n分拣的**判断**由模型完成（ADR-0025：技能装判断）。请：\n\n  1. 读 ${CAND%.json} 对应的输入包\n     .newsagg/triage/${DATE}-input.json\n  2. 按 newsagg-triage 的硬规则产出决策，写入\n     ${DEC}\n     · action=new 时，你还必须**新建观点卡**\n       knowledge/cards/<file>.md（五节结构：当前判断 / 依据事实 /\n       修订史 / 可接住的事件类型 / 边界与反方），并把文件名填进\n       decision.card_file\n  3. 跑校验：\n     python3 .agents/skills/newsagg-triage/scripts/triage.py \\\\\n       --validate ${DEC}\n\n校验通过后，继续执行：\n  bash ${SELF} --after-triage $([[ \"$MODE\" == \"publish\" ]] && echo --publish)\n────────────────────────────────────────────────────────"}]}, {"id": "n08-brief-pack", "step": "④", "title": "生成写作选题包", "layer": "write", "when": "第 2 段开头", "actor": "脚本", "one_liner": "把决策 + 承接卡的认知 + 风格配置拼成一份任务书，交给写作引擎。", "does": ["从卡里抽出「当前判断 / 依据事实 / 已覆盖事件 / 边界与反方」四块，明确要求引用或推进、不得另起。", "把 style.yaml 的账号、目标读者、语气、人称、人格与黑名单一并注入。", "--out 显式写到当日文件名：编排器三段必须共享同一日期，跨零点续跑时默认「今天」会指向不存在的文件。"], "why": ["ADR-0026：写作必须引用或推进已有卡，不得另起炉灶——这是沉淀闭环的关键一步。", "ADR-0039：build_brief 默认按今天命名，会在重放历史决策时静默指向错误文件。"], "reads": [{"path": ".newsagg/triage/2026-10-26-decision.json", "start": null, "end": null, "note": "决策（含 whats_new / money_point）", "total": 57, "text": "{\n  \"decision\": {\n    \"action\": \"continue\",\n    \"card_file\": \"ai-replacing-developers-misreads-the-work.md\",\n    \"confidence\": 0.87,\n    \"whats_new\": \"这张卡从建卡起只有一类证据：行业统计与公司公告（Meta 叫停第二轮裁员、微软承认成效没来、647 条 JD 里 63% 提 AI、一家教育公司把正岗换成外包）。今天第一次拿到的是**个体层的可核对账本**，而且是两份、方向相反的一份：\\n\\n第一个是上海的前端，5 年多经验，今年 4 月被裁、失业 6 个月，8 月底旺季开始投递、7-8 个面试邀约、最后拿到 2 个 offer，去杭州，**年薪降 15%**。他自己复盘的四条裁员原因里，**没有一条是 AI**：技术没跟进（React 19 发布很久没关注、Vite 普及很久没用）、出过几次线上 bug 给领导留下「不靠谱」印象、和 PM 沟通有障碍、没有 owner 意识。\\n\\n第二个是北京一家金融债券国企的外包前端，正式岗只剩领导层，基层需求/开发/测试 **90% 是外包**；去年入职时人还多，AI 普及以后裁员很多、也不再招新人；今年加班费取消、奖金取消、还降薪。技术栈仍是十年前发布的 Vue2 和 Java+SpringBoot+MySQL，今年才开始用 roo-code + deepseek v4，没推全栈。整理者的原话是「铁打的营盘流水的兵，是个程序员来了就能做」——这句话解释了两件事在时间上重合却不是因果：真正的机制是把人换成可替换的兵，AI 只是那段时间里发生的事。\\n\\n第三份材料补上了卡原本缺的一环——**机制**。AI 把「快乐路径」（能跑的功能）的成本压到接近免费，于是价值全部挤进「看不见的层」：异常路径、可观测性、安全防线、验收标准。原文那句判据可以直接检验：「别问 AI 会不会取代前端，要问你的工作里有多少比例是在生产快乐路径，多少比例是在守护异常路径」。同一篇还引出 V2EX 今年一个帖子：某公司内部评审认为 6 万行代码足以实现所有功能，外包交付时交了 18 万行、大面积 AI 生成，高赞评论是「如果是大模型生成的代码，又何必找外包第三方」——AI 不止压了编码环节的价格，也把「外包比自建便宜」这个前提拆了。\\n\\n所以推进是这样：卡原来断言「被压缩的是编码环节，不是开发工作」，今天把它推进成可检验的机制——被重估的不是岗位，是岗位里「生产快乐路径」那部分工作的定价；裁员发生在定价被重估之后，而人在复盘中会把原因归给当时最近发生的事（AI），归错了，就会学错东西。\",\n    \"event\": {\n      \"summary\": \"两位程序员的一手账本，加上一份机制拆解，凑出了「AI 裁员」这个说法之外的解释：上海一位 5 年经验的前端 4 月被裁、失业半年、降薪 15% 去杭州，他复盘的四条原因（技术没更新、线上 bug 留坏印象、沟通差、没有 owner 意识）里没有一条是 AI；北京一家金融债券国企的外包前端则展示了结构侧——正式岗只剩领导层、基层 90% 是外包、AI 普及后裁员停招、加班费与奖金取消，而技术栈还是十年前的 Vue2 与 Java+SpringBoot+MySQL。同期一篇拆解给出机制：AI 让「快乐路径」的代码几乎免费，价值全挤进异常路径、可观测性、安全与验收标准，连「外包比自建便宜」这个前提也在松动。社会侧的旁证是同一天头条出现四条「AI 与工作」议题（老干妈回应 AI 裁员传闻 5623164、比尔·盖茨谈 AI 对工作的冲击 1672444、AI税落到普通人头上了吗 373172、华尔街开始写 AI 末日之后预案 685748）——这个说法已经成了跨行业的解释框架。\",\n      \"members\": [\n        \"程序员 1v1 访谈系列第七期：失业半年所想到的\",\n        \"程序员 1v1 访谈系列第六期：国企也降薪裁员\",\n        \"外包和大厂的前端代码，差在凌晨三点\",\n        \"老干妈回应AI裁员传闻\",\n        \"比尔·盖茨谈AI对人类工作的冲击\",\n        \"“AI税”落到普通人头上了吗\",\n        \"华尔街开始写“AI末日之后”预案\"\n      ],\n      \"hot\": 5623164,\n      \"sources\": [\n        \"toutiao\",\n        \"juejin\"\n      ],\n      \"key_evidence\": [\n        \"掘金《程序员 1v1 访谈系列第七期：失业半年所想到的》（双越AI_club，2026-10-26，热度 153）：上海、男、本科、前端、5+ 年、互联网-本地生活、公司规模中，今年 4 月被裁员，失业 6 个月；8 月底进入旺季收到 7-8 个面试邀约，最终 2 个 offer，去杭州，**年薪降低 15%**，正在走背调\",\n        \"同一篇：他复盘的四条裁员原因全部与 AI 无关——① 没有持续更新个人技术，长期在舒适区（React 19 发布很久没关注、Vite 普及很久没用）② 工作上不够认真，出过几次线上 bug，给领导留下「不靠谱」印象 ③ 沟通能力不好，和 PM 沟通有障碍、PM 去领导那里告状 ④ 没有 owner 意识，做过的事 PM 再找就不愿意继续做\",\n        \"同一篇的复盘教训：「准备算法题原理题花费的时间太多了，因为很多时候根本不问这些内容，尤其中小公司」「应该尽早刷面试题，尽早投递简历，争取尽快找到一个平薪的工作，而不是求大厂求涨薪」；另外「不仅仅投递一个城市，全国投递，上海机会很少，反而杭州深圳机会更多」；他花 2 个月复习算法与原理，6-7 月面试淡季几乎没有面试邀请\",\n        \"同一篇整理者的判断（对求职者说的冷水）：「在公司晋升，个人技能是次要的因素。主要因素有两个：1. 公司和团队的晋升名额；2. 你个人对团队的贡献和 KPI 打分；3. 技术能力是否全面」；以及 remote 路径已基本关闭——「remote 大约是 2022 开始的……这两年更不提了，因为老外也开始裁员失业了，也是因为 AI 编程提效」\",\n        \"掘金《程序员 1v1 访谈系列第六期：国企也降薪裁员》（双越AI_club，2026-10-23，热度 315）：北京、本科、前端、4 年、金融债券国企、在职（外包）；「公司现在正式岗位都是领导层，基层的需求、开发、测试绝大部分 90% 都是外包」「去年他入职的时候人还比较多，后来 AI 普及以后裁员很多，现在也不再招聘新人了」\",\n        \"同一篇：「今年加班费取消、奖金取消、加上降薪裁员，大家工作积极性不高」「项目还是比较稳定的，需求也有，就是大家都不着急了」；技术栈仍是 Vue2（「Vue2 是十年之前发布的」）+ Java + SpringBoot + MySQL；今年开始用 roo-code + deepseek v4，但没推全栈，他仍是纯前端。整理者的原话：「不管他效率如何，也别管他是不是新技术，也别管他多年屎山，他就一个好处：铁打的营盘流水的兵，是个程序员来了就能做」\",\n        \"掘金《外包和大厂的前端代码，差在凌晨三点》（怕浪猫，2026-10-23，热度 171，趋势 climbing）：核心判断是「AI 让快乐路径的代码几乎免费了，于是看得见的部分趋同，看不见的部分差距反而更大」；五层差距为全链路防御、系统维度、异常路径、可观测性、安全意识\",\n        \"同一篇的判据与自检：「别问『AI 会不会取代前端』。要问：你的工作里，有多少比例是在生产快乐路径，多少比例是在守护异常路径？后者才是你的护城河」；六问里包括「每个网络请求，HTTP 状态码校验了吗」「接口数据过运行时校验了吗，还是直接信了 TypeScript 的类型」「loading / empty / error 三种边界状态都有对应 UI 吗」「异步请求有取消机制吗」「catch 块里是 console.error，还是带着上下文上报」「Token 在 localStorage 里吗」\",\n        \"同一篇引 V2EX 今年帖子：「某公司内部评审认为 6 万行代码足以实现所有功能，外包交付时交了 18 万行——大面积 AI 生成的产物」，高赞评论「如果是大模型生成的代码，又何必找外包第三方呢？甲方自己调用大模型不就好了」，另有评论「改不动的代码便宜，改的动的代码贵」；作者的结论是「外包剩下的生存空间，只剩两样：一是 AI 也搞不定的复杂业务上下文，二是出事之后有人负责」\",\n        \"头条同日四条「AI 与工作」议题（正文抓不到，只有标题与热度，据实标注）：「老干妈回应AI裁员传闻」5623164、「比尔·盖茨谈AI对人类工作的冲击」1672444、「华尔街开始写“AI末日之后”预案」685748、「“AI税”落到普通人头上了吗」373172——一家辣酱厂需要公开回应 AI 裁员传闻，说明这个说法已经脱离技术事实、变成跨行业的社会解释框架\"\n      ]\n    },\n    \"ranking_note\": \"两张卡在冷却期直接退出竞争：`personal-ai-monetization-is-paid-demand-not-technology.md` 1.88 天（昨天刚写）、`ai-productivity-claims-lack-reproducible-benchmarks.md` 2.88 天（10-24 刚写）。值得注意的是今天池子里正好有一条直接命中前者——掘金《一个人 + AI 做的小程序，今天，正式回本了》324——但冷却期优先于排序（硬规则 2），它只能作为那张卡的下一次素材。\\n三簇比较：\\n① **开发者职业处境簇**（掘金两条 1v1 第六期 315 / 第七期 153 + 《外包和大厂的前端代码，差在凌晨三点》171 climbing + 头条四条 AI 与工作议题，最高 5623164）→ 接 `ai-replacing-developers-misreads-the-work.md`（5.88 天，已出冷却）\\n② **模型成本与开源簇**（csdn《Kimi K3.1 Pro 评测：能力进了第一梯队，成本这笔账得另算》2940、头条《DeepSeek把自家“印钞机”开源了》187663、《DeepSeek到底怎么得罪了美国》1864056）→ 接 `llm-price-war-signals-commoditization.md`（3.88 天）或 `open-source-llm-bottleneck-is-ops-not-capability.md`（9.88 天）\\n③ **AI 编码工作流簇**（github `gemini-cli` 108244、`claude-howto` 44746、csdn《Codex 实现 AI 自动化运维》19927 climbing、掘金《一个需求，五个 Agent：TRAE 多 Agent 并行》450）→ 接 `ai-coding-workflow-over-model-capability.md`（6.88 天）\\n选①的理由是证据结构：今天这一簇**第一次同时具备三层**——个体账本（带可核对数字：失业 6 个月、降薪 15%、四条原因）、结构机制（90% 外包、正式岗只剩领导层、Vue2）、以及一份把机制讲透的拆解（快乐路径 vs 异常路径）。②只有一篇评测正文，两条关键头条抓不到正文；③的素材是「怎么用 AI 写得更好」，没有反向证据，且 10-20 的修订已覆盖。\",\n    \"why_this_over_alternative\": \"②模型成本簇（置信度 0.68，降为备选）：csdn 那篇 Kimi K3.1 Pro 评测确实有 者、接单者\"\n\n# 内容方向（与 platforms/niche.txt 的赛道词一致，ADR-0050 改）\n# 排序即倾向：越靠前越优先。技术类议题保留但排在钱与职业之后——\n# 它们是**证据来源**，不是**选题落点**。\ntopics:\n  - 个人 AI 变现与副业真实账本"}], "writes": [{"path": ".newsagg/briefs/2026-10-26.md", "start": 1, "end": 26, "note": "选题包实际产物", "total": 123, "text": "# 写作任务书（由 NewsAgg 自动生成）\n\n生成时间：2026-10-26T21:02:06.817897+08:00\n\n## 选题\n**议题**：「AI 取代开发者」的叙事搞错了开发工作的本质\n\n**本次事件**：两位程序员的一手账本，加上一份机制拆解，凑出了「AI 裁员」这个说法之外的解释：上海一位 5 年经验的前端 4 月被裁、失业半年、降薪 15% 去杭州，他复盘的四条原因（技术没更新、线上 bug 留坏印象、沟通差、没有 owner 意识）里没有一条是 AI；北京一家金融债券国企的外包前端则展示了结构侧——正式岗只剩领导层、基层 90% 是外包、AI 普及后裁员停招、加班费与奖金取消，而技术栈还是十年前的 Vue2 与 Java+SpringBoot+MySQL。同期一篇拆解给出机制：AI 让「快乐路径」的代码几乎免费，价值全挤进异常路径、可观测性、安全与验收标准，连「外包比自建便宜」这个前提也在松动。社会侧的旁证是同一天头条出现四条「AI 与工作」议题（老干妈回应 AI 裁员传闻 5623164、比尔·盖茨谈 AI 对工作的冲击 1672444、AI税落到普通人头上了吗 373172、华尔街开始写 AI 末日之后预案 685748）——这个说法已经成了跨行业的解释框架。\n\n**推进方向**：这张卡从建卡起只有一类证据：行业统计与公司公告（Meta 叫停第二轮裁员、微软承认成效没来、647 条 JD 里 63% 提 AI、一家教育公司把正岗换成外包）。今天第一次拿到的是**个体层的可核对账本**，而且是两份、方向相反的一份：\n\n第一个是上海的前端，5 年多经验，今年 4 月被裁、失业 6 个月，8 月底旺季开始投递、7-8 个面试邀约、最后拿到 2 个 offer，去杭州，**年薪降 15%**。他自己复盘的四条裁员原因里，**没有一条是 AI**：技术没跟进（React 19 发布很久没关注、Vite 普及很久没用）、出过几次线上 bug 给领导留下「不靠谱」印象、和 PM 沟通有障碍、没有 owner 意识。\n\n第二个是北京一家金融债券国企的外包前端，正式岗只剩领导层，基层需求/开发/测试 **90% 是外包**；去年入职时人还多，AI 普及以后裁员很多、也不再招新人；今年加班费取消、奖金取消、还降薪。技术栈仍是十年前发布的 Vue2 和 Java+SpringBoot+MySQL，今年才开始用 roo-code + deepseek v4，没推全栈。整理者的原话是「铁打的营盘流水的兵，是个程序员来了就能做」——这句话解释了两件事在时间上重合却不是因果：真正的机制是把人换成可替换的兵，AI 只是那段时间里发生的事。\n\n第三份材料补上了卡原本缺的一环——**机制**。AI 把「快乐路径」（能跑的功能）的成本压到接近免费，于是价值全部挤进「看不见的层」：异常路径、可观测性、安全防线、验收标准。原文那句判据可以直接检验：「别问 AI 会不会取代前端，要问你的工作里有多少比例是在生产快乐路径，多少比例是在守护异常路径」。同一篇还引出 V2EX 今年一个帖子：某公司内部评审认为 6 万行代码足以实现所有功能，外包交付时交了 18 万行、大面积 AI 生成，高赞评论是「如果是大模型生成的代码，又何必找外包第三方」——AI 不止压了编码环节的价格，也把「外包比自建便宜」这个前提拆了。\n\n所以推进是这样：卡原来断言「被压缩的是编码环节，不是开发工作」，今天把它推进成可检验的机制——被重估的不是岗位，是岗位里「生产快乐路径」那部分工作的定价；裁员发生在定价被重估之后，而人在复盘中会把原因归给当时最近发生的事（AI），归错了，就会学错东西。\n\n## 已有认知（必须引用或推进，不得另起）\n**当前判断**：\n软件开发的核心不是产出代码，而是**澄清需求与承担责任**。代码只是中间产物，真正难的是判断\"要做对的事\"、以及在出错时有人能负责。\n\nAI 能加速中间产物，但它不能替人承担\"这行代码发布了、出事了我负责\"这件事。因此\"取代\"这个词用错了对象——被压缩的是**编码环节**，不是开发工作。\n\n可观察的推论：如果 AI 真在取代开发者，那么**初级岗位的招聘门槛应该升高而不是降低**（因为简单任务被自动化了），而不是初级岗位消失。"}], "files": [{"path": ".agents/skills/newsagg-triage/scripts/build_brief.py", "start": 76, "end": 92, "note": "素材锚点只放输入里真实存在的内容，不编造", "total": 327, "text": "        return \"\"\n    rest = body[m.end():]\n    nxt = re.search(r\"^##\\s+\", rest, re.M)\n    return (rest[:nxt.start()] if nxt else rest).strip()\n\n\ndef build_brief(decision: dict, card: dict | None, style: dict, target_words: str) -> str:\n    \"\"\"拼装 brief。素材锚点只放**输入里真实存在**的内容，不编造。\"\"\"\n    ev = decision.get(\"event\") or {}\n    members = ev.get(\"members\") or []\n    evidence = ev.get(\"key_evidence\") or []\n\n    lines: list[str] = []\n    lines.append(\"# 写作任务书（由 NewsAgg 自动生成）\")\n    lines.append(\"\")\n    lines.append(f\"生成时间：{datetime.now(CST).isoformat()}\")\n    lines.append(\"\")"}, {"path": ".agents/skills/newsagg-triage/scripts/build_brief.py", "start": 110, "end": 125, "note": "卡的四块内容怎么进任务书", "total": 327, "text": "    # ── 已有认知（ADR-0026：必须引用或推进，不得另起）──\n    if card:\n        lines.append(\"## 已有认知（必须引用或推进，不得另起）\")\n        cur = extract_section(card[\"body\"], \"当前判断\")\n        if cur:\n            lines.append(\"**当前判断**：\")\n            lines.append(cur)\n            lines.append(\"\")\n        facts = extract_section(card[\"body\"], \"依据事实\")\n        if facts:\n            lines.append(\"**已有依据**：\")\n            lines.append(facts)\n            lines.append(\"\")\n        if card[\"covered_events\"]:\n            lines.append(\"**已覆盖事件**（不要重复叙述）：\")\n            for e in card[\"covered_events\"]:"}, {"path": ".agents/skills/newsagg-triage/scripts/build_brief.py", "start": 287, "end": 301, "note": "风格注入", "total": 327, "text": "    # 载入风格（yaml 极简解析，只取需要的标量）\n    style: dict = {}\n    spath = root / \".wewrite\" / \"style.yaml\"\n    if spath.exists():\n        txt = spath.read_text(encoding=\"utf-8\")\n        for k in (\"name\", \"industry\", \"target_audience\", \"tone\", \" ：上海一位 5 年经验的前端 4 月被裁、失业半年、降薪 15% 去杭州，他复盘的四条原因（技术没更新、线上 bug 留坏印象、沟通差、没有 owner 意识）里没有一条是 AI；北京一家金融债券国企的外包前端则展示了结构侧——正式岗只剩领导层、基层 90% 是外包、AI 普及后裁员停招、加班费与奖金取消，而技术栈还是十年前的 Vue2 与 Java+SpringBoot+MySQL。同期一篇拆解给出机制：AI 让「快乐路径」的代码几乎免费，价值全挤进异常路径、可观测性、安全与验收标准，连「外包比自建便宜」这个前提也在松动。社会侧的旁证是同一天头条出现四条「AI 与工作」议题（老干妈回应 AI 裁员传闻 5623164、比尔·盖茨谈 AI 对工作的冲击 1672444、AI税落到普通人头上了吗 373172、华尔街开始写 AI 末日之后预案 685748）——这个说法已经成了跨行业的解释框架。\n\n**推进方向**：这张卡从建卡起只有一类证据：行业统计与公司公告（Meta 叫停第二轮裁员、微软承认成效没来、647 条 JD 里 63% 提 AI、一家教育公司把正岗换成外包）。今天第一次拿到的是**个体层的可核对账本**，而且是两份、方向相反的一份：\n\n第一个是上海的前端，5 年多经验，今年 4 月被裁、失业 6 个月，8 月底旺季开始投递、7-8 个面试邀约、最后拿到 2 个 offer，去杭州，**年薪降 15%**。他自己复盘的四条裁员原因里，**没有一条是 AI**：技术没跟进（React 19 发布很久没关注、Vite 普及很久没用）、出过几次线上 bug 给领导留下「不靠谱」印象、和 PM 沟通有障碍、没有 owner 意识。\n\n第二个是北京一家金融债券国企的外包前端，正式岗只剩领导层，基层需求/开发/测试 **90% 是外包**；去年入职时人还多，AI 普及以后裁员很多、也不再招新人；今年加班费取消、奖金取消、还降薪。技术栈仍是十年前发布的 Vue2 和 Java+SpringBoot+MySQL，今年才开始用 roo-code + deepseek v4，没推全栈。整理者的原话是「铁打的营盘流水的兵，是个程序员来了就能做」——这句话解释了两件事在时间上重合却不是因果：真正的机制是把人换成可替换的兵，AI 只是那段时间里发生的事。\n\n第三份材料补上了卡原本缺的一环——**机制**。AI 把「快乐路径」（能跑的功能）的成本压到接近免费，于是价值全部挤进「看不见的层」：异常路径、可观测性、安全防线、验收标准。原文那句判据可以直接检验：「别问 AI 会不会取代前端，要问你的工作里有多少比例是在生产快乐路径，多少比例是在守护异常路径」。同一篇还引出 V2EX 今年一个帖子：某公司内部评审认为 6 万行代码足以实现所有功能，外包交付时交了 18 万行、大面积 AI 生成，高赞评论是「如果是大模型生成的代码，又何必找外包第三方」——AI 不止压了编码环节的价格，也把「外包比自建便宜」这个前提拆了。\n\n所以推进是这样：卡原来断言「被压缩的是编码环节，不是开发工作」，今天把它推进成可检验的机制——被重估的不是岗位，是岗位里「生产快乐路径」那部分工作的定价；裁员发生在定价被重估之后，而人在复盘中会把原因归给当时最近发生的事（AI），归错了，就会学错东西。\n\n## 已有认知（必须引用或推进，不得另起）\n**当前判断**：\n软件开发的核心不是产出代码，而是**澄清需求与承担责任**。代码只是中间产物，真正难的是判断\"要做对的事\"、以及在出错时有人能负责。\n\nAI 能加速中间产物，但它不能替人承担\"这行代码发布了、出事了我负责\"这件事。因此\"取代\"这个词用错了对象——被压缩的是**编码环节**，不是开发工作。\n\n可观察的推论：如果 AI 真在取代开发者，那么**初级岗位的招聘门槛应该升高而不是降低**（因为简单任务被自动化了），而不是初级岗位消失。"}], "writes": [{"path": "outputs/2026-10-26-layoff-reasons-without-ai.md", "start": 1, "end": 18, "note": "成稿（首行一级标题即发布标题）", "total": 65, "text": "# 被裁半年降薪15%：四条原因里没有AI\n\n今年 4 月被裁的那个人，失业半年，最后去杭州，年薪降了 15%。他复盘了被裁的四条原因：技术没跟进、出过线上 bug 给领导留下「不靠谱」的印象、跟产品经理沟通有障碍、没有 owner 意识。\n\n四条里没有一条是 AI。\n\n但我不认为「所以 AI 跟他无关」。**AI 改的不是他为什么被裁，是他能拿到的价格。** 这两件事被同一个词盖住了，而这个词现在满天飞——同一天头条上「老干妈回应AI裁员传闻」的热度是 562 万。\n\n## 四条原因里没有 AI，但你的报价里全是\n\n上海这位，5 年多经验，前端，互联网本地生活。4 月被裁，6 到 7 月是淡季，几乎没有面试邀请；8 月底旺季才投，七八个邀约，最后两个 offer，降薪 15%。\n\n北京那位在金融债券国企做外包前端，是同一个访谈系列的第六期。他说的公司结构是：「正式岗位都是领导层，基层的需求、开发、测试绝大部分 90% 都是外包。」入职时人还多，AI 普及以后裁员很多，也不再招新人；今年加班费取消、奖金取消，还降了薪。\n\n把这两份账本放在一起，裁员的机制并不在 AI 那条线上。整理访谈的作者给了一句很准的话：「铁打的营盘流水的兵，是个程序员来了就能做。」那家公司的前端还停在十年前发布的 Vue2，服务端是 Java + SpringBoot + MySQL。这套东西的好处不是效率，是**谁来了都能接**。\n\n那 AI 改了什么？改的是价格。\n"}, {"path": ".newsagg/covers/2026-10-26.json", "start": null, "end": null, "note": "封面论据（layout=number）", "total": 7, "text": "{\n  \"layout\": \"number\",\n  \"kicker\": \"AI 裁员喊了两年\",\n  \"hero\": \"4\",\n  \"hero_unit\": \"条原因，一条都不是 AI\",\n  \"payoff\": \"但报价里全是 AI\"\n}"}], "files": [{"path": ".agents/skills/newsagg-collect/scripts/run_all.sh", "start": 591, "end": 609, "note": "退出码 3 的降级分支", "total": 772, "text": "\n  log \"④ 写作\"\n  # llm-write 未配置 key 时退出码 3 = 设计上的「降级为 agent 自写」\n  set +e\n  wewrite llm-write --brief \".newsagg/briefs/${DATE}.md\" \\\n    --output \"outputs/${DATE}-draft.md\" 2>&1 | tail -3\n  RC=${PIPESTATUS[0]}\n  set -e\n  if [[ $RC -eq 3 ]]; then\n    echo \"→ 写作模型未配置（退出码 3），按设计降级：由 agent 自写\"\n  elif [[ $RC -ne 0 ]]; then\n    fail_soft \"write\" \"写作失败（退出码 $RC）\" \"\" 1\n  else\n    echo \"→ 初稿已生成 outputs/${DATE}-draft.md（审稿后另存为 outputs/<slug>.md）\"\n  fi\n\n  cat <<EOF\n\n────────────────────────────────────────────────────────"}, {"path": ".agents/skills/newsagg-collect/scripts/run_all.sh", "start": 600, "end": 627, "note": "第 2 段结尾给模型的指引（含封面论据格式）", "total": 772, "text": "    echo \"→ 写作模型未配置（退出码 3），按设计降级：由 agent 自写\"\n  elif [[ $RC -ne 0 ]]; then\n    fail_soft \"write\" \"写作失败（退出码 $RC）\" \"\" 1\n  else\n    echo \"→ 初稿已生成 outputs/${DATE}-draft.md（审稿后另存为 outputs/<slug>.md）\"\n  fi\n\n  cat <<EOF\n\n────────────────────────────────────────────────────────\n请让模型读 .newsagg/briefs/${DATE}.md，把成稿写成\n  outputs/<slug>.md        （slug 形如 ${DATE}-<短标题>，首行一级标题 2~30 字）\n\n封面：信息流里标题就印在封面  \"ok\": true,\n  \"title\": \"被裁半年降薪15%：四条原因里没有AI\",\n  \"out\": \"/Users/cyx/repo/NewsAgg/outputs/covers/2026-10-26-layoff-reasons-without-ai.png\",\n  \"size\": \"…(2 项)\",\n  \"layout\": \"number\",\n  \"kicker\": \"AI 裁员喊了两年\",\n  \"title_chars\": 19,\n  \"bytes\": 41517,\n  \"thumb_scale\": 0.267,\n  \"drawn\": \"…(4 项)\",\n  \"hero_ratio\": 0.296,\n  \"restates_title\": false,\n  \"safe_inset\": 93,\n  \"text_width\": 858.0,\n  \"photo\": \"\",\n  \"photo_enabled\": false,\n  \"photo_path\": \"\",\n  \"panel_height\": 675,\n  \"problems\": \"…(0 项)\",\n  \"warnings\": \"…(0 项)\"\n}"}], "files": [{"path": ".agents/skills/newsagg-publish/scripts/make_cover.py", "start": 80, "end": 88, "note": "安全区由 3:2 裁切推导", "total": 1177, "text": "# 后果：左右各丢 (1200 - 675*1.5)/2 = 93.75px → int() 取整为 93px，约 7.8%。5 张历史封面逐像素统计\n# 全部有内容落在安全区外，最严重那张把「做应用的人省钱」的「钱」字切掉一半。\n#\n# 所以排版必须**先保证内容在 3:2 安全区内**，再谈字号。\nFEED_CARD_ASPECT = 1.5\n# 3:2 安全区左右各被切掉多少（1200x675 时 = 93px；理论值 93.75，向下取整）\nSAFE_INSET = max(0, int((DEFAULT_SIZE[0] - DEFAULT_SIZE[1] * FEED_CARD_ASPECT) / 2))\n\nINK = (8, 10, 16)"}, {"path": ".agents/skills/newsagg-publish/scripts/make_cover.py", "start": 169, "end": 181, "note": "确定性选样式且避开前一天", "total": 1177, "text": "def style_for_date(day: str) -> str:\n    \"\"\"按日期确定性地选一种样式。无状态：同一天重跑必一致。\n\n    为什么不用 random：无人值守的定时任务可能一天跑多次，random 会让\n    「今天用哪张样式」变成不可复现的——重跑一次封面就换了长相。日期哈希\n    不需要状态文件（状态文件会坏、会丢、会被 git 搞脏），天然幂等。\n    相邻两天撞上同一种时 +1 错开，保证「每天换一种」的直觉成立。\n    \"\"\"\n    idx = zlib.crc32(day.encode(\"utf-8\")) % len(STYLE_ORDER)\n    if STYLE_ORDER[idx] == style_for_date_prev(day):\n        idx = (idx + 1) % len(STYLE_ORDER)\n    return STYLE_ORDER[idx]\n"}, {"path": ".agents/skills/newsagg-publish/scripts/make_cover.py", "start": 589, "end": 603, "note": "number 布局：hero 数字 + payoff 论点", "total": 1177, "text": "def layout_number(\n    size, kicker: str, hero: str, unit: str, payoff: str, note: str,\n    drawn: list | None = None, top_pad: int = 0, style: dict | None = None,\n) -> Image.Image:\n    \"\"\"数字英雄：一个数字占满画面。缩略图下最抗缩放。\n\n    分四个**垂直带**，先算下面的带再给上面剩下的空间：\n    kicker / hero / payoff / note。所有字号都由测量得出，且 hero 同时受\n    宽度和可用高度约束——只按宽度放大会让数字撞进论点区。\n\n    样式（材质）经 `style` 注入：底色、墨色、强调色、显示字体。本函数对\n    「今天用哪种材质」一无所知，也不该知道——布局与样式正交。\n    \"\"\"\n    st = style or STYLES[LEGACY_STYLE]\n    ffn = lambda s: find_style_font(st, s)  # noqa: E731"}, {"path": ".agents/skills/newsagg-publish/scripts/fetch_photo.py", "start": 1, "end": 26, "note": "照片层：许可证必须记账", "total": 283, "text": "#!/usr/bin/env python3\n\"\"\"从 Wikimedia Commons 取一张**许可证明确、可无人值守使用**的照片，作封面背景。\n\n设计依据 ADR-0048（封面照片的来源与许可证边界）、ADR-0013（不使用新闻原图）、\nADR-0044（封面承载一个视觉论据）。\n\n三条硬约束，缺一条就不取图：\n\n1. **只取不需要署名的许可证**（CC0 / Public domain）。CC-BY 系列要求署名，\n   而无人值守的发布链没有「记得署名」这个环节——忘一次就是违约一次。\n   把「必须署名」的图排除在候选之外，比事后提醒可靠。\n2. **相关性可判定**。Commons 的搜索结果里混着地图、旗帜、logo、人物肖像、\n   新闻截图。实测搜 `DeepSeek` 返回的第一页里有《DeepSeek – VR China und Taiwan》\n   （一张中台地图）——这类图发到头条是政治风险，不是配图。所以要求查询词\n   至少命中一个，且标题/描述/分类不含风险词。\n3. **失败绝不阻断发布**。取不到合格照片就返回 ok=false，编排器回退到纯模板封面。\n\n许可证与来源**全部记账**（`.newsagg/photos/ledger.jsonl`），因为「我们当时以为\n它是 CC0」不是抗辩理由，账本才是。\n\n⚠️ User-Agent 必须带联系方式。实测用 `NewsAgg/1.0 (personal news digest)` 连续\n请求会收到 **HTTP 429 Too Many Requests**，换成带 URL 的 UA 后恢复 200。\nCommons 对匿名批量的限流很敏感，而限流失败在这里会退化成「没有照片」——不致命，\n但会让这个功能时灵时不灵。\n\"\"\"\n"}, {"path": ".agents/skills/newsagg-collect/scripts/run_all.sh", "start": 636, "end": 646, "note": "缺 spec 时的回退告警", "total": 772, "text": "  COVER_SPEC_ARG=(--spec \"$COVER_SPEC\")\nelse\n  # 没有 spec 不等于失败（封面仍会生成），但它是「写作阶段漏了一步」的信号。\n  # 2026-10-20 就是静默走了这条路，产出一张复述标题的封面而无人察觉（ADR-0044 发现五）。\n  echo \"注意：未找到封面论据 ${COVER_SPEC}，回退到标题推导（封面会复述标题的部分内容）\" >&2\nfi\n\n# ── 照片层（ADR-0048）──────────────────────────────────────────────\n#\n# 只有 spec 里写了 `photo_query` 才取图。这不是省事，是**责任划分**：\n# 只有写作阶段知道这篇文章讲的是什么，也只有它能判断「机房照片配一篇"}]}, {"id": "n11-publish", "step": "⑤", "title": "发布（六道门 + 反查）", "layer": "publish", "when": "第 3 段", "actor": "脚本 → vendor 的 toutiao-ops（node）", "one_liner": "过门后才发；发出后再读回平台确认，把结果与承接卡写进账本。", "does": ["门 0 熔断：.newsagg/breaker.json 存在即拒绝发布，人工修复后删文件解除。", "门 0.5 每日上限：今天已成功发布 ≥1 篇即拒绝（dry-run 不消耗额度）。需补发/重发时须显式 --allow-daily-override 并写理由。", "门 1 输入：成稿存在、有一级标题、标题 2~30 字、封面文件存在（头条必填）。", "门 2 登录预检：只读，最多 3 次；判定为 login_lost 即熔断。", "门 3 内存预检：可用内存低于下限即熔断（ADR-0023）。", "发布命令显式带 --no-weitoutiao（平台默认是勾选的，同发会造成内容重复）。", "门 5 反查：按平台实际收到的标题去作品列表里查；咽字时以平台标题为准。", "全程 FileLock 串行锁；锁带 pid，用 kill(pid,0) 判断持有者是否存活，崩惯不会留下永久锁。"], "why": ["ADR-0014：dry-run 默认开启；dry-run 只对人民日报 NanA 留真实草稿，也要 Methodist草稿不算发布。", "ADR-0024：复用 vendor 的 toutiao-ops，本脚本只加安全门与验证。", "ADR-0051：平台实际标题可能被输入框咽字，按原标题反查会把真实发布误判成未发布。", "ADR-0034：一次运行只产一篇文章，同发微头条会造成内容重复且不受每日上限与冷却期约束。", "ADR-0037：把承接卡写进账本——循环 C 要按卡归因回答「哪些卡跑出了数据」。"], "reads": [{"path": ".newsagg/triage/2026-10-26-decision.json", "start": null, "end": null, "note": "card_file 从这里取", "total": 57, "text": "{\n  \"decision\": {\n    \"action\": \"continue\",\n    \"card_file\": \"ai-replacing-developers-misreads-the-work.md\",\n    \"confidence\": 0.87,\n    \"whats_new\": \"这张卡从建卡起只有一类证据：行业统计与公司公告（Meta 叫停第二轮裁员、微软承认成效没来、647 条 JD 里 63% 提 AI、一家教育公司把正岗换成外包）。今天第一次拿到的是**个体层的可核对账本**，而且是两份、方向相反的一份：\\n\\n第一个是上海的前端，5 年多经验，今年 4 月被裁、失业 6 个月，8 月底旺季开始投递、7-8 个面试邀约、最后拿到 2 个 offer，去杭州，**年薪降 15%**。他自己复盘的四条裁员原因里，**没有一条是 AI**：技术没跟进（React 19 发布很久没关注、Vite 普及很久没用）、出过几次线上 bug 给领导留下「不靠谱」印象、和 PM 沟通有障碍、没有 owner 意识。\\n\\n第二个是北京一家金融债券国企的外包前端，正式岗只剩领导层，基层需求/开发/测试 **90% 是外包**；去年入职时人还多，AI 普及以后裁员很多、也不再招新人；今年加班费取消、奖金取消、还降薪。技术栈仍是十年前发布的 Vue2 和 Java+SpringBoot+MySQL，今年才开始用 roo-code + deepseek v4，没推全栈。整理者的原话是「铁打的营盘流水的兵，是个程序员来了就能做」——这句话解释了两件事在时间上重合却不是因果：真正的机制是把人换成可替换的兵，AI 只是那段时间里发生的事。\\n\\n第三份材料补上了卡原本缺的一环——**机制**。AI 把「快乐路径」（能跑的功能）的成本压到接近免费，于是价值全部挤进「看不见的层」：异常路径、可观测性、安全防线、验收标准。原文那句判据可以直接检验：「别问 AI 会不会取代前端，要问你的工作里有多少比例是在生产快乐路径，多少比例是在守护异常路径」。同一篇还引出 V2EX 今年一个帖子：某公司内部评审认为 6 万行代码足以实现所有功能，外包交付时交了 18 万行、大面积 AI 生成，高赞评论是「如果是大模型生成的代码，又何必找外包第三方」——AI 不止压了编码环节的价格，也把「外包比自建便宜」这个前提拆了。\\n\\n所以推进是这样：卡原来断言「被压缩的是编码环节，不是开发工作」，今天把它推进成可检验的机制——被重估的不是岗位，是岗位里「生产快乐路径」那部分工作的定价；裁员发生在定价被重估之后，而人在复盘中会把原因归给当时最近发生的事（AI），归错了，就会学错东西。\",\n    \"event\": {\n      \"summary\": \"两位程序员的一手账本，加上一份机制拆解，凑出了「AI 裁员」这个说法之外的解释：上海一位 5 年经验的前端 4 月被裁、失业半年、降薪 15% 去杭州，他复盘的四条原因（技术没更新、线上 bug 留坏印象、沟通差、没有 owner 意识）里没有一条是 AI；北京一家金融债券国企的外包前端则展示了结构侧——正式岗只剩领导层、基层 90% 是外包、AI 普及后裁员停招、加班费与奖金取消，而技术栈还是十年前的 Vue2 与 Java+SpringBoot+MySQL。同期一篇拆解给出机制：AI 让「快乐路径」的代码几乎免费，价值全挤进异常路径、可观测性、安全与验收标准，连「外包比自建便宜」这个前提也在松动。社会侧的旁证是同一天头条出现四条「AI 与工作」议题（老干妈回应 AI 裁员传闻 5623164、比尔·盖茨谈 AI 对工作的冲击 1672444、AI税落到普通人头上了吗 373172、华尔街开始写 AI 末日之后预案 685748）——这个说法已经成了跨行业的解释框架。\",\n      \"members\": [\n        \"程序员 1v1 访谈系列第七期：失业半年所想到的\",\n        \"程序员 1v1 访谈系列第六期：国企也降薪裁员\",\n        \"外包和大厂的前端代码，差在凌晨三点\",\n        \"老干妈回应AI裁员传闻\",\n        \"比尔·盖茨谈AI对人类工作的冲击\",\n        \"“AI税”落到普通人头上了吗\",\n        \"华尔街开始写“AI末日之后”预案\"\n      ],\n      \"hot\": 5623164,\n      \"sources\": [\n        \"toutiao\",\n        \"juejin\"\n      ],\n      \"key_evidence\": [\n        \"掘金《程序员 1v1 访谈系列第七期：失业半年所想到的》（双越AI_club，2026-10-26，热度 153）：上海、男、本科、前端、5+ 年、互联网-本地生活、公司规模中，今年 4 月被裁员，失业 6 个月；8 月底进入旺季收到 7-8 个面试邀约，最终 2 个 offer，去杭州，**年薪降低 15%**，正在走背调\",\n        \"同一篇：他复盘的四条裁员原因全部与 AI 无关——① 没有持续更新个人技术，长期在舒适区（React 19 发布很久没关注、Vite 普及很久没用）② 工作上不够认真，出过几次线上 bug，给领导留下「不靠谱」印象 ③ 沟通能力不好，和 PM 沟通有障碍、PM 去领导那里告状 ④ 没有 owner 意识，做过的事 PM 再找就不愿意继续做\",\n        \"同一篇的复盘教训：「准备算法题原理题花费的时间太多了，因为很多时候根本不问这些内容，尤其中小公司」「应该尽早刷面试题，尽早投递简历，争取尽快找到一个平薪的工作，而不是求大厂求涨薪」；另外「不仅仅投递一个城市，全国投递，上海机会很少，反而杭州深圳机会更多」；他花 2 个月复习算法与原理，6-7 月面试淡季几乎没有面试邀请\",\n        \"同一篇整理者的判断（对求职者说的冷水）：「在公司晋升，个人技能是次要的因素。主要因素有两个：1. 公司和团队的晋升名额；2. 你个人对团队的贡献和 KPI 打分；3. 技术能力是否全面」；以及 remote 路径已基本关闭——「remote 大约是 2022 开始的……这两年更不提了，因为老外也开始裁员失业了，也是因为 AI 编程提效」\",\n        \"掘金《程序员 1v1 访谈系列第六期：国企也降薪裁员》（双越AI_club，2026-10-23，热度 315）：北京、本科、前端、4 年、金融债券国企、在职（外包）；「公司现在正式岗位都是领导层，基层的需求、开发、测试绝大部分 90% 都是外包」「去年他入职的时候人还比较多，后来 AI 普及以后裁员很多，现在也不再招聘新人了」\",\n        \"同一篇：「今年加班费取消、奖金取消、加上降薪裁员，大家工作积极性不高」「项目还是比较稳定的，需求也有，就是大家都不着急了」；技术栈仍是 Vue2（「Vue2 是十年之前发布的」）+ Java + SpringBoot + MySQL；今年开始用 roo-code + deepseek v4，但没推全栈，他仍是纯前端。整理者的原话：「不管他效率如何，也别管他是不是新技术，也别管他多年屎山，他就一个好处：铁打的营盘流水的兵，是个程序员来了就能做」\",\n        \"掘金《外包和大厂的前端代码，差在凌晨三点》（怕浪猫，2026-10-23，热度 171，趋势 climbing）：核心判断是「AI 让快乐路径的代码几乎免费了，于是看得见的部分趋同，看不见的部分差距反而更大」；五层差距为全链路防御、系统维度、异常路径、可观测性、安全意识\",\n        \"同一篇的判据与自检：「别问『AI 会不会取代前端』。要问：你的工作里，有多少比例是在生产快乐路径，多少比例是在守护异常路径？后者才是你的护城河」；六问里包括「每个网络请求，HTTP 状态码校验了吗」「接口数据过运行时校验了吗，还是直接信了 TypeScript 的类型」「loading / empty / error 三种边界状态都有对应 UI 吗」「异步请求有取消机制吗」「catch 块里是 console.error，还是带着上下文上报」「Token 在 localStorage 里吗」\",\n        \"同一篇引 V2EX 今年帖子：「某公司内部评审认为 6 万行代码足以实现所有功能，外包交付时交了 18 万行——大面积 AI 生成的产物」，高赞评论「如果是大模型生成的代码，又何必找外包第三方呢？甲方自己调用大模型不就好了」，另有评论「改不动的代码便宜，改的动的代码贵」；作者的结论是「外包剩下的生存空间，只剩两样：一是 AI 也搞不定的复杂业务上下文，二是出事之后有人负责」\",\n        \"头条同日四条「AI 与工作」议题（正文抓不到，只有标题与热度，据实标注）：「老干妈回应AI裁员传闻」5623164、「比尔·盖茨谈AI对人类工作的冲击」1672444、「华尔街开始写“AI末日之后”预案」685748、「“AI税”落到普通人头上了吗」373172——一家辣酱厂需要公开回应 AI 裁员传闻，说明这个说法已经脱离技术事实、变成跨行业的社会解释框架\"\n      ]\n    },\n    \"ranking_note\": \"两张卡在冷却期直接退出竞争：`personal-ai-monetization-is-paid-demand-not-technology.md` 1.88 天（昨天刚写）、`ai-productivity-claims-lack-reproducible-benchmarks.md` 2.88 天（10-24 刚写）。值得注意的是今天池子里正好有一条直接命中前者——掘金《一个人 + AI 做的小程序，今天，正式回本了》324——但冷却期优先于排序（硬规则 2），它只能作为那张卡的下一次素材。\\n三簇比较：\\n① **开发者职业处境簇**（掘金两条 1v1 第六期 315 / 第七期 153 + 《外包和大厂的前端代码，差在凌晨三点》171 climbing + 头条四条 AI 与工作议题，最高 5623164）→ 接 `ai-replacing-developers-misreads-the-work.md`（5.88 天，已出冷却）\\n② **模型成本与开源簇**（csdn《Kimi K3.1 Pro 评测：能力进了第一梯队，成本这笔账得另算》2940、头条《DeepSeek把自家“印钞机”开源了》187663、《DeepSeek到底怎么得罪了美国》1864056）→ 接 `llm-price-war-signals-commoditization.md`（3.88 天）或 `open-source-llm-bottleneck-is-ops-not-capability.md`（9.88 天）\\n③ **AI 编码工作流簇**（github `gemini-cli` 108244、`claude-howto` 44746、csdn《Codex 实现 AI 自动化运维》19927 climbing、掘金《一个需求，五个 Agent：TRAE 多 Agent 并行》450）→ 接 `ai-coding-workflow-over-model-capability.md`（6.88 天）\\n选①的理由是证据结构：今天这一簇**第一次同时具备三层**——个体账本（带可核对数字：失业 6 个月、降薪 15%、四条原因）、结构机制（90% 外包、正式岗只剩领导层、Vue2）、以及一份把机制讲透的拆解（快乐路径 vs 异常路径）。②只有一篇评测正文，两条关键头条抓不到正文；③的素材是「怎么用 AI 写得更好」，没有反向证据，且 10-20 的修订已覆盖。\",\n    \"why_this_over_alternative\": \"②模型成本簇（置信度 0.68，降为备选）：csdn 那篇 Kimi K3.1 Pro 评测确实有具体成本数据，但它是单一媒体的单一评测；头条《DeepSeek把自家“印钞机”开源了》187663 与《DeepSeek到底怎么得罪了美国》1864056 的正文都抓不到（toutiao trending 页需要 JS，ADR-0049 已记录），只能引用标题，写出来会变成标题解读。\\n③AI 编码工作流簇（置信度 0.55）：素材集中在「多 Agent 并行」「Codex 做自动化运维」这类做法介绍，都是正向证据，没有一条能修正或推翻卡判断；而「选工具的标准变了」在 10-20 的修订里已经写过。\\n另有一张从来没写过的卡被排除：`ai-tool-benefits-overestimated-by-demo-effect.md`（7 天前建立，`last_written` 仍是 null，本来最容易排上）。排除的理由是素材不匹配——今天池子里没有「引入 AI 工具后反而变慢」的新案例，拿旧素材或旧案例凑一篇出来，就是用它来占一个本该空着的位置。\\n一处据实说明的限制：「AI 裁员」的四条头条只有标题与热度，正文抓不到（`https://www.toutiao.com/trending/` 需执行 JS）。所以它们只能当「议题存在」的证据（一家辣酱厂需要回应 AI 裁员传闻），不能当内容引用，文章里会明确标注这一点。\",\n    \"money_point\": \"四类角色，都能对上号：\\n① **刚被裁、正在找工作的人**：第七期那位最值钱的不是结论而是顺序——他先花 2 个月复习算法题和原理题，「很多时候根本不问这些内容，尤其中小公司」；他后悔的是没有尽早投递、没有先争取平薪，而是想进大厂想涨薪。实际路径是 8 月底旺季投 7-8 家、拿 2 个 offer、降薪 15%。所以准备顺序应该反过来：**先投出去拿面试反馈，再补被问到的东西**。另外一条立刻可用：不只投一个城市（他的观察是上海机会少，杭州深圳更多）。\\n② **在国企/银行做外包或内包的人**：第六期那句「铁打的营盘流水的兵，是个程序员来了就能做」是双刃——它意味着岗位稳、不加班、有业余时间（这位受访者自己也说「至少自己不累，也有业余时间」），也意味着这段经历在外部市场不被认（Vue2 是十年前的版本）。你的护城河不是技术深度，是**这套业务上下文有多难被替换**。他担心的方向恰好是错的那一个：想继续做纯前端、想问 remote，而 remote 这条路 2022 之后基本关了。\\n③ **所有还在写业务代码的前端 / 开发**：《外包和大厂》那六问是本文唯一能当天执行的东西——每个网络请求校验 HTTP 状态码了吗、接口数据过运行时校验了吗（TypeScript 只保证编译期）、loading/empty/error 三种边界都有 UI 吗、异步请求有取消机制吗、catch 里是 console.error 还是带上下文上报、Token 在 localStorage 里吗。判据一句话：**你的工作里有多少比例在生产快乐路径，多少比例在守护异常路径**——AI 让前者接近免费，后者是唯一还在涨价的部分。\\n④ **正在用「AI 裁员」解释自己处境的人**：这个说法很方便，但它给不出下一步。换成三个具体问题：裁的是哪一层（正式岗还是外包岗）、补的是外包还是不补、你这个岗位的 JD 最近变了没有。第六期和第七期的答案分别是「正式岗只剩领导层」和「JD 没变但市场冷了」，两个答案指向的动作完全不同。\"\n  }\n}"}, {"path": "outputs/2026-10-26-layoff-reasons-without-ai.md", "start": 1, "end": 3, "note": "成稿标题", "total": 65, "text": "# 被裁半年降薪15%：四条原因里没有AI\n\n今年 4 月被裁的那个人，失业半年，最后去杭州，年薪降了 15%。他复盘了被裁的四条原因：技术没跟进、出过线上 bug 给领导留下「不靠谱」的印象、跟产品经理沟通有障碍、没有 owner 意识。"}], "writes": [{"path": ".newsagg/publish-ledger.jsonl", "start": null, "end": null, "loc": "第 12 行 / 共 12 行（JSON 已格式化便于阅读）", "note": "账本最新一行（本次真实发布）", "total": 12, "text": "{\n  \"at\": \"2026-10-26T21:04:08.624164+08:00\",\n  \"slug\": \"2026-10-26-l 融债券国企的外包前端，正式岗只剩领导层，基层需求/开发/测试 **90% 是外包**；去年入职时人还多，AI 普及以后裁员很多、也不再招新人；今年加班费取消、奖金取消、还降薪。技术栈仍是十年前发布的 Vue2 和 Java+SpringBoot+MySQL，今年才开始用 roo-code + deepseek v4，没推全栈。整理者的原话是「铁打的营盘流水的兵，是个程序员来了就能做」——这句话解释了两件事在时间上重合却不是因果：真正的机制是把人换成可替换的兵，AI 只是那段时间里发生的事。\\n\\n第三份材料补上了卡原本缺的一环——**机制**。AI 把「快乐路径」（能跑的功能）的成本压到接近免费，于是价值全部挤进「看不见的层」：异常路径、可观测性、安全防线、验收标准。原文那句判据可以直接检验：「别问 AI 会不会取代前端，要问你的工作里有多少比例是在生产快乐路径，多少比例是在守护异常路径」。同一篇还引出 V2EX 今年一个帖子：某公司内部评审认为 6 万行代码足以实现所有功能，外包交付时交了 18 万行、大面积 AI 生成，高赞评论是「如果是大模型生成的代码，又何必找外包第三方」——AI 不止压了编码环节的价格，也把「外包比自建便宜」这个前提拆了。\\n\\n所以推进是这样：卡原来断言「被压缩的是编码环节，不是开发工作」，今天把它推进成可检验的机制——被重估的不是岗位，是岗位里「生产快乐路径」那部分工作的定价；裁员发生在定价被重估之后，而人在复盘中会把原因归给当时最近发生的事（AI），归错了，就会学错东西。\",\n    \"event\": {\n      \"summary\": \"两位程序员的一手账本，加上一份机制拆解，凑出了「AI 裁员」这个说法之外的解释：上海一位 5 年经验的前端 4 月被裁、失业半年、降薪 15% 去杭州，他复盘的四条原因（技术没更新、线上 bug 留坏印象、沟通差、没有 owner 意识）里没有一条是 AI；北京一家金融债券国企的外包前端则展示了结构侧——正式岗只剩领导层、基层 90% 是外包、AI 普及后裁员停招、加班费与奖金取消，而技术栈还是十年前的 Vue2 与 Java+SpringBoot+MySQL。同期一篇拆解给出机制：AI 让「快乐路径」的代码几乎免费，价值全挤进异常路径、可观测性、安全与验收标准，连「外包比自建便宜」这个前提也在松动。社会侧的旁证是同一天头条出现四条「AI 与工作」议题（老干妈回应 AI 裁员传闻 5623164、比尔·盖茨谈 AI 对工作的冲击 1672444、AI税落到普通人头上了吗 373172、华尔街开始写 AI 末日之后预案 685748）——这个说法已经成了跨行业的解释框架。\",\n      \"members\": [\n        \"程序员 1v1 访谈系列第七期：失业半年所想到的\",\n        \"程序员 1v1 访谈系列第六期：国企也降薪裁员\",\n        \"外包和大厂的前端代码，差在凌晨三点\",\n        \"老干妈回应AI裁员传闻\",\n        \"比尔·盖茨谈AI对人类工作的冲击\",\n        \"“AI税”落到普通人头上了吗\",\n        \"华尔街开始写“AI末日之后”预案\"\n      ],\n      \"hot\": 5623164,\n      \"sources\": [\n        \"toutiao\",\n        \"juejin\"\n      ],\n      \"key_evidence\": [\n        \"掘金《程序员 1v1 访谈系列第七期：失业半年所想到的》（双越AI_club，2026-10-26，热度 153）：上海、男、本科、前端、5+ 年、互联网-本地生活、公司规模中，今年 4 月被裁员，失业 6 个月；8 月底进入旺季收到 7-8 个面试邀约，最终 2 个 offer，去杭州，**年薪降低 15%**，正在走背调\",\n        \"同一篇：他复盘的四条裁员原因全部与 AI 无关——① 没有持续更新个人技术，长期在舒适区（React 19 发布很久没关注、Vite 普及很久没用）② 工作上不够认真，出过几次线上 bug，给领导留下「不靠谱」印象 ③ 沟通能力不好，和 PM 沟通有障碍、PM 去领导那里告状 ④ 没有 owner 意识，做过的事 PM 再找就不愿意继续做\",\n        \"同一篇的复盘教训：「准备算法题原理题花费的时间太多了，因为很多时候根本不问这些内容，尤其中小公司」「应该尽早刷面试题，尽早投递简历，争取尽快找到一个平薪的工作，而不是求大厂求涨薪」；另外「不仅仅投递一个城市，全国投递，上海机会很少，反而杭州深圳机会更多」；他花 2 个月复习算法与原理，6-7 月面试淡季几乎没有面试邀请\",\n        \"同一篇整理者的判断（对求职者说的冷水）：「在公司晋升，个人技能是次要的因素。主要因素有两个：1. 公司和团队的晋升名额；2. 你个人对团队的贡献和 KPI 打分；3. 技术能力是否全面」；以及 remote 路径已基本关闭——「remote 大约是 2022 开始的……这两年更不提了，因为老外也开始裁员失业了，也是因为 AI 编程提效」\",\n        \"掘金《程序员 1v1 访谈系列第六期：国企也降薪裁员》（双越AI_club，2026-10-23，热度 315）：北京、本科、前端、4 年、金融债券国企、在职（外包）；「公司现在正式岗位都是领导层，基层的需求、开发、测试绝大部分 90% 都是外包」「去年他入职的时候人还比较多，后来 AI 普及以后裁员很多，现在也不再招聘新人了」\",\n        \"同一篇：「今年加班费取消、奖金取消、加上降薪裁员，大家工作积极性不高」「项目还是比较稳定的，需求也有，就是大家都不着急了」；技术栈仍是 Vue2（「Vue2 是十年之前发布的」）+ Java + SpringBoot + MySQL；今年开始用 roo-code + deepseek v4，但没推全栈，他仍是纯前端。整理者的原话：「不管他效率如何，也别管他是不是新技术，也别管他多年屎山，他就一个好处：铁打的营盘流水的兵，是个程序员来了就能做」\",\n        \"掘金《外包和大厂的前端代码，差在凌晨三点》（怕浪猫，2026-10-23，热度 171，趋势 climbing）：核心判断是「AI 让快乐路径的代码几乎免费了，于是看得见的部分趋同，看不见的部分差距反而更大」；五层差距为全链路防御、系统维度、异常路径、可观测性、安全意识\",\n        \"同一篇的判据与自检：「别问『AI 会不会取代前端』。要问：你的工作里，有多少比例是在生产快乐路径，多少比例是在守护异常路径？后者才是你的护城河」；六问里包括「每个网络请求，HTTP 状态码校验了吗」「接口数据过运行时校验了吗，还是直接信了 TypeScript 的类型」「loading / empty / error 三种边界状态都有对应 UI 吗」「异步请求有取消机制吗」「catch 块里是 console.error，还是带着上下文上报」「Token 在 localStorage 里吗」\",\n        \"同一篇引 V2EX 今年帖子：「某公司内部评审认为 6 万行代码足以实现所有功能，外包交付时交了 18 万行——大面积 AI 生成的产物」，高赞评论「如果是大模型生成的代码，又何必找外包第三方呢？甲方自己调用大模型不就好了」，另有评论「改不动的代码便宜，改的动的代码贵」；作者的结论是「外包剩下的生存空间，只剩两样：一是 AI 也搞不定的复杂业务上下文，二是出事之后有人负责」\",\n        \"头条同日四条「AI 与工作」议题（正文抓不到，只有标题与热度，据实标注）：「老干妈回应AI裁员传闻」5623164、「比尔·盖茨谈AI对人类工作的冲击」1672444、「华尔街开始写“AI末日之后”预案」685748、「“AI税”落到普通人头上了吗」373172——一家辣酱厂需要公开回应 AI 裁员传闻，说明这个说法已经脱离技术事实、变成跨行业的社会解释框架\"\n      ]\n    },\n    \"ranking_note\": \"两张卡在冷却期直接退出竞争：`personal-ai-monetization-is-paid-demand-not-technology.md` 1.88 天（昨天刚写）、`ai-productivity-claims-lack-reproducible-benchmarks.md` 2.88 天（10-24 刚写）。值得注意的是今天池子里正好有一条直接命中前者——掘金《一个人 + AI 做的小程序，今天，正式回本了》324——但冷却期优先于排序（硬规则 2），它只能作为那张卡的下一次素材。\\n三簇比较：\\n① **开发者职业处境簇**（掘金两条 1v1 第六期 315 / 第七期 153 + 《外包和大厂的前端代码，差在凌晨三点》171 climbing + 头条四条 AI 与工作议题，最高 5623164）→ 接 `ai-replacing-developers-misreads-the-work.md`（5.88 天，已出冷却）\\n② **模型成本与开源簇**（csdn《Kimi K3.1 Pro 评测：能力进了第一梯队，成本这笔账得另算》2940、头条《DeepSeek把自家“印钞机”开源了》187663、《DeepSeek到底怎么得罪了美国》1864056）→ 接 `llm-price-war-signals-commoditization.md`（3.88 天）或 `open-source-llm-bottleneck-is-ops-not-capability.md`（9.88 天）\\n③ **AI 编码工作流簇**（github `gemini-cli` 108244、`claude-howto` 44746、csdn《Codex 实现 AI 自动化运维》19927 climbing、掘金《一个需求，五个 Agent：TRAE 多 Agent 并行》450）→ 接 `ai-coding-workflow-over-model-capability.md`（6.88 天）\\n选①的理由是证据结构：今天这一簇**第一次同时具备三层**——个体账本（带可核对数字：失业 6 个月、降薪 15%、四条原因）、结构机制（90% 外包、正式岗只剩领导层、Vue2）、以及一份把机制讲透的拆解（快乐路径 vs 异常路径）。②只有一篇评测正文，两条关键头条抓不到正文；③的素材是「怎么用 AI 写得更好」，没有反向证据，且 10-20 的修订已覆盖。\",\n    \"why_this_over_alternative\": \"②模型成本簇（置信度 0.68，降为备选）：csdn 那篇 Kimi K3.1 Pro 评测确实有具体成本数据，但它是单一媒体的单一评测；头条《DeepSeek把自家“印钞机”开源了》187663 与《DeepSeek到底怎么得罪了美国》1864056 的正文都抓不到（toutiao trending 页需要 JS，ADR-0049 已记录），只能引用标题，写出来会变成标题解读。\\n③AI 编码工作流簇（置信度 0.55）：素材集中在「多 Agent 并行」「Codex 做自动化运维」这类做法介绍，都是正向证据，没有一条能修正或推翻卡判断；而「选工具的标准变了」在 10-20 的修订里已经写过。\\n另有一张从来没写过的卡被排除：`ai-tool-benefits-overestimated-by-demo-effect.md`（7 天前建立，`last_written` 仍是 null，本来最容易排上）。排除的理由是素材不匹配——今天池子里没有「引入 AI 工具后反而变慢」的新案例，拿旧素材或旧案例凑一篇出来，就是用它来占一个本该空着的位置。\\n一处据实说明的限制：「AI 裁员」的四条头条只有标题与热度，正文抓不到（`https://www.toutiao.com/trending/` 需执行 JS）。所以它们只能当「议题存在」的证据（一家辣酱厂需要回应 AI 裁员传闻），不能当内容引用，文章里会明确标注这一点。\",\n    \"money_point\": \"四类角色，都能对上号：\\n① **刚被裁、正在找工作的人**：第七期那位最值钱的不是结论而是顺序——他先花 2 个月复习算法题和原理题，「很多时候根本不问这些内容，尤其中小公司」；他后悔的是没有尽早投递、没有先争取平薪，而是想进大厂想涨薪。实际路径是 8 月底旺季投 7-8 家、拿 2 个 offer、降薪 15%。所以准备顺序应该反过来：**先投出去拿面试反馈，再补被问到的东西**。另外一条立刻可用：不只投一个城市（他的观察是上海机会少，杭州深圳更多）。\\n② **在国企/银行做外包或内包的人**：第六期那句「铁打的营盘流水的兵，是个程序员来了就能做」是双刃——它意味着岗位稳、不加班、有业余时间（这位受访者自己也说「至少自己不累，也有业余时间」），也意味着这段经历在外部市场不被认（Vue2 是十年前的版本）。你的护城河不是技术深度，是**这套业务上下文有多难被替换**。他担心的方向恰好是错的那一个：想继续做纯前端、想问 remote，而 remote 这条路 2022 之后基本关了。\\n③ **所有还在写业务代码的前端 / 开发**：《外包和大厂》那六问是本文唯一能当天执行的东西——每个网络请求校验 HTTP 状态码了吗、接口数据过运行时校验了吗（TypeScript 只保证编译期）、loading/empty/error 三种边界都有 UI 吗、异步请求有取消机制吗、catch 里是 console.error 还是带上下文上报、Token 在 localStorage 里吗。判据一句话：**你的工作里有多少比例在生产快乐路径，多少比例在守护异常路径**——AI 让前者接近免费，后者是唯一还在涨价的部分。\\n④ **正在用「AI 裁员」解释自己处境的人**：这个说法很方便，但它给不出下一步。换成三个具体问题：裁的是哪一层（正式岗还是外包岗）、补的是外包还是不补、你这个岗位的 JD 最近变了没有。第六期和第七期的答案分别是「正式岗只剩领导层」和「JD 没变但市场冷了」，两个答案指向的动作完全不同。\"\n  }\n}"}], "writes": [{"path": "knowledge/cards/ai-replacing-developers-misreads-the-work.md", "start": 2, "end": 14, "note": "写回后的 frontmatter", "total": 68, "text": "issue: 「AI 取代开发者」的叙事搞错了开发工作的本质\nstatus: active\ncreated: 2026-10-14\nlast_written: 2026-10-26\ncovered_events:\n  - 2026-10-21 雇主开始撤回「AI 替代员工」的假设，但岗位结构已经先一步变了：Meta 因 AI 未达预期叫停第二轮裁员、微软承认业务成效没随 AI 推广出现；同时大厂前端 JD 有 63% 提到 AI、一半写进任职要求，而一家教育公司正在把正式岗换成外包岗——被压缩的不是初级岗位，是中间层的正式岗位\n  - 2026-10-26 两位程序员的一手账本，加上一份机制拆解，凑出了「AI 裁员」这个说法之外的解释：上海一位 5 年经验的前端 4 月被裁、失业半年、降薪 15% 去杭州，他复盘的四条原因（技术没更新、线上 bug 留坏印象、沟通差、没有 owner 意识）里没有一条是 AI；北京一家金融债券国企的外包前端则展示了结构侧——正式岗只剩领导层、基层 90% 是外包、AI 普及后裁员停招、加班费与奖金取消，而技术栈还是十年前的 Vue2 与 Java+SpringBoot+MySQL。同期一篇拆解给出机制：AI 让「快乐路径」的代码几乎免费，价值全挤进异常路径、可观测性、安全与验收标准，连「外包比自建便宜」这个前提也在松动。社会侧的旁证是同一天头条出现四条「AI 与工作」议题（老干妈回应 AI 裁员传闻 5623164、比尔·盖茨谈 AI 对工作的冲击 1672444、AI税落到普通人头上了吗 373172、华尔街开始写 AI 末日之后预案 685748）——这个说法已经成了跨行业的解释框架。\nsource: 种子卡（人工植入，ADR-0007）\n---\n# 「AI 取代开发者」的叙事搞错了开发工作的本质\n\n## 当前判断\n"}], "files": [{"path": ".agents/skills/newsagg-triage/scripts/writeback.py", "start": 1, "end": 13, "note": "设计依据：covered_events 与 last_written 是关键字段", "total": 178, "text": "#!/usr/bin/env python3\n\"\"\"认知写回：发布成功后向观点卡追加一条修订（ADR-0026 循环 A）。\n\n设计依据：\n- ADR-0007 卡片结构：当前判断 / 依据事实 / 修订史 / covered_events\n- ADR-0026 循环 A：写回**不阻塞**，但带**未复核**标记与来源；本人可推翻\n- ADR-0026：`covered_events` 与 `last_written` 是防重复发文的关键字段\n  （前者让下次能判「跳过 vs 续写」，后者决定冷却期）\n- ADR-0018：knowledge/cards/ 由系统写；但仅追加，不改写旧判断\n\n本脚本只做追加（确定性工作）。不判断该不该写回——那是分拣决策的事。\n\"\"\"\nfrom __future__ import annotations"}, {"path": ".agents/skills/newsagg-triage/scripts/writeback.py", "start": 57, "end": 69, "note": "空列表展开的处理", "total": 178, "text": "def append_covered_event(raw_fm: str, event_desc: str, date: str) -> str:\n    \"\"\"向 covered_events 追加一条。空列表写成 [] 时需展开。\"\"\"\n    entry = f\"  - {date} {event_desc}\"\n    # 情形一：covered_events: []  → 展开成多行\n    if re.search(r\"^covered_events:\\s*\\[\\]\\s*$\", raw_fm, re.M):\n        return re.sub(r\"^covered_events:\\s*\\[\\]\\s*$\",\n                      \"covered_events:\\n\" + entry, raw_fm, count=1, flags=re.M)\n    # 情形二：已有列表 → 在其末尾追加\n    m = re.search(r\"^(covered_events:\\s*)$((?:\\n\\s+-\\s+.*)*)\", raw_fm, re.M)\n    if m:\n        insert_at = m.end(2)\n        return raw_fm[:insert_at] + \"\\n\" + entry + raw_fm[insert_at:]\n    # 情形三：字段不存在 → 追加字段"}, {"path": ".agents/skills/newsagg-triage/scripts/writeback.py", "start": 114, "end": 126, "note": "幂等保护", "total": 178, "text": "\n    # ── 幂等保护（ADR-0026 的同构要求）──\n    # 与\"风格学习需按版本去重\"同理：同一次事件被写回两次，会让 covered_events\n    # 出现重复条目，从而污染「跳过 vs 续写」的判定——分拣会以为写过两次。\n    # 判据：同日 + 同事件（前缀匹配）已存在于 covered_events。\n    event_key = args.event[:24]\n    for e in (fm.get(\"covered_events\") or []):\n        if str(e).startswith(date) and event_key in str(e):\n            print(json.dumps({\n                \"ok\": True, \"skipped\": True, \"reason\": \"该事件已在 covered_events 中（幂等保护）\",\n                \"card\": args.card, \"date\": date, \"matched\": str(e),\n            }, ensure_ascii=False, indent=2))\n            return 0"}, {"path": ".agents/skills/newsagg-collect/scripts/run_all.sh", "start": 742, "end": 758, "note": "编排器：失败不阻塞发布，但须人工补", "total": 772, "text": "    log \"⑥ 认知写回（追加未复核修订到 ${CARD}）\"\n    WB_ARGS=(--card \"$CARD\" --event \"$(dec_field event.summary)\" --article \"$SLUG\" --date \"$DATE\")\n    [[ -n \"$(dec_field whats_new)\" ]] && WB_ARGS+=(--judgment \"$(dec_field whats_new)\")\n    [[ -n \"$(dec_field event.key_evidence)\" ]] && WB_ARGS+=(--evidence \"$(dec_field event.key_evidence)\")\n    if python3 .agents/skills/newsagg-triage/scripts/writeback.py \"${WB_ARGS[@]}\"; then\n      echo \"写回完成（带未复核标记，你可推翻）\"\n    else\n      echo \"[X] 写回失败——认知资产本轮未生长（不阻塞发布，但须人工补）\" >&2\n      write_status 1 \"writeback_failed\" \"写回失败\" \"$CARD\"\n    fi\n  else\n    echo \"（决策未给出 card_file，跳过写回）\"\n  fi\nelse\n  echo \"（dry-run：跳过 ⑥ 认知写回——写回只发生在真实发布成功之后）\"\nfi\n"}]}, {"id": "n13-brief-push", "step": "⑦⑧⑨", "title": "状态 + 简报 + commit/push", "layer": "orchestrate", "when": "第 3 段结尾（成功与失败都走）", "actor": "脚本", "one_liner": "把这一轮的成败写成 run-status，再渲染成人看的五段式简报，最后提交推送。", "does": ["run-status.json：无论成败都先落一份「这一轮跑到哪、为什么停」。", "brief.py 读当日全部产物渲染五段：① 今日结论 ② 采集分拣概览 ③ 本篇与发布结果 ④ 资产变动 ⑤ 需你介入的事项。", "缺哪个阶段的文件就按「该阶段未运行」呈现，不报错——简报必须无条件每日存在。", "sync_push：git add -A → commit → push 当前分支；push 走代理失败时直连重试一次。", "降级轮不 push：不知道远端有没有新提交，盲目 push 可能被拒。"], "why": ["ADR-0038：任何失败都必须出简报。`.newsagg/` 不入库、看守读不到它，所以成败由简报呈现给人。", "ADR-0006：简报是心跳不是可选报告。一份写明「本轮运行未完成」的简报比没有简报更有信息量。", "ADR-0019：五段结构的存在是为了让「今日无选题」「弃权」「系统没跑」三者可区分。"], "reads": [{"path": ".newsagg/run-status.json", "start": null, "end": null, "note": "运行状态（① 段优先读它）", "total": 9, "text": "{\n  \"ok\": true,\n  \"at\": \"2026-10-26T21:05:34.011200+08:00\",\n  \"date\": \"2026-10-26\",\n  \"mode\": \"publish\",\n  \"stage\": \"complete\",\n  \"reason\": \"运行完成\",\n  \"detail\": \"slug=2026-10-26-layoff-reasons-without-ai mode=publish\"\n}"}, {"path": ".newsagg/performance-status.json", "start": null, "end": null, "note": "表现读回结果（⑤ 段）", "total": 26, "text": "{\n  \"ok\": true,\n  \"at\": \"2026-10-26T21:00:04.855427+08:00\",\n  \"parse\": {\n    \"source\": \"api_intercept\",\n    \"parse\": \"ok\",\n    \"envelope_items\": 2\n  },\n  \"articles_on_platform\": 10,\n  \"articles_matched\": 10,\n  \"weitoutiao_matched\": \"…(0 项)\",\n  \"unmatched\": \"…(0 项)\",\n  \"new_records\": 10,\n  \"updated_records\": 0,\n  \"store\": \"reports/performance.jsonl\",\n  \"fetch\": {\n    \"attempts\": [\n      {\n        \"attempt\": 1,\n        \"code\": 0,\n        \"kind\": \"unknown\"\n      }\n    ],\n    \"lock_timeout\": false\n  }\n}"}, {"path": ".newsagg/publish-ledger.jsonl", "start": null, "end": null, "loc": "第 12 行 / 共 12 行（JSON 已格式化便于阅读）", "note": "发布账本（③ 段）", "total": 12, "text": "{\n  \"at\": \"2026-10-26T21:04:08.624164+08:00\",\n  \"slug\" 这是全系统唯一的\"推送\"通道（其余告警都写 Issue，属拉取通道，见 ADR-0005）。"}, {"path": ".github/workflows/newsagg-watchdog.yml", "start": 50, "end": 66, "note": "检查窗口：昨天与今天任一存在即存活", "total": 106, "text": "\n          # 计算\"应当存在\"的简报日期：简报是\"次日\"发出的，所以今天 11:00 应能看到\n          # 【昨天】的简报，但也允许【今天】的已经发出。两者任一存在即视为存活。\n          #\n          # 用 TZ=Asia/Shanghai 而不是 UTC（ADR-0018：时区在仓内显式声明，不依赖\n          # 运行环境的本地时区）。今天 03:00 UTC 恰好等于北京 11:00，两者算出的\n          # 日期此时相同——但那是巧合，不是保证：一旦 cron 时间调整（例如改成\n          # 检查前一天的更晚时刻），UTC 日期就会与简报的实际日期错开一天。\n          YESTERDAY=$(TZ=Asia/Shanghai date -d 'yesterday' +%Y-%m-%d)\n          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)\n\n          echo \"检查窗口: $YESTERDAY .. $TODAY\"\n\n          FOUND=\"\"\n          for d in \"$YESTERDAY\" \"$TODAY\"; do\n            if [ -f \"reports/$d.md\" ]; then\n              FOUND=\"$d\""}, {"path": ".github/workflows/newsagg-watchdog.yml", "start": 87, "end": 99, "note": "五段齐备校验", "total": 106, "text": "          BODY=$(cat \"reports/$D.md\")\n\n          # ADR-0019 的五段标题（用序号匹配，容忍前缀差异）\n          MISSING=\"\"\n          for marker in \"①\" \"②\" \"③\" \"④\" \"⑤\"; do\n            if ! printf '%s' \"$BODY\" | grep -q \"$marker\"; then\n              MISSING=\"$MISSING $marker\"\n            fi\n          done\n\n          if [ -n \"$MISSING\" ]; then\n            echo \"::error::简报 $D 存在但残缺，缺失段落:$MISSING\"\n            exit 1"}, {"path": ".github/workflows/newsagg-tests.yml", "start": 1, "end": 13, "note": "为什么单独建这个工作流", "total": 112, "text": "name: NewsAgg 测试\n\n# 设计依据 ADR-0056：仓库此前**没有任何测试文件**，第一个测试套件是随「位次趋势」\n# 一起建的（tests/，标准库 unittest，32 个用例）。本工作流是它的**唯一消费者**。\n#\n# 为什么要单独建这个工作流，而不是靠\"记得手动跑\"：\n# 这正是本仓库反复记录的失败形状——**记录了但没有消费者**。ADR-0038 的\n# `hot_history` 被采集层记了三天却没人读（DESIGN.md 残余风险 18）；ADR-0042 的\n# 三份 `parse_frontmatter` 漂移后没人发现；ADR-0054 的字段名漂移只让简报少显示\n# 一行、退出码仍是 0。一份没人跑的测试与没有测试等价，而且**更糟**：它让人以为\n# 有回归保护。把 `python3 -m unittest discover` 交给 CI 执行，\"跑没跑\"就不再依赖\n# 人的记忆。\n#"}, {"path": ".github/workflows/newsagg-tests.yml", "sta <script>
const DATA = JSON.parse(document.getElementById('payload').textContent);
const NODES = DATA.nodes, META = DATA.meta || {}, GROUPS = DATA.groups || [];
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hlRef = s => esc(s).replace(/(ADR-\d{4})/g, '<span class="adr">$1</span>');

// 分组完全由 facts 决定：没写 groups 就按 nodes 原顺序平铺成一组。
// 这样事实层可以表达"白天已跑过三次"这种时间倒错的真实顺序，
// 而不必迁就代码里的声明顺序。
const G = GROUPS.length ? GROUPS : [{title: '执行流', ids: NODES.map(n => n.id)}];
const byId = new Map(NODES.map(n => [n.id, n]));
const placed = new Set();

document.title = (META.title || 'Repo') + ' · 工作过程可视化';
document.getElementById('metaline').textContent =
  `${META.date || '—'} 实例 · 摘录实读自仓库，行号为真实行号`;
document.getElementById('statsline').innerHTML =
  (META.stats || []).map(([k, v]) => `${esc(k)} <b>${esc(String(v))}</b>`).join(' · ');

// ── rail ──────────────────────────────────────────────────
const rail = document.getElementById('rail');
const order = [];
G.forEach(g => {
  const ns = g.ids.map(id => byId.get(id)).filter(Boolean);
  ns.forEach(n => { order.push(n.id); placed.add(n.id); });
  if (!ns.length) return;
  const box = document.createElement('div');
  box.className = 'group';
  box.innerHTML = `<div class="group-t">${esc(g.title)}</div>`;
  ns.forEach(n => box.appendChild(nodeEl(n)));
  rail.appendChild(box);
});
// 没被任何 group 收走的节点单独兜底 —— 漏配分组不该让节点凭空消失
const orphans = NODES.filter(n => !placed.has(n.id));
if (orphans.length) {
  const box = document.createElement('div');
  box.className = 'group';
  box.innerHTML = `<div class="group-t">其他环节</div>`;
  orphans.forEach(n => box.appendChild(nodeEl(n)));
  rail.appendChild(box);
}

function hay(n) {
  return [n.step, n.title, n.one_liner, n.actor, n.when,
    ...(n.does || []), ...(n.why || [])].filter(Boolean).join(' ').toLowerCase();
}
function nodeEl(n) {
  const d = document.createElement('div');
  d.className = 'node-i';
  d.dataset.layer = n.layer || '';
  d.dataset.id = n.id;
  d.dataset.search = hay(n);
  d.innerHTML = `<div class="step">${esc(n.step || '·')}</div>
    <div class="nm">${esc(n.title)}<small>${esc((n.when || '').split('（')[0])}</small></div>`;
  d.onclick = () => select(n.id);
  return d;
}

// ── 文件索引（反向视图：这个文件被谁用）────────────────────
// 正向视图回答"这一环节读了什么"，反向视图回答"这个文件归谁管"。
// 后者在排查"改这里会影响什么"时才真正被需要，成本却只是多建一个 Map。
const FILEMAP = new Map();
NODES.forEach(n => {
  [...(n.reads || []), ...(n.writes || []), ...(n.files || [])].forEach(f => {
    if (!FILEMAP.has(f.path)) FILEMAP.set(f.path, {file: f, nodes: []});
    const e = FILEMAP.get(f.path);
    if (!e.nodes.includes(n.id)) e.nodes.push(n.id);
  });
});
const FILELIST = [...FILEMAP.entries()].sort((a, b) => a[0].localeCompare(b[0]));
(function () {
  const box = document.createElement('div');
  box.className = 'group';
  box.innerHTML = `<div class="group-t">文件索引 · ${FILELIST.length} 个文件</div>`;
  FILELIST.forEach(([path, e]) => {
    const d = document.createElement('div');
    d.className = 'node-i file-i';
    d.dataset.layer = 'file';
    d.dataset.path = path;
    d.dataset.search = path.toLowerCase();
    const base = path.split('/').pop();
    const dir = path.includes('/') ? path.slice(0, path.lastIndexOf('/')) : '';
    d.innerHTML = `<div class="step">◦</div>
      <div class="nm">${esc(base)}<small>${esc(dir)} · ${e.nodes.length} 处引用</small></div>`;
    d.onclick = () => {
      document.querySelectorAll('.node-i').forEach(x => x.classList.remove('on'));
      d.classList.add('on');
      openFile(e.file);
    };
    box.appendChild(d);
  });
  rail.appendChild(box);
})();

// ── detail ────────────────────────────────────────────────
const detail = document.getElementById('detail');
let current = null;

function fileCard(f, rw, key) {
  const where = f.start
    ? `${f.path}<span class="fc-lines">:${f.start}${f.end !== f.start ? '-' + f.end : ''}</span>`
    : `${f.path}<span class="fc-lines">· ${f.loc ? f.loc.split(' / ')[0] : '结构化'}</span>`;
  return `<div class="fcard" data-key="${key}">
    <div class="fc-top">
      <span class="fc-ico">${rw === 'r' ? '◂' : rw === 'w' ? '▸' : '·'}</span>
      <span class="fc-path">${esc(where)}</span>
      ${rw === '-' ? '' : `<span class="badge-rw ${rw}">${rw === 'r' ? '读' : '写'}</span>`}
    </div>
    <div class="fc-note">${esc(f.note || '')}</div>
  </div>`;
}

function renderDetail(id) {
  const n = byId.get(id);
  if (!n) return;
  current = n;
  // 给每张卡发一个序号当身份，避免后面按 path 找回时抓错同一文件的另一段
  const pool = [];
  const groupsHtml = ['r', 'w'].map(rw => {
    const arr = (rw === 'r' ? (n.reads || []) : (n.writes || []));
    if (!arr.length) return '';
    const cards = arr.map(f => {
      pool.push(f);
      return fileCard(f, rw, pool.length - 1);
    }).join('');
    return `<div class="fgroup"><div class="fg-t">${rw === 'r' ? '依赖的输入' : '产出的输出'}
      <span class="cnt">${arr.length} 项</span></div>${cards}</div>`;
  }).join('');
  const exCards = (n.files || []).map(f => {
    pool.push(f);
    return fileCard(f, '-', pool.length - 1);
  }).join('');

  detail.innerHTML = `
    <div class="d-head">
      <div class="d-step">步骤 ${esc(n.step || '·')}</div>
      <div class="d-title">${esc(n.title)}</div>
      <div class="d-meta">
        ${n.actor ? `<span class="tag who">${esc(n.actor)}</span>` : ''}
        ${n.when ? `<span class="tag when">${esc(n.when)}</span>` : ''}
      </div>
      ${n.one_liner ? `<div class="d-one">${esc(n.one_liner)}</div>` : ''}
    </div>
    <div class="d-body">
      ${(n.does || []).length ? `<h3 class="sec">这一步做了什么</h3>
        <ul class="list">${n.does.map(d => `<li>${hlRef(d)}</li>`).join('')}</ul>` : ''}
      ${(n.why || []).length ? `<h3 class="sec">为什么这样设计</h3>
        <ul class="list why">${n.why.map(d => `<li>${hlRef(d)}</li>`).join('')}</ul>` : ''}
      ${groupsHtml}
      ${(n.files || []).length ? `<div class="fgroup">
        <div class="fg-t">点开看原文 <span class="cnt">${n.files.length} 段摘录</span></div>
        ${exCards}</div>` : ''}
    </div>`;
  detail.querySelectorAll('.fcard').forEach(c => c.onclick = () => {
    const f = pool[+c.dataset.key];
    openFile(f);
    detail.querySelectorAll('.fcard').forEach(x => x.classList.toggle('on', x === c));
  });
  detail.scrollTop = 0;
  document.querySelectorAll('.node-i').forEach(x => x.classList.toggle('on', x.dataset.id === id));
}

// ── viewer ────────────────────────────────────────────────
const viewer = document.getElementById('viewer');
function renderCode(text, startLine, hits) {
  return text.split('\n').map((t, i) => {
    const ln = startLine ? startLine + i : null;
    let tx = esc(t);
    hits.forEach(h => {
      const re = new RegExp('(' + h.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&') + ')', 'gi');
      tx = tx.replace(re, '<span class="hit">$1</span>');
    });
    return `<div class="row${hits.length && tx.includes('class="hit"') ? ' hl' : ''}">
      <span class="ln">${ln ?? ''}</span><span class="tx">${tx}</span></div>`;
  }).join('');
}
function openFile(f) {
  const hits = searchTerm ? [searchTerm] : [];
  const isRaw = f.start !== null && f.start !== undefined;
  const entry = FILEMAP.get(f.path);
  const refs = entry ? entry.nodes
    .map(id => byId.get(id))
    .filter(Boolean)
    .map(n => `${n.step} ${n.title}`) : [];
  viewer.className = 'col open';
  viewer.innerHTML = `
    <div class="v-head">
      <div class="v-path">${esc(f.path)}</div>
      ${f.note ? `<div class="v-note">${hlRef(f.note)}</div>` : ''}
      <div class="v-tags">
        <span class="tag">${isRaw
          ? `第 ${f.start}–${f.end} 行 / 共 ${f.total} 行`
          : `结构化视图 · 共 ${f.total} 行`}</span>
        ${isRaw && f.total ? `<span class="tag">偏移 ${((f.start - 1) / f.total * 100).toFixed(1)}%</span>` : ''}
      </div>
      <div class="v-src">来源：仓库真实文件，由 ${esc(META.source_script || 'build_facts.py')} 切片${
        refs.length ? ' ｜ 被 ' + refs.length + ' 个环节引用：' + refs.join('、') : ''}</div>
    </div>
    <pre class="code">${renderCode(f.text, isRaw ? f.start : 1, hits)}</pre>`;
  viewer.scrollTop = 0;
  if (hits.length) {
    const h = viewer.querySelector('.row.hl');
    if (h) h.scrollIntoView({block: 'center'});
  }
}
viewer.innerHTML = `<div class="v-empty">
  <div style="font-size:32px;opacity:.35">◲</div>
  <div>点任一文件卡片，这里显示它的真实原文</div>
  <div><kbd>←</kbd> <kbd>→</kbd> 切换环节 · <kbd>/</kbd> 搜索</div>
</div>`;

// ── search ────────────────────────────────────────────────
let searchTerm = '';
const searchBox = document.getElementById('search');
searchBox.addEventListener('input', () => {
  searchTerm = searchBox.value.trim().toLowerCase();
  filter();
});
function filter() {
  const t = searchTerm;
  document.querySelectorAll('.node-i').forEach(el => {
    if (el.classList.contains('file-i')) {
      const e = FILEMAP.get(el.dataset.path);
      const body = e ? (e.file.path + ' ' + (e.file.note || '') + ' ' + e.file.text).toLowerCase() : '';
      el.classList.toggle('hide', !!t && !body.includes(t));
      return;
    }
    const n = byId.get(el.dataset.id);
    if (!n) return;
    const body = hay(n) + ' ' + [...(n.reads || []), ...(n.writes || []), ...(n.files || [])]
      .map(f => f.path + ' ' + (f.note || '') + ' ' + f.text).join(' ').toLowerCase();
    el.classList.toggle('hide', !!t && !body.includes(t));
  });
  if (!t) return;
  // 搜到内容时自动跳到第一个真正命中**正文**的片段：
  // 用户搜的是现象，他想看的是代码里那一行，不是"哪个环节提到了这个词"
  for (const n of NODES) {
    const f = [...(n.reads || []), ...(n.writes || []), ...(n.files || [])]
      .find(f => f.text.toLowerCase().includes(t));
    if (f) { select(n.id); openFile(f); break; }
  }
}
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchBox) { e.preventDefault(); searchBox.focus(); }
  if (e.key === 'Escape') { searchBox.value = ''; searchTerm = ''; filter(); searchBox.blur(); }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && document.activeElement !== searchBox && current) {
    const i = order.indexOf(current.id);
    if (i < 0) return;
    const j = (i + (e.key === 'ArrowRight' ? 1 : -1) + order.length) % order.length;
    e.preventDefault(); select(order[j]);
  }
});

function select(id) {
  renderDetail(id);
  const el = document.querySelector(`.node-i[data-id="${id}"]`);
  if (el) el.scrollIntoView({block: 'nearest'});
}
select(order[0] || NODES[0].id);
</script>
</body>
</html>
