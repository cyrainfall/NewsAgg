# NewsAgg 写作风格配置
#
# 归属：本文件虽位于 .wewrite/（系统目录），但内容归本人所有，系统不直写（ADR-0018）。
# 系统只能把风格建议写入 reports/，由本人手工应用。
#
# 由风格访谈生成（ADR-0027 阶段 0 第 2 步）。
# 2026-10-21 改赛道（ADR-0050）：AI 与开发者工具 → AI 变现与开发者职业。
# 技术深度保留为**论证材料**，不再是选题主题；选题落点是钱与职业处境。

name: "淆雨学学"
industry: "AI 变现与开发者职业 · 技术深度作证据"
# 读者是「正在为钱或工作处境焦虑的技术人」，不是「想了解技术进展的人」。
# 前者会点开标题，后者在头条推荐流里根本看不到我们（ADR-0050）。
target_audience: "想靠 AI 多挣一份钱、或担心被 AI 改写职业处境的技术从业者、独立开发者、接单者"

# 内容方向（与 platforms/niche.txt 的赛道词一致，ADR-0050 改）
# 排序即倾向：越靠前越优先。技术类议题保留但排在钱与职业之后——
# 它们是**证据来源**，不是**选题落点**。
topics:
  - 个人 AI 变现与副业真实账本
  - 开发者职业处境与收入变化
  - AI 工具与岗位的替代/重定价
  - 模型价格战与单位成本
  - 技术行业观察（须落到钱或职业上，否则不写）

# 语气：专业分析起手，锐利收尾
tone: "专业分析但不说教；有明确判断，结尾锐利；不端着、不堆术语；愿意说'我不确定'"
voice: "第一人称，像一个踩过坑的从业者在复盘；判断用'我'，但不虚构个人经历"

# 字数：与 CONTEXT.md 定义的「文章」一致（约 1500 字）
word_count: "1200-1800"

content_style: "观点"

# 写作人格：industry-observer（对应 tone 的「专业/分析/深度/行业」）
writing_persona: "industry-observer"

# 禁忌（同时服务 ADR-0013 的平台合规门）
blacklist:
  words:
    - "震惊"
    - "必看"
    - "颠覆"
    - "史上最强"
    - "遥遥领先"
    - "不转不是中国人"
    - "赶紧收藏"
    - "绝了"
    - "太香了"
  topics:
    - "政治敏感"
    - "宗教"
    - "色情"
    - "赌博"
    - "地域歧视"

# 参考账号风格（用于校准，不复用其观点与句子）
reference_accounts:
  - "36氪"
  - "虎嗅"
  - "少数派"

# 排版主题：本项目发今日头条（非公众号），theme 仅影响 wewrite 的预览输出，
# 不参与头条发布。保持默认。
theme: "professional-clean"

# 封面：由 wewrite-visual 生成，失败回退模板拼图（ADR-0013）。
# 不使用新闻原图（版权风险，ADR-0013）。
cover_style: "简洁科技感，深色底，突出主题词；避免人脸与品牌 logo"
# 尺寸按头条要求（单图，建议 16:9）
cover_size: "1200x675"

author: "淆雨学学"
