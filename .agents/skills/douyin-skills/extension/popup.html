<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 240px;
        padding: 16px;
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 13px;
        color: #333;
        margin: 0;
      }
      h3 {
        margin: 0 0 12px;
        font-size: 14px;
        color: #111;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .label {
        color: #666;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 500;
      }
      .badge.ok {
        background: #e6f4ea;
        color: #1e8e3e;
      }
      .badge.err {
        background: #fce8e6;
        color: #c5221f;
      }
      .badge.loading {
        background: #f1f3f4;
        color: #888;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
      }
      .dot.ok {
        background: #1e8e3e;
      }
      .dot.err {
        background: #c5221f;
      }
      .dot.loading {
        background: #aaa;
      }
      .divider {
        border: none;
        border-top: 1px solid #eee;
        margin: 10px 0;
      }
      .hint {
        color: #999;
        font-size: 11px;
        line-height: 1.5;
      }
      .btn {
        width: 100%;
        padding: 6px 0;
        border: none;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        background: #1a73e8;
        color: #fff;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <h3>Douyin Bridge</h3>

    <div class="row">
      <span class="label">Bridge 连接</span>
      <span class="badge loading" id="bridge-status">
        <span class="dot loading" id="bridge-dot"></span>
        <span id="bridge-text">检测中...</span>
      </span>
    </div>

    <hr class="divider" />
    <p class="hint" id="hint">正在连接 bridge server...</p>
    <button class="btn" id="open-btn">打开创作服务平台</button>

    <script src="popup.js"></script>
  </body>
</html>
