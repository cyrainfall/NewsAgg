 \"stage\": \"memory\", \"message\": mem_msg},\n                         ensure_ascii=False, indent=2))\n        return 1\n\n    # ── 环境：ADR-0028 的 HOME 重定向（状态与浏览器缓存一起）──"}, {"path": ".agents/skills/newsagg-publish/scripts/publish.py", "start": 873, "end": 889, "note": "门 2", "total": 1161, "text": "        # ── 门 2：登录预检（只读，可重试；ADR-0011 + ADR-0030）──\n        # api 后端下这一步是 `GET /mp/agw/media/user_login_status_api`：\n        # 实测 0.69s，且**浏览器关着也能跑**（不需要 Playwright/Chromium）。\n        login_ok = False\n        for attempt in range(1, 4):\n            ok, kind, code = _login_probe(args.backend, args.account, env)\n            if ok:\n                login_ok = True\n                steps.append({\"step\": \"auth_check\", \"backend\": args.backend,\n                              \"attempt\": attempt, \"ok\": True})\n                break\n            steps.append({\"step\": \"auth_check\", \"backend\": args.backend,\n                          \"attempt\": attempt, \"ok\": False, \"kind\": kind, \"code\": code})\n            if kind == \"login_lost\":\n                break\n            time.sleep(5)\n        if not login_ok:"}, {"path": ".agents/skills/newsagg-publish/scripts/publish.py", "start": 1030, "end": 1042, "note": "门 5", "total": 1161, "text": "        # ── 门 5：反查验证（ADR-0024，仅真发时）──\n        if args.mode == \"publish\":\n            if code != 0:\n                if kind == \"concurrency\":\n                    # 并发冲突是瞬时竞态，但发布是写操作 → 不自动重试（ADR-0011）\n                    record[\"verdict\"] = \"unknown_needs_review\"\n                    record[\"note\"] = \"发布遇并发冲突，结果未知；按 ADR-0011 不重发，需回后台核实\"\n                elif kind == \"login_lost\":\n                    breaker.trip(\"login_lost\", {\"slug\": args.slug})\n                    record[\"verdict\"] = \"login_lost\"\n                else:\n                    record[\"verdict\"] = \"publish_failed\"\n                append_ledger(ledger, record)"}, {"path": ".agents/skills/newsagg-publish/scripts/publish.py", "start": 143, "end": 196, "note": "FileLock 的陈旧锁处理", "total": 1161, "text": "class FileLock:\n    \"\"\"跨进程串行锁（ADR-0030）。\n\n    关于陈旧锁：不能只检查文件存在性——进程崩溃会留下永久锁。\n    因此记录 pid，并用 kill(pid, 0) 判断持有者是否仍存活。\n    \"\"\"\n\n    def __init__(self, path: Path, timeout: float = 300.0, poll: float = 2.0):\n        self.path = path\n        self.timeout = timeout\n        self.poll = poll\n\n    def _holder_alive(self) -> bool:\n        try:\n            data = json.loads(self.path.read_text(encoding=\"utf-8\"))\n            pid = int(data.get(\"pid\", 0))\n        except (json.JSONDecodeError, OSError, ValueError, TypeError):\n            return False  # 无法解析 → 视为陈旧\n        if pid <= 0:\n            return False\n        try:\n            os.kill(pid, 0)\n            return True\n        except (ProcessLookupError, PermissionError):\n            return False\n\n    def __enter__(self):\n        deadline = time.monotonic() + self.timeout\n        while True:\n            try:\n                self.path.parent.mkdir(parents=True, exist_ok=True)\n                fd = os.open(self.path, os.O_CREAT | os.O_EXCL | os.O_WRONLY)\n                os.write(\n                    fd,\n                    json.dumps({\"pid\": os.getpid(), \"at\": datetime.now(CST).isoformat()}).encode(),\n                )\n                os.close(fd)\n                return self\n            except FileExistsError:\n                if not self._holder_alive():\n                    try:\n                        self.path.unlink()\n                        continue  # 陈旧锁，立即重试\n                    except OSError:\n                        pass\n                if time.monotonic() >= deadline:\n                    raise TimeoutError(f\"等待浏览器锁超时（{self.timeout}s）：{self.path}\")\n                time.sleep(self.poll)\n\n    def __exit__(self, *exc):\n        try:\n            self.path.unlink()\n        except OSError:\n            pass"}]}, {"id": "n12-writeback", "step": "⑥", "title": "认知写回", "layer": "sediment", "when": "发布成功之后（仅真实发布，dry-run 跳过）", "actor": "脚本", "one_liner": "把这一轮的事件、新进展、依据追加回承接卡，让认知资产生长。", "does": ["追加一条 covered_events（含日期与事件描述）——这是下一步防重复发文的依据。", "把 whats_new 作为未复核修订追加进修订史，带来源文章 slug，你可以推翻。", "同日 + 同事件前缀已存在则幂等跳过，避免一次事件写回两次。", "更新 frontmatter 的 last_written 日期。"], "why": ["ADR-0007：观点卡只追加不重建，是认知资产的组成单位。", "ADR-0026：写回必须在发布成功之后——没发出去的文章不能占用「已覆盖」的位置。", "这是 ③c 将来能判清 skip/continue 的唯一数据来源；写不进去就等于这一轮白写。"], "reads": [{"path": ".newsagg/triage/2026-10-31-decision.json", "start": null, "end": null, "note": "card_file / whats_new / key_evidence", "total": 35, "text": "{\n  \"decision\": {\n    \"action\": \"continue\",\n    \"card_file\": \"personal-ai-monetization-is-paid-demand-not-technology.md\",\n    \"whats_new\": \"本卡此前证明「技术不构成差异、决定可行性的是付费需求」，今天补上付费需求这一侧的机制：它的天花板由**谁在替用户付钱**决定，不由作品质量决定，也不只是「有免费替代品」这么简单。同一周两个对照：国内首部 AI 院线电影《三星堆：未来往事》成本千万级，上映超一周票房不足 150 万、上座率约 1%、片方分账几十万，已把结算标准降到 20 元、分账从 43:57 让到 40:60 仍未换来票房；芒果 TV 首部 AI 剧集《后西游记》放卫视与会员里免费，股价几天涨五成。但这两个案例不能读成「收费就死」——它们差了四样（谁掏成本、走什么渠道、卖给谁、钱从哪回来），免费那头**从没问过观众价**，它只证明有人愿意出钱把价格按住，而那个人不是观众。按价的人在上游：红果日活 1.68 亿（原文口径：比四家长视频加起来还多）、一季度全网十二万多部微短剧里九成五以上是 AI 短剧，而免费是它的核心商业模式、靠广告赚钱，内容卖多少钱它不在乎。于是先崩的是**批发价**（平台付创作者的分成，万播收益从去年三五十元掉到个位数，供给曲线即可解释），**零售价**（观众那侧）才由 150 万票房与免费剧热度共同指向。本卡要补的判据因此是：锚点不是零而是「接近零」，妙鸭把锚从照相馆几百块拉到 AI 写真几块钱，几块钱仍有人买、日活到过 60 万——缝还在，只是很窄；而真正按住价格的是补贴者，不是免费。\",\n    \"confidence\": 0.82,\n    \"money_point\": \"① 做 C 端 AI 内容的独立开发者——先看分发，别先看质量：谁替你付钱（平台补贴、广告分成、投资人）？没人替你付，这个价格就不是你定的，只能去找愿意自己掏钱的场景，或改卖交付。② 接 AI 商单的外包——批发价已经崩到你这层：客户会拿「万播才几块钱」压你的报价，报价单上要写清「生成正在趋零，责任没有」，你卖的是交付与售后。③ 自己掏钱买 AI 订阅/API 的团队——别被「免费」吓住：妙鸭把锚从照相馆几百块拉到几块钱，几块钱也有人买、日活 60 万，锚点是「接近零」而非零，中间还留着一道缝。\",\n    \"event\": {\n      \"summary\": \"国内首部 AI 院线电影《三星堆：未来往事》上映超过一周，票房不足 150 万元，上座率基本在 1% 上下，豆瓣尚未开分；制作成本千万级，片方分账至今仅几十万元。片方已做让利：采用 20 元票房结算标准（低于传统电影），并把分账比例从常见的 43:57 调整为 40:60 主动让出 3 个百分点争取排片，仍未换来票房。对照同期的另一个 AI 内容项目：芒果 TV 首部 AI 剧集《后西游记》8 月底登湖南卫视黄金档，同样被吐槽画面不稳、表情僵硬，但因卫视与会员**免费**可见，热度与话题都不缺，芒果超媒股价几天涨了五成。上游机制是免费供给的规模：红果日活已达 1.68 亿、超过四家长视频之和，今年一季度全网上线微短剧 12 万多部、九成五以上是 AI 短剧，而免费本身就是红果的核心商业模式；观众在免费池里刷了大半年，对 AI 内容的价值判断定型为「免费、刷完即走」。价格因此向下传递：AI 短剧的万播收益从去年的三五十元至上百元，掉到今年的个位数。文章引行为经济学的价格锚定解释：人判断一件东西值多少钱，取决于他最早、最常见到的价格，而国内观众对 AI 内容的锚点就是零，且模型越进步、生成成本越低，免费供给只会更多更像样。\",\n      \"members\": [\n        \"36kr《首部AI电影的惨败真相：当下观众对AI内容的价格锚点就是零》（壹娱观察，2026-10-30 20:31，rank 30/50，climbing）\",\n        \"36kr《造梦在云端，赚钱在人间》（rank 32/50，climbing，同一议题的另一入口，未取为证据）\"\n      ],\n      \"hot\": null,\n      \"trend\": \"climbing\"\n    },\n    \"ranking_note\": \"本轮 trend 信息量充足（63/159 可算：climbing 38、steady 24、cooling 1、absent 63、unknown 33），**采纳了 climbing 优先**：胜出簇两条候选均为 climbing（36kr 30/50、32/50）。但真正决定排序的不是 trend，是冷却期清走了两个更热的选项：`ai-capital-pricing-shifts-to-unit-economics`（1.88 天）挡掉了 DeepSeek 第二轮融资 1055 亿/估值 6155 亿（ithome 5/48）与英伟达市值蒸发 1.4 万亿（头条 hot 813 万）；`llm-price-war-signals-commoditization`（2.88 天）挡掉了本轮最贴读者钱包的一组——《我算了笔账：AI 编程工具一年烧掉两台 MacBook》（掘金 13/50，climbing）加《Claude套餐大升级！Max 20x 升级为 Ultra，5 小时限额直接取消》（36kr 7/50）：Cursor 新用户中档 $20→$30、Codex 老 Pro 订阅 10-30 起额度缩水不降价、Claude 反向送等额 API 额度，一年重度双开 $4,800≈3.45 万元。这组明天就解锁，已记入简报备选。胜出簇的取舍理由：它是本轮唯一「有机制、有对照、有向下传导的价格数字」的簇——同一批 AI 生成能力，免费端爆、收费端死，这比单看一个票房数字有信息量。\"\n  }\n}"}], "writes": [{"path": "knowledge/cards/personal-ai-monetization-is-paid-demand-not-technology.md", "start": 2, "end": 14, "note": "写回后的 frontmatter", "total": 136, "text": "issue: 个人 AI 变现能不能赚钱由付费需求决定，不由技术决定\nstatus: active\ncreated: 2026-10-17\nlast_written: 2026-10-31\ncovered_events:\n  - 2026-10-18 个人 AI 变现出现正反两组可核对账本：Mole 从开源工具走到付费桌面版（用户主动要求付费）、拼豆 App 三个月 43 美元且 93% 付费用户次月流失；同期「陶华碧靠 AI 赚 54 亿」被事实核查（营收非利润、AI 只是质检、营收回升靠换回本地辣椒）\n  - 2026-10-25 个人 AI 变现第一次有了基数，而这个基数把「AI」这个变量从等式里划掉了：TrustMRR 抓取的 10,150 个真实收款产品里，AI 产品与非 AI 产品有收入的比例几乎一样（49.3% 对 49.0%，中位月收入 161 对 175 美元），只有 2.4% 做到年化 10 万美元，Top 1% 拿走 76.1% 的收入；细分到开发者工具，69% 一分钱没收到。与此同时，同一批数据给出了窗口为什么存在、又为什么会关：AI 让生产成本每年降约 10 倍，而客户的价格锚还停在「要请人做」的年代，中间的差额就是毛利窗口——窗口关闭不是因为技术退步，是因为价格锚被更新（妙鸭相机从「照相馆几百块」被拉到「AI 写真几块钱」，不到两年团队解散）。同一天池子里还有一份一手个案给这组数据配了注脚：一位开发者用 AI 独立做出一款零依赖、188 个测试全绿、工期压到四分之一的游戏，可交付性被拉满，而仓库 1 个 Star、直接收入 0 元、打赏为零。\n  - 2026-10-31 国内首部 AI 院线电影《三星堆：未来往事》上映超过一周，票房不足 150 万元，上座率基本在 1% 上下，豆瓣尚未开分；制作成本千万级，片方分账至今仅几十万元。片方已做让利：采用 20 元票房结算标准（低于传统电影），并把分账比例从常见的 43:57 调整为 40:60 主动让出 3 个百分点争取排片，仍未换来票房。对照同期的另一个 AI 内容项目：芒果 TV 首部 AI 剧集《后西游记》8 月底登湖南卫视黄金档，同样被吐槽画面不稳、表情僵硬，但因卫视与会员**免费**可见，热度与话题都不缺，芒果超媒股价几天涨了五成。上游机制是免费供给的规模：红果日活已达 1.68 亿、超过四家长视频之和，今年一季度全网上线微短剧 12 万多部、九成五以上是 AI 短剧，而免费本身就是红果的核心商业模式；观众在免费池里刷了大半年，对 AI 内容的价值判断定型为「免费、刷完即走」。价格因此向下传递：AI 短剧的万播收益从去年的三五十元至上百元，掉到今年的个位数。文章引行为经济学的价格锚定解释：人判断一件东西值多少钱，取决于他最早、最常见到的价格，而国内观众对 AI 内容的锚点就是零，且模型越进步、生成成本越低，免费供给只会更多更像样。\nsource: 用户指定建卡（2026-10-17），并提供了评估框架\n---\n# 个人 AI 变现能不能赚钱由付费需求决定，不由技术决定\n\n## 当前判断"}], "files": [{"path": ".agents/skills/newsagg-triage/scripts/writeback.py", "start": 1, "end": 13, "note": "设计依据：covered_events 与 last_written 是关键字段", "total": 178, "text": "#!/usr/bin/env python3\n\"\"\"认知写回：发布成功后向观点卡追加一条修订（ADR-0026 循环 A）。\n\n设计依据：\n- ADR-0007 卡片结构：当前判断 / 依据事实 / 修订史 / covered_events\n- ADR-0026 循环 A：写回**不阻塞**，但带**未复核**标记与来源；本人可推翻\n- ADR-0026：`covered_events` 与 `last_written` 是防重复发文的关键字段\n  （前者让下次能判「跳过 vs 续写」，后者决定冷却期）\n- ADR-0018：knowledge/cards/ 由系统写；但仅追加，不改写旧判断\n\n本脚本只做追加（确定性工作）。不判断该不该写回——那是分拣决策的事。\n\"\"\"\nfrom __future__ import annotations"}, {"path": ".agents/skills/newsagg-triage/scripts/writeback.py", "start": 57, "end": 69, "note": "空列表展开的处理", "total": 178, "text": "def append_covered_event(raw_fm: str, event_desc: str, date: str) -> str:\n    \"\"\"向 covered_events 追加一条。空列表写成 [] 时需展开。\"\"\"\n    entry = f\"  - {date} {event_desc}\"\n    # 情形一：covered_events: []  → 展开成多行\n    if re.search(r\"^covered_events:\\s*\\[\\]\\s*$\", raw_fm, re.M):\n        return re.sub(r\"^covered_events:\\s*\\[\\]\\s*$\",\n                      \"covered_events:\\n\" + entry, raw_fm, count=1, flags=re.M)\n    # 情形二：已有列表 → 在其末尾追加\n    m = re.search(r\"^(covered_events:\\s*)$((?:\\n\\s+-\\s+.*)*)\", raw_fm, re.M)\n    if m:\n        insert_at = m.end(2)\n        return raw_fm[:insert_at] + \"\\n\" + entry + raw_fm[insert_at:]\n    # 情形三：字段不存在 → 追加字段"}, {"path": ".agents/skills/newsagg-triage/scripts/writeback.py", "start": 115, "end": 125, "note": "幂等保护", "total": 178, "text": "    # ── 幂等保护（ADR-0026 的同构要求）──\n    # 与\"风格学习需按版本去重\"同理：同一次事件被写回两次，会让 covered_events\n    # 出现重复条目，从而污染「跳过 vs 续写」的判定——分拣会以为写过两次。\n    # 判据：同日 + 同事件（前缀匹配）已存在于 covered_events。\n    event_key = args.event[:24]\n    for e in (fm.get(\"covered_events\") or []):\n        if str(e).startswith(date) and event_key in str(e):\n            print(json.dumps({\n                \"ok\": True, \"skipped\": True, \"reason\": \"该事件已在 covered_events 中（幂等保护）\",\n                \"card\": args.card, \"date\": date, \"matched\": str(e),\n            }, ensure_ascii=False, indent=2))"}, {"path": ".agents/skills/newsagg-collect/scripts/run_all.sh", "start": 936, "end": 956, "note": "编排器：失败不阻塞发布，但须人工补", "total": 972, "text": "# ── ⑥ 认知写回（ADR-0026：必须在发布成功之后）────────────────────\nif [[ \"$MODE\" == \"publish\" ]]; then\n  if [[ -n \"$CARD\" ]]; then\n    log \"⑥ 认知写回（追加未复核修订到 ${CARD}）\"\n    WB_ARGS=(--card \"$CARD\" --event \"$(dec_field event.summary)\" --article \"$SLUG\" --date \"$DATE\")\n    [[ -n \"$(dec_field whats_new)\" ]] && WB_ARGS+=(--judgment \"$(dec_field whats_new)\")\n    [[ -n \"$(dec_field event.key_evidence)\" ]] && WB_ARGS+=(--evidence \"$(dec_field event.key_evidence)\")\n    if \"$PY\" .agents/skills/newsagg-triage/scripts/writeback.py \"${WB_ARGS[@]}\"; then\n      echo \"写回完成（带未复核标记，你可推翻）\"\n    else\n      echo \"[X] 写回失败——认知资产本轮未生长（不阻塞发布，但须人工补）\" >&2\n      write_status 1 \"writeback_failed\" \"写回失败\" \"$CARD\"\n    fi\n  else\n    echo \"（决策未给出 card_file，跳过写回）\"\n  fi\nelse\n  echo \"（dry-run：跳过 ⑥ 认知写回——写回只发生在真实发布成功之后）\"\nfi\n\nlog \"⑦⑧ 简报与同步\""}]}, {"id": "n13-brief-push", "step": "⑦⑧⑨", "title": "账本归档 + 简报 + commit/push", "layer": "orchestrate", "when": "第 3 段结尾（成功与失败都走）", "actor": "脚本", "one_liner": "先把账本同步成入库归档，再渲染成人看的五段式简报，最后提交推送。", "does": ["run-status.json：无论成败都先落一份「这一轮跑到哪、为什么停」。", "先把运行时账本同步成入库归档（reports/publish-ledger.jsonl），因为简报要读的是合并视图。", "brief.py 读当日全部产物渲染五段：① 今日结论 ② 采集分拣概览 ③ 本篇与发布结果 ④ 资产变动 ⑤ 需你介入的事项。", "④ 段读**台账**算卡库两条线：到期议题（该建没建）与退役候选（建了 30 天没接住）；没有就印「无」，证明查过。", "⑤ 段把信源健康读回来，且**只在状态变化时展开**——每天必然出现的告警会被整段略过。", "缺哪个阶段的文件就按「该阶段未运行」呈现，不报错——简报必须无条件每日存在。", "sync_push：git add -A → commit → push 当前分支；push 走代理失败时直连重试一次。", "降级轮不 push：不知道远端有没有新提交，盲目 push 可能被拒。"], "why": ["ADR-0074：账本分运行时（不入库）与归档（入库）两份。没有归档，换机器就看不出平台作品与本地成稿的关联——实测 11 篇只匹配 9 篇。", "ADR-0038：任何失败都必须出简报。`.newsagg/` 不入库、看守读不到它，所以成败由简报呈现给人。", "ADR-0006：简报是心跳不是可选报告。一份写明「本轮运行未完成」的简报比没有简报更有信息量。", "ADR-0019：五段结构的存在是为了让「今日无选题」「弃权」「系统没跑」三者可区分。", "ADR-0092：台账早就接上了，但接的是摘要——到期线与退役线在生产里从没印过。机制不响等于没有机制。"], "reads": [{"path": ".newsagg/run-status.json", "start": null, "end": null, "note": "运行状态（① 段优先读它）", "total": 9, "text": "{\n  \"ok\": true,\n  \"at\": \"2026-10-31T21:56:02.917170+08:00\",\n  \"date\": \"2026-10-31\",\n  \"mode\": \"publish\",\n  \"stage\": \"complete\",\n  \"reason\": \"运行完成\",\n  \"detail\": \"slug=2026-10-31-ai-content-price-anchor-is-zero mode=publish\"\n}"}, {"path": ".newsagg/performance-status.json", "start": null, "end": null, "note": "表现读回结果（⑤ 段）", "total": 32, "text": "{\n  \"ok\": true,\n  \"at\": \"2026-10-31T21:00:22.769087+08:00\",\n  \"parse\": {\n    \"backend\": \"api\",\n    \"count\": 14,\n    \"source\": \"api_article_list\",\n    \"drafts_skipped\": 4\n  },\n  \"articles_on_platform\": 14,\n  \"articles_matched\": 14,\n  \"weitoutiao_matched\": \"…(0 项)\",\n  \"unmatched\": \"…(0 项)\",\n  \"new_records\": 14,\n  \"updated_records\": 0,\n  \"store\": \"reports\\\\performance.jsonl\",\n  \"fetch\": {\n    \"backend\": \"api\",\n    \"count\": 14,\n    \"source\": \"api_article_list\",\n    \"drafts_skipped\": 4\n  },\n  \"detail\": {\n    \"requested\": 14,\n    \"backend\": \"api\",\n    \"source\": \"api_item_info\",\n    \"got\": 14,\n    \"no_data\": [],\n    \"failed\": []\n  },\n  \"cookie_expiry\": {}\n}"}, {"path": ".newsagg/publish-ledger.jsonl", "start": null, "end": null, "loc": "第 6 证明的验证到哪一步，都需要原文才能判断。接得住它的 `ai-productivity-claims-lack-reproducible-benchmarks` 可用，但我不想在没有原文的情况下把「评测不可信」再写一遍——10-29 和 10-30 两篇已经在讲同类机制，连写三篇会变成同一个判断的复读。\n"}], "files": [{"path": ".agents/skills/newsagg-collect/scripts/run_all.sh", "start": 301, "end": 325, "note": "运行时账本 → 入库归档（幂等，失败不阻塞）", "total": 972, "text": "sync_ledger_archive() {\n  if [[ -n \"$NO_GIT\" ]]; then echo \"（--no-git：跳过账本归档）\"; return 0; fi\n  \"$PY\" - <<'PY'\nimport sys\nsys.path.insert(0, \".agents/lib\")\ntry:\n    import publish_ledger as pl\nexcept Exception as exc:\n    print(f\"[!] 账本归档跳过：模块加载失败（{exc}）\")\n    raise SystemExit(0)\ntry:\n    res = pl.sync_archive(pl.repo_root())\nexcept Exception as exc:\n    print(f\"[!] 账本归档跳过：{exc}\")\n    raise SystemExit(0)\nprint(f\"  账本归档：运行时 {res['runtime_records']} 条 + 归档 {res['archive_records_before']} 条 \"\n      f\"→ 合并 {res['merged']} 条，写入 {res['written']} 条\"\n      + (f\"（跳过 {res['skipped_for_credentials']} 条：含凭证）\"\n         if res[\"skipped_for_credentials\"] else \"\"))\nPY\n}\n\nsync_push() {  # $1 = 附加到提交信息的一行\n  if [[ -n \"$NO_GIT\" ]]; then echo \"（--no-git：跳过 commit/push）\"; return 0; fi\n  git add -A"}, {"path": ".agents/skills/newsagg-brief/scripts/brief.py", "start": 321, "end": 343, "note": "① 段：运行失败优先于一切", "total": 1201, "text": "def section_conclusion(decision, publish_recs, date: str, perf: dict | None = None,\n                       run_status: dict | None = None) -> list[str]:\n    out = [\"## ① 今日结论\", \"\"]\n    d = unwrap(decision)\n\n    # 运行失败优先于一切：此时\"没发布\"不是判断，是故障。\n    rs = run_status or {}\n    if rs and not rs.get(\"ok\"):\n        # 例外（2026-10-31 实测）：`daily_limit` 不是故障，是闸门按设计拒绝。\n        # 它此前被渲染成「系统在运行途中失败了」，而 ⑤ 还写着「修复后重跑」——\n        # 照那句话走只有两种结局：重跑仍被拦（白跑一轮），或去掉闸门变成\n        # 重复发文（ADR-0059 的教训）。设计内的拒绝必须与故障分开报。\n        if str(rs.get(\"stage\") or \"\") == \"daily_limit\":\n            out += [\"**今日额度已用尽，本轮未发布**（ADR-0014：每个日历日最多 1 篇）。\",\n                    \"\",\n                    \"> 这是闸门按设计拦下的，**不是故障，也不是弃权** ion is not None,\n        \"has_candidates\": cand is not None,\n        \"publish_records\": len(publish_recs),"}, {"path": ".agents/skills/newsagg-collect/scripts/run_all.sh", "start": 323, "end": 343, "note": "提交与推送，含降级不 push 分支", "total": 972, "text": "sync_push() {  # $1 = 附加到提交信息的一行\n  if [[ -n \"$NO_GIT\" ]]; then echo \"（--no-git：跳过 commit/push）\"; return 0; fi\n  git add -A\n  if git diff --cached --quiet; then\n    echo \"无改动可提交\"\n  else\n    if git commit -q -m \"NewsAgg 无人值守运行 ${DATE}（${MODE}）\" -m \"${1:-}\"; then\n      echo \"已提交 $(git rev-parse --short HEAD)\"\n    else\n      echo \"[X] commit 失败\" >&2; return 1\n    fi\n  fi\n  # 降级轮不 push：① 没拉到远端，我们不知道远端有没有新提交，push 可能被拒；\n  # 也可能把本地「没 rebase 过」的历史直接推上去。本地已提交，产出不会丢，\n  # 等你在有网络时 push 一次即可（简报⑤段会写明这件事）。\n  if [[ \"${PULL_DEGRADED:-0}\" == \"1\" ]]; then\n    echo \"[!] 跳过 push：本轮未能从远端同步（网络不可达），远端状态未知。改动已本地提交，交人工 push（ADR-0061）\" >&2\n    return 1\n  fi\n  if git push -u origin \"$BRANCH\" >/tmp/newsagg-push.out 2>&1; then\n    echo \"已推送 origin/${BRANCH}\""}, {"path": ".agents/lib/publish_ledger.py", "start": 1, "end": 26, "note": "为什么账本必须是两份（运行时 + 入库归档）", "total": 284, "text": "\"\"\"发布账本的跨环境读取与归档（ADR-0074）。\n\n## 背景：为什么需要这个模块\n\n`.newsagg/publish-ledger.jsonl` 是**唯一**把平台上的作品关联回本地成稿的\n东西——决策文件是运行时状态、成稿标题可能被本人改过，只有账本记着发布\n当时发生了什么（GLOSSARY「发布账本」条）。它有两个字段承担这条关联：\n`title_on_platform`（平台实际收到的标题）与 `gid`（平台分配的唯一标识）。\n\n但它此前**不入库**（`.gitignore:48` 排除整个 `.newsagg/`），于是：\n\n    本机   from_ledger: 12  → 11 篇全部匹配\n    服务器 from_ledger: 0   → 11 篇只匹配 9 篇\n\n两篇对不上的原因不是 bug，是**服务器没有账本**：\n\n1. `outputs/2026-10-14-gemini4-price-war.md` 的 H1 后来被改过（ADR-0026\n   循环 B 的改稿飞轮），平台上还是旧标题「模型打五折，未必是好事」；\n2. 头条输入框会吞字（ADR-0051），账本里的 `title_on_platform` 才是平台\n   真正收到的标题，成稿文件里没有这个信息。\n\nADR-0027 决策四「本地与服务器各自持有运行时状态」在「主环境从本地切到\n服务器」这个场景下暴露了缺口：运行时状态里有一项**不是**可重建的缓存。\n\n## 做法：运行时账本 + 入库归档\n"}]}, {"id": "n14-failsoft", "step": "✗", "title": "失败通道 fail_soft", "layer": "gate", "when": "任意环节失败", "actor": "脚本", "one_liner": "任何一步失败：写失败状态 → 出简报 → 提交推送 → exit 1。绝不静默跳过。", "does": ["write_status(ok=0, stage, reason, detail)：detail 保留最后 2000 字。", "degraded 是第三种状态：跑完了但有让步，不让看守告警但必须让人看见。", "「今日额度已用」走同一通道但 stage=daily_limit：它是**设计内的拒绝**，不是故障。", "brief_now 无条件执行；allow_push=0 时（远端状态不明/工作区脏）不 push，交人工处置。"], "why": ["ADR-0038：失败必须出简报，否则看守无法区分「系统没跑」与「跑了一半」。", "ADR-0093：闸门拒绝与运行失败必须分开报——混在一起时简报会写出「修复后重跑」这种导致重复发文的建议。", "ADR-0028：命令成功与否一律看退出码，不经管道——管道会掩码退出码。"], "reads": [], "writes": [{"path": ".newsagg/run-status.json", "start": null, "end": null, "note": "失败样本字段", "total": 9, "text": "{\n  \"ok\": true,\n  \"at\": \"2026-10-31T21:56:02.917170+08:00\",\n  \"date\": \"2026-10-31\",\n  \"mode\": \"publish\",\n  \"stage\": \"complete\",\n  \"reason\": \"运行完成\",\n  \"detail\": \"slug=2026-10-31-ai-content-price-anchor-is-zero mode=publish\"\n}"}], "files": [{"path": ".agents/skills/newsagg-collect/scripts/run_all.sh", "start": 359, "end": 375, "note": "统一失败出口", "total": 972, "text": "fail_soft() {  # $1 stage  $2 reason  $3 detail  $4 allow_push(1/0)\n  local stage=\"$1\" reason=\"$2\" detail=\"${3:-}\" allow_push=\"${4:-1}\"\n  printf '\\n[X] %s：%s\\n' \"$stage\" \"$reason\" >&2\n  write_status 0 \"$stage\" \"$reason\" \"$detail\"\n  brief_now\n  if [[ \"$allow_push\" == \"1\" ]]; then\n    sync_push \"运行在「${stage}」阶段失败：${reason}\" \\\n      || echo \"（产出仍留在本地，未同步到远端）\" >&2\n  else\n    echo \"（未 push：远端状态不明或工作区不干净，交人工处置）\" >&2\n  fi\n  exit 1\n}\n\ndec_field() {  # $1 = 键路径；$2 = 列表分隔符（默认换行）。先在 decision 对象里找，再回退到顶层（abstain_reason 等）\n  DEC=\"$DEC\" FIELD=\"$1\" FIELD_SEP=\"${2-$'\\n'}\" \"$PY\" - <<'PY'\nimport json, os"}, {"path": ".agents/skills/newsagg-collect/scripts/run_all.sh", "start": 917, "end": 931, "note": "只认 daily_limit 这一个 stage：设计内拒绝，与失败分开报", "total": 972, "text": "PUB_RC=${PIPESTATUS[0]}\nset -e\nif [[ $PUB_RC -ne 0 ]]; then\n  # 闸门不是故障（2026-10-31 实测）：publish.py 拒绝发布会打印\n  # `{\"ok\": false, \"stage\": \"daily_limit\", ...}`，而这里原先只看退出码，\n  # 于是「今日额度已用」被渲染成「系统运行途中失败了」，简报⑤还教人\n  # 「修复后重跑」——重跑仍被拦，照它把闸门去掉 ING\"\n            exit 1"}, {"path": ".github/workflows/newsagg-tests.yml", "start": 1, "end": 13, "note": "为什么单独建这个工作流", "total": 112, "text": "name: NewsAgg 测试\n\n# 设计依据 ADR-0056：仓库此前**没有任何测试文件**，第一个测试套件是随「位次趋势」\n# 一起建的（tests/，标准库 unittest，32 个用例）。本工作流是它的**唯一消费者**。\n#\n# 为什么要单独建这个工作流，而不是靠\"记得手动跑\"：\n# 这正是本仓库反复记录的失败形状——**记录了但没有消费者**。ADR-0038 的\n# `hot_history` 被采集层记了三天却没人读（DESIGN.md 残余风险 18）；ADR-0042 的\n# 三份 `parse_frontmatter` 漂移后没人发现；ADR-0054 的字段名漂移只让简报少显示\n# 一行、退出码仍是 0。一份没人跑的测试与没有测试等价，而且**更糟**：它让人以为\n# 有回归保护。把 `python3 -m unittest discover` 交给 CI 执行，\"跑没跑\"就不再依赖\n# 人的记忆。\n#"}, {"path": ".github/workflows/newsagg-tests.yml", "start": 29, "end": 41, "note": "两个真实解释器都要测", "total": 112, "text": "  # 两个版本都在生产路径上，所以两个都要测——只测一个等于只保护一半链路。\n  # 3.9 尤其重要：它是**下限**，用了 3.10+ 语法（如运行期求值的 `X | None`）会\n  # 在服务器上直接崩，而本机开发用的 3.12 不会报错。\n  unittest:\n    runs-on: ubuntu-latest\n    strategy:\n      fail-fast: false\n      matrix:\n        python-version: [\"3.9\", \"3.12\"]\n    steps:\n      - name: 取仓库内容\n        uses: actions/checkout@v4\n        with:"}]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('payload').textContent);
const NODES = DATA.nodes, META = DATA.meta || {}, GROUPS = DATA.groups || [];
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hlRef = s => esc(s).replace(/(ADR-\d{4})/g, '<span class="adr">$1</span>');

// 分组完全由 facts 决定：没写 groups 就按 nodes 原顺序平铺成一组。
// 这样事实层可以表达"白天已跑过三次"这种时间倒错的真实顺序，
// 而不必迁就代码里的声明顺序。
const G = GROUPS.length ? GROUPS : [{title: '执行流', ids: NODES.map(n => n.id)}];
const byId = new Map(NODES.map(n => [n.id, n]));
const placed = new Set();

document.title = (META.title || 'Repo') + ' · 工作过程可视化';
document.getElementById('metaline').textContent =
  `${META.date || '—'} 实例 · 摘录实读自仓库，行号为真实行号`;
document.getElementById('statsline').innerHTML =
  (META.stats || []).map(([k, v]) => `${esc(k)} <b>${esc(String(v))}</b>`).join(' · ');

// ── rail ──────────────────────────────────────────────────
const rail = document.getElementById('rail');
const order = [];
G.forEach(g => {
  const ns = g.ids.map(id => byId.get(id)).filter(Boolean);
  ns.forEach(n => { order.push(n.id); placed.add(n.id); });
  if (!ns.length) return;
  const box = document.createElement('div');
  box.className = 'group';
  box.innerHTML = `<div class="group-t">${esc(g.title)}</div>`;
  ns.forEach(n => box.appendChild(nodeEl(n)));
  rail.appendChild(box);
});
// 没被任何 group 收走的节点单独兜底 —— 漏配分组不该让节点凭空消失
const orphans = NODES.filter(n => !placed.has(n.id));
if (orphans.length) {
  const box = document.createElement('div');
  box.className = 'group';
  box.innerHTML = `<div class="group-t">其他环节</div>`;
  orphans.forEach(n => box.appendChild(nodeEl(n)));
  rail.appendChild(box);
}

function hay(n) {
  return [n.step, n.title, n.one_liner, n.actor, n.when,
    ...(n.does || []), ...(n.why || [])].filter(Boolean).join(' ').toLowerCase();
}
function nodeEl(n) {
  const d = document.createElement('div');
  d.className = 'node-i';
  d.dataset.layer = n.layer || '';
  d.dataset.id = n.id;
  d.dataset.search = hay(n);
  d.innerHTML = `<div class="step">${esc(n.step || '·')}</div>
    <div class="nm">${esc(n.title)}<small>${esc((n.when || '').split('（')[0])}</small></div>`;
  d.onclick = () => select(n.id);
  return d;
}

// ── 文件索引（反向视图：这个文件被谁用）────────────────────
// 正向视图回答"这一环节读了什么"，反向视图回答"这个文件归谁管"。
// 后者在排查"改这里会影响什么"时才真正被需要，成本却只是多建一个 Map。
const FILEMAP = new Map();
NODES.forEach(n => {
  [...(n.reads || []), ...(n.writes || []), ...(n.files || [])].forEach(f => {
    if (!FILEMAP.has(f.path)) FILEMAP.set(f.path, {file: f, nodes: []});
    const e = FILEMAP.get(f.path);
    if (!e.nodes.includes(n.id)) e.nodes.push(n.id);
  });
});
const FILELIST = [...FILEMAP.entries()].sort((a, b) => a[0].localeCompare(b[0]));
(function () {
  const box = document.createElement('div');
  box.className = 'group';
  box.innerHTML = `<div class="group-t">文件索引 · ${FILELIST.length} 个文件</div>`;
  FILELIST.forEach(([path, e]) => {
    const d = document.createElement('div');
    d.className = 'node-i file-i';
    d.dataset.layer = 'file';
    d.dataset.path = path;
    d.dataset.search = path.toLowerCase();
    const base = path.split('/').pop();
    const dir = path.includes('/') ? path.slice(0, path.lastIndexOf('/')) : '';
    d.innerHTML = `<div class="step">◦</div>
      <div class="nm">${esc(base)}<small>${esc(dir)} · ${e.nodes.length} 处引用</small></div>`;
    d.onclick = () => {
      document.querySelectorAll('.node-i').forEach(x => x.classList.remove('on'));
      d.classList.add('on');
      openFile(e.file);
    };
    box.appendChild(d);
  });
  rail.appendChild(box);
})();

// ── detail ────────────────────────────────────────────────
const detail = document.getElementById('detail');
let current = null;

function fileCard(f, rw, key) {
  const where = f.start
    ? `${f.path}<span class="fc-lines">:${f.start}${f.end !== f.start ? '-' + f.end : ''}</span>`
    : `${f.path}<span class="fc-lines">· ${f.loc ? f.loc.split(' / ')[0] : '结构化'}</span>`;
  return `<div class="fcard" data-key="${key}">
    <div class="fc-top">
      <span class="fc-ico">${rw === 'r' ? '◂' : rw === 'w' ? '▸' : '·'}</span>
      <span class="fc-path">${esc(where)}</span>
      ${rw === '-' ? '' : `<span class="badge-rw ${rw}">${rw === 'r' ? '读' : '写'}</span>`}
    </div>
    <div class="fc-note">${esc(f.note || '')}</div>
  </div>`;
}

function renderDetail(id) {
  const n = byId.get(id);
  if (!n) return;
  current = n;
  // 给每张卡发一个序号当身份，避免后面按 path 找回时抓错同一文件的另一段
  const pool = [];
  const groupsHtml = ['r', 'w'].map(rw => {
    const arr = (rw === 'r' ? (n.reads || []) : (n.writes || []));
    if (!arr.length) return '';
    const cards = arr.map(f => {
      pool.push(f);
      return fileCard(f, rw, pool.length - 1);
    }).join('');
    return `<div class="fgroup"><div class="fg-t">${rw === 'r' ? '依赖的输入' : '产出的输出'}
      <span class="cnt">${arr.length} 项</span></div>${cards}</div>`;
  }).join('');
  const exCards = (n.files || []).map(f => {
    pool.push(f);
    return fileCard(f, '-', pool.length - 1);
  }).join('');

  detail.innerHTML = `
    <div class="d-head">
      <div class="d-step">步骤 ${esc(n.step || '·')}</div>
      <div class="d-title">${esc(n.title)}</div>
      <div class="d-meta">
        ${n.actor ? `<span class="tag who">${esc(n.actor)}</span>` : ''}
        ${n.when ? `<span class="tag when">${esc(n.when)}</span>` : ''}
      </div>
      ${n.one_liner ? `<div class="d-one">${esc(n.one_liner)}</div>` : ''}
    </div>
    <div class="d-body">
      ${(n.does || []).length ? `<h3 class="sec">这一步做了什么</h3>
        <ul class="list">${n.does.map(d => `<li>${hlRef(d)}</li>`).join('')}</ul>` : ''}
      ${(n.why || []).length ? `<h3 class="sec">为什么这样设计</h3>
        <ul class="list why">${n.why.map(d => `<li>${hlRef(d)}</li>`).join('')}</ul>` : ''}
      ${groupsHtml}
      ${(n.files || []).length ? `<div class="fgroup">
        <div class="fg-t">点开看原文 <span class="cnt">${n.files.length} 段摘录</span></div>
        ${exCards}</div>` : ''}
    </div>`;
  detail.querySelectorAll('.fcard').forEach(c => c.onclick = () => {
    const f = pool[+c.dataset.key];
    openFile(f);
    detail.querySelectorAll('.fcard').forEach(x => x.classList.toggle('on', x === c));
  });
  detail.scrollTop = 0;
  document.querySelectorAll('.node-i').forEach(x => x.classList.toggle('on', x.dataset.id === id));
}

// ── viewer ────────────────────────────────────────────────
const viewer = document.getElementById('viewer');
function renderCode(text, startLine, hits) {
  return text.split('\n').map((t, i) => {
    const ln = startLine ? startLine + i : null;
    let tx = esc(t);
    hits.forEach(h => {
      const re = new RegExp('(' + h.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&') + ')', 'gi');
      tx = tx.replace(re, '<span class="hit">$1</span>');
    });
    return `<div class="row${hits.length && tx.includes('class="hit"') ? ' hl' : ''}">
      <span class="ln">${ln ?? ''}</span><span class="tx">${tx}</span></div>`;
  }).join('');
}
function openFile(f) {
  const hits = searchTerm ? [searchTerm] : [];
  const isRaw = f.start !== null && f.start !== undefined;
  const entry = FILEMAP.get(f.path);
  const refs = entry ? entry.nodes
    .map(id => byId.get(id))
    .filter(Boolean)
    .map(n => `${n.step} ${n.title}`) : [];
  viewer.className = 'col open';
  viewer.innerHTML = `
    <div class="v-head">
      <div class="v-path">${esc(f.path)}</div>
      ${f.note ? `<div class="v-note">${hlRef(f.note)}</div>` : ''}
      <div class="v-tags">
        <span class="tag">${isRaw
          ? `第 ${f.start}–${f.end} 行 / 共 ${f.total} 行`
          : `结构化视图 · 共 ${f.total} 行`}</span>
        ${isRaw && f.total ? `<span class="tag">偏移 ${((f.start - 1) / f.total * 100).toFixed(1)}%</span>` : ''}
      </div>
      <div class="v-src">来源：仓库真实文件，由 ${esc(META.source_script || 'build_facts.py')} 切片${
        refs.length ? ' ｜ 被 ' + refs.length + ' 个环节引用：' + refs.join('、') : ''}</div>
    </div>
    <pre class="code">${renderCode(f.text, isRaw ? f.start : 1, hits)}</pre>`;
  viewer.scrollTop = 0;
  if (hits.length) {
    const h = viewer.querySelector('.row.hl');
    if (h) h.scrollIntoView({block: 'center'});
  }
}
viewer.innerHTML = `<div class="v-empty">
  <div style="font-size:32px;opacity:.35">◲</div>
  <div>点任一文件卡片，这里显示它的真实原文</div>
  <div><kbd>←</kbd> <kbd>→</kbd> 切换环节 · <kbd>/</kbd> 搜索</div>
</div>`;

// ── search ────────────────────────────────────────────────
let searchTerm = '';
const searchBox = document.getElementById('search');
searchBox.addEventListener('input', () => {
  searchTerm = searchBox.value.trim().toLowerCase();
  filter();
});
function filter() {
  const t = searchTerm;
  document.querySelectorAll('.node-i').forEach(el => {
    if (el.classList.contains('file-i')) {
      const e = FILEMAP.get(el.dataset.path);
      const body = e ? (e.file.path + ' ' + (e.file.note || '') + ' ' + e.file.text).toLowerCase() : '';
      el.classList.toggle('hide', !!t && !body.includes(t));
      return;
    }
    const n = byId.get(el.dataset.id);
    if (!n) return;
    const body = hay(n) + ' ' + [...(n.reads || []), ...(n.writes || []), ...(n.files || [])]
      .map(f => f.path + ' ' + (f.note || '') + ' ' + f.text).join(' ').toLowerCase();
    el.classList.toggle('hide', !!t && !body.includes(t));
  });
  if (!t) return;
  // 搜到内容时自动跳到第一个真正命中**正文**的片段：
  // 用户搜的是现象，他想看的是代码里那一行，不是"哪个环节提到了这个词"
  for (const n of NODES) {
    const f = [...(n.reads || []), ...(n.writes || []), ...(n.files || [])]
      .find(f => f.text.toLowerCase().includes(t));
    if (f) { select(n.id); openFile(f); break; }
  }
}
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchBox) { e.preventDefault(); searchBox.focus(); }
  if (e.key === 'Escape') { searchBox.value = ''; searchTerm = ''; filter(); searchBox.blur(); }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && document.activeElement !== searchBox && current) {
    const i = order.indexOf(current.id);
    if (i < 0) return;
    const j = (i + (e.key === 'ArrowRight' ? 1 : -1) + order.length) % order.length;
    e.preventDefault(); select(order[j]);
  }
});

function select(id) {
  renderDetail(id);
  const el = document.querySelector(`.node-i[data-id="${id}"]`);
  if (el) el.scrollIntoView({block: 'nearest'});
}
select(order[0] || NODES[0].id);
</script>
</body>
</html>
